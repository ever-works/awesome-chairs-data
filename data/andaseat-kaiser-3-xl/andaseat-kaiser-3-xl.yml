name: AndaSeat Kaiser 3 XL
description: AndaSeat Kaiser 3 XL is a premium big & tall gaming chair with NEO
  hybrid leatherette (breathable, durable), 4D armrests, swappable magnetic head
  pillow/lumbar, and 165° recline for 400lbs users. Designed for esports
  marathons and programmers, better ventilation than DXRacer Master.
