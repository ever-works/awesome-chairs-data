  - Dimensions: 29.3 x 52.76in / 74 x 134cm (width x max height)
  - Maximum user weight: 395lb / 180kg
  - Recline angle: 90-165°
  - Warranty: 2 years

  ## Features

  - Integrated adjustable lumbar support
  - Robust steel chassis and castor wheels
  - Wide seat and ergonomic design
  - Easy assembly

  ## Pricing

  Great value at ~$500.
