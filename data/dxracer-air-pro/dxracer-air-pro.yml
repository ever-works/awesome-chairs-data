name: DXRacer Air Pro
description: Eco-friendly gaming chair constructed from recycled materials,
  featuring ultra-breathable form-fitting design, magnetic lumbar support with
  plush memory foam, high-strength components, and highly-adjustable ergonomics
  across six colorways, supporting up to 330 lbs with 90°–135° recline. Ideal
  for environmentally-conscious gamers and office workers seeking premium
  breathable comfort with sustainability credentials. Compared to the Herman
  Miller Vantum's mesh-backed office-grade design, the Air Pro offers a more
  gaming-focused aesthetic with recycled materials at roughly half the price.
