name: DXRacer Air Pro
description: Ergonomic gaming chair designed for marathon sessions in esports,
  streaming, and PC building. Key features include 135° recline, 4D armrests,
  breathable recycled fabric, magnetic memory foam lumbar support, and
  high-strength components supporting up to 330 lbs. More stylish and flashy
  than subtle office chairs like Aeron but less understated; offers superior
  lumbar tracking compared to Razer Iskur.
