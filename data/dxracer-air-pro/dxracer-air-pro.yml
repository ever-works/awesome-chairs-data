markdown: >-
  ## Overview


  The Air Pro model was created with recycled, eco-friendly materials and offers
  ultra-breathable, form-fitting, luxury comfort across six different color
  schemes such as Black/White, Red, and standard Black.


  ## Features


  - **Eco-Friendly Materials**: Constructed from recycled, sustainable materials

  - **Ultra-Breathable Design**: Advanced airflow system for temperature
  regulation

  - **Magnetic Lumbar Support**: Memory foam-filled lumbar cushion with magnetic
  attachment

  - **High-Strength Components**: Durable construction for long-term use

  - **Highly-Adjustable Ergonomics**: Comprehensive customization options

  - **Multiple Color Options**: Six different color schemes available


  ## Specifications


  - Weight Capacity: Up to 330 lbs

  - Recline Range: 90° to 135°

  - Warranty: 2-year manufacturer warranty

  - Certifications: Eco-friendly materials certified


  ## Pricing


  Starting at $499
