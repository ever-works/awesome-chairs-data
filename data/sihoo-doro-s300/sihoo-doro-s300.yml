markdown: >-
  ## Overview


  The Sihoo Doro S300 is one of Sihoo's most advanced ergonomic chairs, designed
  with superior back support and featuring an innovative anti-gravity mechanism
  that reduces pressure on your spine. This premium chair offers an exceptional
  combination of comfort and support for professionals who spend long hours
  seated.


  ## Features


  - **Anti-Gravity Mechanism**: Reduces spinal pressure through innovative
  weight distribution

  - **Dynamic Lumbar Support**: Advanced adjustable lumbar system

  - **Premium Build Quality**: High-grade materials and construction

  - **Full Adjustability**: Comprehensive ergonomic adjustments

  - **High-Density Mesh**: Superior breathability and durability

  - **Integrated Headrest**: Built-in head and neck support


  ## Specifications


  - Weight Capacity: Up to 330 lbs

  - Recline Range: Up to 135 degrees

  - Warranty: 5-year manufacturer warranty

  - Certifications: BIFMA certified


  ## Pricing


  Starting at $699.99
