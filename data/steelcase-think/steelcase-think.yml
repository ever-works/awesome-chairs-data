name: Steelcase Think
description: The Steelcase Think is a lightweight ergonomic task chair priced
  around $1,100, featuring a highly flexible backrest and 4D adjustable armrests
  optimized for moderate-use scenarios like conference rooms and shared
  workspaces. Its minimal seat padding and reduced lower-back support make it
  less ideal for 8+ hour all-day sessions compared to the Steelcase Leap or
  Herman Miller Aeron, though it still accommodates typical office body types up
  to 300 lbs. It serves as a mid-market step down from the Gesture and Leap,
  offering clean aesthetics and responsive movement at the cost of
  extended-session comfort.
