name: Herman Miller Aeron Chair
description: Iconic ergonomic mesh chair for 24/7 use featuring Pellicle
  suspension for airflow, PostureFit for spinal alignment, and CAR tilt for
  natural recline. Outperforms gaming PU leather chairs in breathability, ideal
  for coders and office workers. 12-year warranty with sizes A, B, and C
  available.
source_url: https://www.hermanmiller.com/products/seating/office-chairs/aeron-chair/
category: ergonomic-office-chairs
tags:
