name: Herman Miller Aeron Chair
description: "Iconic ergonomic mesh chair for marathon sitting (8-12+ hrs), uses
  breathable Pellicle suspension to distribute weight evenly, PostureFit SL
  lumbar/sacral support mimics spine curve. Superior to budget alternatives like
  Sihoo with 12-yr warranty, premium adjustability (tilt, arms, height). Use
  cases: coding, office endurance vs. gaming PU leather (less breathable)."
