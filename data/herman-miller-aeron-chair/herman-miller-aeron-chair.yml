name: Herman Miller Aeron Chair
description: Breathable Pellicle mesh suspension and PostureFit lumbar support
  maintain posture and comfort during 12+ hour desk marathons. Comprehensive
  adjustability including 4D arms, tilt mechanisms, and size variants fits
  programmers for extended hours and office environments. More breathable than
  gaming chairs with superior durability compared to budget options.
