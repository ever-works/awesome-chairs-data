name: Herman Miller Aeron Chair
description: Iconic Herman Miller Aeron uses Pellicle mesh suspension for
  breathability and support, PostureFit SL lumbar, and fully adjustable tilt for
  ergonomic precision in office/gaming hybrids. Available in three sizes,
  12-year warranty, weight-activated mechanism. Gold standard for long-hour
  sitting, outshines mesh competitors like Sihoo with superior durability and
  airflow.
