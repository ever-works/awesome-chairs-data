name: Herman Miller Aeron Chair
description: Herman Miller Aeron Chair excels in all-day sitting and gaming by
  supporting posture over 12+ hour sessions with breathable Pellicle mesh and
  adjustable PostureFit lumbar support. Key features include fully adjustable
  arms, advanced tilt mechanisms, and three size options for custom fit. Ideal
  for esports, programming marathons, hybrid office/gaming setups; provides
  exceptional durability and ergonomics superior to standard racing chairs like
  DXRacer.
source_url: https://www.hermanmiller.com/products/seating/office-chairs/aeron-chair/
