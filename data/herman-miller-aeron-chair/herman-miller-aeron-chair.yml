name: Herman Miller Aeron Chair
description: Features innovative Pellicle mesh suspension for all-day comfort,
  PostureFit for spine support, and fully adjustable design ideal for long hours
  at the computer or gaming. Perfect for programmers and gamers needing
  ergonomic support. More office-focused, breathable, and premium-built compared
  to gaming chairs like Secretlab.
