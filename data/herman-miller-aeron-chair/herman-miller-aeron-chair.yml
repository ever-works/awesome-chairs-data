name: Herman Miller Aeron Chair
description: Herman Miller Aeron is an iconic mesh chair with PostureFit support
  for breathable, adjustable comfort during 8+ hour workdays. Legendary for
  ergonomics, it provides better airflow than leather gaming chairs like
  Secretlab, though higher priced. Features include Pellicle mesh, tilt limiter,
  and sizes A/B/C.
