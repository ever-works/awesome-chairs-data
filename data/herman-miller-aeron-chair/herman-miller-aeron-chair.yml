name: Herman Miller Aeron Chair
description: Posture-perfecting ergonomic chair for 8+ hour use with breathable
  Pellicle mesh suspension, PostureFit SL for spinal alignment, and fully
  adjustable everything including arms, tilt, and size variants (A/B/C). Perfect
  for programmers, office workers, and gamers needing endurance support.
  Superior to gaming chairs' racer style in ergonomics and to budget chairs via
  12-year warranty.
source_url: https://www.hermanmiller.com/products/seating/office-chairs/aeron-chair/
