name: Sihoo C300 PRO
description: The Sihoo C300 PRO is a premium mid-range ergonomic chair featuring
  a multi-dimensional headrest, adaptive lumbar support system, and a full mesh
  backrest for breathable 8+ hour desk sessions up to 300 lbs. Its waterfall
  seat edge and multi-directional headrest suit WFH and corporate workers who
  want elevated ergonomics under $300. Compared to the Herman Miller Aeron's
  PostureFit SL and the Steelcase Leap's LiveBack, it offers comparable mesh
  breathability and headrest adjustability at roughly a fifth of the price,
  though with a shorter 2-year warranty and more plastic construction.
