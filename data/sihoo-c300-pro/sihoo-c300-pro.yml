markdown: >-
  # Sihoo C300 PRO - Ergonomic Office Chair


  ## Overview

  The **Sihoo C300 PRO** is an advanced ergonomic office chair designed for
  professionals who spend long hours at a desk.


  ## Features

  - **Multi-Dimensional Headrest**: Adjustable in height, depth, and angle for
  neck support

  - **Adaptive Lumbar Support**: Auto-adjusting lower-back support that follows
  your posture

  - **Full Mesh Backrest**: Breathable design for all-day cooling

  - **3D Adjustable Armrests**: Height, width, and angle adjustment

  - **Waterfall Seat Edge**: Reduces thigh pressure during extended sitting

  - **Tilt Lock**: Multiple recline positions with tension control


  ## Specifications

  - Weight Capacity: 300 lbs

  - Warranty: 2-Year Manufacturer Warranty

  - Seat Height: 17.7"–21.6"


  ## Pricing

  Approximately $279–$319. Visit [Sihoo C300
  PRO](https://sihoooffice.com/collections/gaming-chair) for current pricing.
