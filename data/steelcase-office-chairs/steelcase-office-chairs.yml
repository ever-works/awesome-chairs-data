markdown: >-
  # Steelcase Office Chairs


  A collection of ergonomic office and task chairs from Steelcase, a global
  workplace solutions company.


  ## Product Range

  - **Steelcase Leap**: Flagship with LiveBack technology, 4D arms (entry
  ~$1,300)

  - **Steelcase Gesture**: 3D LiveBack with 360° arms, Wirecutter's top pick
  (entry ~$1,300)

  - **Steelcase Karman**: Lightweight hybrid suspension, 29 lbs build (entry
  ~$1,500)

  - **Steelcase Think**: Flexible backrest, optimized for shorter sessions
  (~$1,100)

  - **Steelcase Series 1/2**: Mid-range ergonomic basics (~$500–$800)


  ## Key Technologies

  - **LiveBack / 3D LiveBack**: Spine-tracking backrest

  - **4D/360° Arms**: Industry-leading armrest adjustability

  - **Weight capacities**: 275–500 lbs depending on model


  For more information, visit [Steelcase
  Seating](https://www.steelcase.com/products/seating/).
