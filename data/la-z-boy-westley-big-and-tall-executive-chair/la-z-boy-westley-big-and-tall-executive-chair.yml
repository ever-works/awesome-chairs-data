name: La-Z-Boy Westley Big and Tall Executive Chair
description: Executive-style 400 lb capacity chair with oversized wide seat,
  bonded leather, and memory-foam lumbar for big & tall professionals in hybrid
  office/gaming; AIR tech enhances breathability. Outdoes Serta Fairbanks
