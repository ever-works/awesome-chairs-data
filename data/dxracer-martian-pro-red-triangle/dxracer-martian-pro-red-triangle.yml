name: DXRacer Martian Pro Red Triangle
description: Premium temperature-controlled gaming chair with built-in heating,
  cooling, and massage systems on a solid steel frame, featuring EPU leatherette
  upholstery, 4D lumbar and armrest adjustments, a magnetic headrest, motorized
  135° recline, and a battery pack delivering up to 360 hours per charge.
  Designed for serious gamers who experience temperature discomfort during
  extended sessions. At $900, it competes directly with the Herman Miller Vantum
