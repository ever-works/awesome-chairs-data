name: Sihoo M56B Ergonomic Chair
description: The Sihoo M56B is a budget-friendly ergonomic office chair
  featuring a breathable mesh backrest, adjustable lumbar support, 3D armrests,
  and a high-back frame with integrated headrest for 6–8 hour desk sessions
  rated up to 300 lbs. Designed for WFH and gaming setups where comprehensive
  adjustability is needed at entry-level pricing. Compared to the Steelcase
  Leap's premium LiveBack and the Herman Miller Aeron's PostureFit, it offers
  simpler mesh-based support with headrest and arm controls at roughly
  $180–$250.
