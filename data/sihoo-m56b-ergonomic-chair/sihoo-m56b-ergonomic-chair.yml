markdown: >-
  ## Sihoo M56B Ergonomic Chair


  ### Features

  - **High-back mesh design**: Comprehensive back and shoulder support

  - **Adjustable lumbar support**: Customizable lower-back alignment

  - **Integrated headrest**: Height and angle adjustment for neck support

  - **3D armrests**: Height, depth, and angle control

  - **Breathable mesh**: Airflow for extended sessions

  - **Tilt mechanism**: Standard recline with tension control


  ### Specifications

  - Weight Capacity: 300 lbs


  ### Pricing

  Approximately $180–$250. Visit the [Sihoo M56B
  page](https://sa.sihoo.com/products/sihoo-m56b-office-chair) for current
  pricing.
