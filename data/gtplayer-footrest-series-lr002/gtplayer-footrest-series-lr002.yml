name: GTPLAYER Footrest Series LR002
description: Budget-friendly gaming chair at approximately $120 featuring PU
  leather upholstery, removable lumbar and neck pillows, height-adjustable
  armrests, 90°–155° recline with tilt lock, retractable retractable footrest,
  and a 280 lb weight capacity. Ideal for budget-conscious first-time buyers and
  casual gamers who want footrest comfort at an affordable price. Compared to
  the BestOffice and Homall entry models, it differentiates with its retractable
  footrest, though it still lacks the integrated lumbar, 4D armrests, and
  premium build of the Secretlab Titan Evo or Herman Miller Vantum.
