markdown: >-
  ## Overview


  The Varier Wing is an unconventional working chair that combines kneeling
  chair ergonomics with the functionality of a traditional swivel office chair.
  Its height adjustment, swivel, and tilt functions make it versatile for any
  workspace.


  ## Features


  - Height-adjustable design ideal for any desk or table height, even above
  standard heights

  - 360-degree swivel function for easy workspace mobility

  - Tilt functions for dynamic movement

  - Castor wheels available for hard or soft floors

  - Promotes active sitting and deep breathing

  - Boosts energy levels and concentration

  - Forward-tilt capability for proper spinal alignment

  - Designed to prevent prolonged static sitting


  ## Use Cases


  Ideal for professionals who want kneeling chair posture benefits combined with
  the convenience of a traditional adjustable office chair. Especially
  well-suited for users with non-standard desk heights.
