name: GTRACING CH405
description: 2026 model budget gaming chair designed for all-day comfort in
  gaming and programming sessions, optimized for petite to medium builds with
  premium breathable mesh fabric that regulates temperature and reduces sweat
  during extended use. It features 3D adjustable armrests, 3-stage recline up to
  155 degrees, and a high 300 lbs weight capacity for robust support. Ideal for
  streamers and programmers needing hybrid office-gaming ergonomics; offers
  superior breathability and affordability compared to DXRacer's leather-heavy
  models.
