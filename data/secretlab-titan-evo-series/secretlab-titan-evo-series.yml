markdown: >-
  ## Secretlab Titan Evo Series


  ![Secretlab Titan Evo
  Series](https://secretlab.co/images/titan-evo-2025-front.png)


  ### Overview

  The **Secretlab Titan Evo Series** is a high-end gaming chair designed to
  provide comfort and support during long hours of sitting. It is ideal for
  gamers and professionals who require ergonomic seating solutions.


  ### Features

  - **Ergonomic Design**: Proprietary pebble seat base for optimal support.

  - **Material Options**:
    - **Secretlab SoftWeave™ Plus Fabric**: Enhanced breathability and durability.
    - **Secretlab NEO™ Hybrid Leatherette**: Luxurious feel, 12x more durable than standard PU leather.
  - **Lumbar Support**: 4-way L-ADAPT™ Lumbar Support System for customizable
  back support.

  - **Armrests**: Full-metal 4D Armrests with CloudSwap™ Replacement System.

  - **Head Pillow**: Patented Magnetic Memory Foam Head Pillow for added
  comfort.

  - **Recline and Tilt**:
    - Full-length backrest with 165° of recline.
    - Multi-tilt mechanism for enhanced flexibility.
  - **Hydraulics**: Shorter, re-engineered Class 4 Hydraulics for improved
  stability.

  - **Wheelbase and Casters**: ADC12 Aluminum Wheelbase with XL PU casters for
  smooth movement.

  - **Warranty**: Up to a 5-year Extended Warranty available.

  - **Anti-Counterfeit**: NFC anti-counterfeit tag for authenticity
  verification.

  - **Foam**: Patent-pending cold-cure foam mix for even weight distribution and
  pressure relief.


  ### Sizes

  - **Small**: Suitable for individuals ≤5'6" and <200lbs.

  - **Regular**: Suitable for individuals 5'7"-6'2" and <220lbs.

  - **XL**: Suitable for individuals 5'11"-6'9" and 175lbs-395lbs.


  ### Pricing

  For the latest pricing and offers, visit the [Secretlab Titan Evo Series
  page](https://secretlab.co/pages/titan-evo-2022-series).


  ### Brand

  ![Secretlab Logo](https://secretlab.co/images/brand-logo.png)

  **Brand**: Secretlab


  For more information and to purchase, visit the [Secretlab
  website](https://secretlab.co/pages/titan-evo-2022-series).
