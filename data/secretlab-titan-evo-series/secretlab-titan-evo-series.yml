name: Secretlab Titan Evo Series
description: The Titan Evo collection spans three sizes (Small, Regular, XL)
  with 4-way lumbar adjustment, cold-cure foam seating, and up to 165° recline —
  making it adaptable for petite gamers to big-and-tall users up to 395 lbs.
  Designed for streamers, esports players, and remote workers who need reliable,
  all-day ergonomic support without sacrificing aesthetics. Compared to
  single-size competitors like the Razer Iskur V2 or DXRacer Air Pro, the Titan
  Evo's sizing breadth and magnetic accessory ecosystem give it a distinct edge
  in fitting a wider range of body types.
