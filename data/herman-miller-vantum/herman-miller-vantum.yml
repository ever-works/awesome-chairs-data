name: Herman Miller Vantum
description: The Vantum marks Herman Miller's first dedicated gaming chair,
  co-engineered with Logitech G to bring office-grade ergonomics to the gaming
  desk with a knit-mesh backrest, dedicated adjustable lumbar, thoracic shoulder
  pads, and a waterfall-edge foam seat. Its breathable, posture-conscious design
  appeals to serious gamers and work-from-home hybrid users up to 350 lbs who
  value long-session cooling and 12-year durability over a flashy racing
  aesthetic. At $930 it sits in the premium gaming tier — above mass-market
  gaming chairs but below Herman Miller's top office models.
