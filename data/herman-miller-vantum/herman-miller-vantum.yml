markdown: >-
  ## Overview


  The Herman Miller Vantum is Herman Miller's first dedicated gaming chair,
  designed in collaboration with Logitech G. It combines the comfort of a gaming
  chair with the support and ergonomics of a premium office chair, making it
  ideal for those who both game and work from home.


  ## Features


  - Knit mesh backrest and headrest for breathability during long sessions

  - Fabric seat with comfortable foam cushion and waterfall edge to prevent
  pressure buildup

  - Adjustable dedicated lumbar support mechanism

  - Thoracic pads in the backrest to support upper back and shoulders, not just
  the lower back

  - Aluminum base for durability

  - Multiple two-tone color combinations available

  - 117-degree recline angle

  - Supports up to 350 pounds

  - Seat height range: 40.25 - 44.25 inches

  - Dimensions: 30.5 x 29 x 44.25 inches (W x D x H)


  ## Pricing


  The Herman Miller Vantum is priced at $930. It is positioned as a premium
  investment piece for serious gamers who also work from home.


  ## Warranty


  Comes with a 12-year warranty, reflecting Herman Miller's confidence in the
  chair's long-term durability.
