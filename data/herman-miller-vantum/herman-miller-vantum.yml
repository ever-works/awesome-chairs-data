markdown: >-
  ## Overview


  The Herman Miller Vantum gaming chair, developed with Logitech G, blends
  office ergonomics with gaming design for hybrid use. Features performance knit
  back and advanced tilt for prolonged comfort.


  ## Features


  - Knit mesh backrest and headrest for breathability

  - Adjustable lumbar and thoracic support pads

  - Fabric seat with waterfall edge for circulation

  - Aluminum base, 117-degree recline, 350 lb capacity

  - More gaming-focused adjustments vs standard Aeron


  ## Pricing


  $930 with 12-year warranty.
