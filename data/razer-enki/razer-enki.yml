name: Razer Enki
description: Ergonomic gaming chair with wide seat, seamless PU leather, and
  adjustable armrests, recline up to 160°, and lumbar for long gaming/office
  hybrid sessions. Racing-inspired style like DXRacer but with contoured lumbar
  curve differing from pillow-based designs for better posture support. Suited
  for immersive gaming and daily work endurance.
