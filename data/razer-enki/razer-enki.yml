name: Razer Enki
description: Gaming chair with 160° recline capability for full relax during
  gaming breaks or desk napping, featuring footrest and massage options.
  Optimized weight distribution and ergonomic design reduce fatigue for all-day
  use. Deeper recline than standard office chairs; premium build similar to
  Secretlab Titan but with Razer styling and leather.
