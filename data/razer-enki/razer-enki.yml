markdown: >-
  ## Overview


  Razer Enki offers ergonomic support with 152-160° recline for gaming breaks
  and hybrid use.


  ## Features


  - Recline: Up to 160°

  - Footrest: Included

  - Adjustable lumbar

  - Multi-layer synthetic leather (PU)

  - Wide contoured seat


  ## Use Cases


  - Gaming marathons

  - Office hybrid setups


  ## Pricing


  Premium pricing.
