markdown: >-
  ## Overview


  The Sminuo Gaming Chair is a large, robustly-built gaming chair priced close
  to £200. Its generous sizing and heavy-duty construction make it suitable for
  gamers of all ages and sizes. It features a wingback design with a subtle
  sports contour and faux suede upholstery — an alternative for those who
  dislike PVC or leather.


  ## Features


  - **Material**: Faux suede upholstery with aluminium frame

  - **Lumbar Support**: Cushion-style lumbar pillow (comfortable and good fit
  for chair shape)

  - **Armrests**: 2D adjustable armrests — 2" height adjustment and 30° rotation

  - **Recline**: 90°–150° tilt with Class 3 gas lift

  - **Footrest**: Slide-out retractable footrest

  - **Build**: Extremely solid and robust construction


  ## Specifications


  | Specification | Detail |

  |---|---|

  | Weight | 22 kg |

  | Maximum Load | 200 kg |

  | Seat Height | 43–52 cm |

  | Seat Width | 40 cm |

  | Seat Depth | 59 cm |

  | Backrest Height | 83 cm |

  | Backrest Width | 56 cm |

  | Casters | Smooth-rolling |


  ## Pricing


  Approximately $149.99 (£149.99). The chair offers premium-like features at
  this price point, though users with lower back issues may want built-in lumbar
  support rather than a cushion.
