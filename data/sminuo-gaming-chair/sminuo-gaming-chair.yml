name: Sminuo Gaming Chair
description: Large gaming chair near $150 featuring faux suede upholstery with
  an aluminum frame, 2D adjustable armrests, retractable footrest, cushion-style
  lumbar pillow, wingback design, and a 200 kg (440 lb) weight capacity with
  Class 3 gas lift and 90°–150° recline. Built for larger gamers who prefer
  suede over synthetic leather and need a heavy-duty seat without premium
  pricing. It supports significantly more weight than the Secretlab Titan Evo
  (440 lbs vs 285 lbs standard) at under one-fifth the price, though it lacks
  the Titan's integrated lumbar and 4D armrest refinement.
