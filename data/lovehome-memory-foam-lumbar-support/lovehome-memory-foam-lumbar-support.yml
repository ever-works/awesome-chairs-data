markdown: >-
  ## Overview


  The LoveHome Memory Foam Lumbar Support is an affordable pillow-style lumbar
  support that helps keep the back straight and supported. It is suitable for
  use in office chairs, cars, or wheelchairs.


  ## Features


  - Memory foam construction for comfortable back support

  - Helps promote proper posture by keeping the back straight

  - Washable cover

  - Two adjustable straps plus an extension strap to secure the pillow to the
  seat

  - Versatile: usable in office chairs, cars, and wheelchairs


  ## Pricing


  Priced at approximately $22, making it an affordable option to try before
  investing in a new chair with built-in lumbar support.
