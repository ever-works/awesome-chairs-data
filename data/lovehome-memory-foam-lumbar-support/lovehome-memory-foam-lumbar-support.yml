name: LoveHome Memory Foam Lumbar Support
description: Contoured memory foam lumbar pillow that supports the natural
  inward curve of the lower spine to correct slouching and reduce back fatigue.
  Secures to most office chairs, car seats, and wheelchairs via adjustable
  straps with an extension band for a firm fit. The breathable foam core and
  removable washable cover provide affordable posture support and lasting
  comfort.
