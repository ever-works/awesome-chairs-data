markdown: >-
  ## Overview


  The Aspenhome Skylar Executive Office Chair (also referenced as Eloise in some
  product lines) features a distinctive crocodile-textured genuine leather
  finish contrasting with a softly lustrous metal base for a subtle yet striking
  premium aesthetic.


  ## Materials


  - Crocodile-textured genuine leather finish

  - Hand-upholstered leather surface

  - Three-dimensional stitching details

  - Polished metal base


  ## Design Highlights


  - High-density foam filling for lasting comfort

  - Slight tilt angle for easy transitions between work and relaxation

  - Adjustable pneumatic lift

  - Smooth casters maintaining elegant appearance with practicality

  - Art furniture-like presence suited for executive offices, meeting spaces,
  and home studies

  - Distinctive leather texture and graceful curves that complement user's
  professionalism


  ## Pricing


  Retail price: approximately US$1,539.99
