name: Aspenhome Skylar Executive Office Chair
description: An executive armchair featuring crocodile-textured genuine leather
  upholstery with hand-applied stitching, high-density foam cushioning, and a
  pneumatic lift with basic tilt function. Designed for executive offices,
  boardrooms, and home studies where aesthetic presence matters as much as
  seated comfort. Compared to the Herman Miller Aeron or Steelcase Leap, it
  prioritizes luxury materials and visual impact over clinical ergonomic
  adjustability, lacking independent lumbar control or mesh breathability for
  extended desk sessions.
