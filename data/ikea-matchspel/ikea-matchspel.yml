name: Ikea Matchspel
description: Budget gaming chair around $249 featuring a high-back
  mesh-and-fabric design, adjustable armrests, pneumatic height adjustment, tilt
  mechanism with lock, and integrated lumbar support, supporting up to 243 lbs.
  Ideal for budget-conscious first-time gaming chair buyers, students, and
  secondary setups where breathable comfort at a moderate price matters. While
  it offers adjustable armrests better than most entry-level gaming chairs and
  outperforms BestOffice or Homall alternatives in build quality, it trades the
  Secretlab Titan Evo's 4D armrests and integrated lumbar precision for a
  fixed-headrest and firmer seat profile at roughly half the price.
