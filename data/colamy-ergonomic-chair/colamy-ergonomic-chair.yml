name: Colamy Ergonomic Chair
description: A standout under-$300 ergonomic chair featuring seat depth
  adjustment comparable to the Steelcase Gesture, supportive mesh backrest,
  adjustable headrest, and an intuitive button-and-lever system with tactile
  click confirmation rated at up to 300 lbs. Ideal for WFH and home office users
  who want near-premium adjustability on a tight budget. Compared to the
  Gesture's $1,830 price tag and LiveBack lumbar, the Colamy delivers
  Gesture-level seat depth customization and well-built mechanisms at under
  $280, though with a less refined build and shorter warranty.
