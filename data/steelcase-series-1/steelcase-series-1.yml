name: Steelcase Series 1
description: The Steelcase Series 1 is an entry-level ergonomic office chair
  starting around $500, featuring 4-way adjustable arms, a weight-activated tilt
  mechanism, and quality Steelcase frame construction for standard desk sessions
  rated up to 275 lbs. Designed for budget-conscious buyers who want reliable
  Steelcase engineering in small to medium builds for daily WFH or office use.
  Compared to the Steelcase Leap's extensive LiveBack adjustments and the Herman
  Miller Aeron's PostureFit SL, it provides basic ergonomic support with fewer
  fine-tuning controls as the most affordable Steelcase option.
