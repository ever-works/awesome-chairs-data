markdown: >-
  # AndaSeat Novis Series Gaming Chair


  ![AndaSeat Logo](https://www.andaseat.com/logo.png)


  ![AndaSeat Novis Series](https://www.andaseat.com/images/novis-series-1.png)


  ## Overview

  The AndaSeat Novis Series Gaming Chair is designed to deliver premium features
  without breaking the bank. It is an ideal choice for both gamers and
  professionals who spend extended periods seated. Offering ergonomic support
  and a stylish design, it competes with higher-priced alternatives.


  ## Features

  - **Ergonomic Design**: Ensures comfort with a focus on supporting natural
  body posture.

  - **5cm Raised Lumbar Support**: Uniquely mimics the spine's natural curve for
  enhanced back support.

  - **Custom Adjustability**: Offers personalized comfort with adjustable
  components.

  - **7cm Up-Down Armrests**: Allows for fine-tuning arm support to suit
  individual preferences.

  - **Optional Pillows**: Provides additional comfort as needed.


  ## Awards

  - **Best Luxury Tech and Gadgets – Global 2025 Winner**: Recognized for
  redefining luxury in ergonomic seating.


  ## Pricing

  - **Current Price**: $229 (originally $249)

  - **Discount**: $20 OFF during promotional periods


  ## Additional Information

