name: AndaSeat Novis Series Gaming Chair
description: The AndaSeat Novis Series Gaming Chair facilitates 8+ hour sessions
  of gaming or coding with 5cm raised lumbar support shaped like the spine, 7cm
  adjustable armrests, optional pillows, and 135° recline for ergonomic
  positioning and ventilation. Its PU leather and steel build delivers reliable
  long-term use. Ideal for training marathons and streaming, it packs premium
  adjustability like Noblechairs but at budget pricing, outpacing basic racing
  chairs.
