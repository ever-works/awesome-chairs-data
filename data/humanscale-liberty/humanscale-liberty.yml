name: Humanscale Liberty
description: An ergonomic task chair featuring an adaptive self-adjusting
  recline that automatically responds to the user's weight, a mesh backrest with
  built-in lumbar support, and flip-up arm pads on a compact frame. Designed for
  users wanting Humanscale's hands-free ergonomic approach in a lighter, more
  affordable package for daily WFH or office sessions. Compared to the Herman
  Miller Aeron's manual PostureFit adjustments and the Steelcase Leap's
  extensive 4D arm controls, the Liberty takes a minimalist auto-adjusting
  approach with fewer controls and simpler mechanics starting at $1,125.
