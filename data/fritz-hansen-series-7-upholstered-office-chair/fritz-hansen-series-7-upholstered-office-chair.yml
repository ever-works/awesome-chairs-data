name: Fritz Hansen Series 7 Upholstered Office Chair
description: An iconic Danish design office chair by Arne Jacobsen featuring a
  sculpted wood veneer shell with soft fabric upholstery on a chrome steel base
  with pneumatic height adjustment. Designed for design-focused offices, meeting
  rooms, and creative spaces where aesthetic legacy drives seating choices.
  Compared to the Herman Miller Aeron or Steelcase Leap's clinical ergonomic
  adjustability, the Series 7 provides elegant upper-back contour and visual
  sophistication but lacks adjustable lumbar, seat depth control, or back
  tension mechanisms suited for 8+ hour task seating.
