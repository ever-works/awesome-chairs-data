name: Herman Miller Mirra 2
description: The Mirra 2 is built around responsive, adaptive ergonomics — its
  one-piece TriFlex polymer backrest flexes laterally with each micro-adjustment
  while PostureFit SL provides independent sacral and lumbar support. A deep
  adjustment suite including seat-depth, tilt limiter, seat-angle, and 4D arm
  control makes it ideal for users who demand surgical precision during 8+ hour
  workdays. At roughly $1,115 it occupies the upper-mid to premium tier,
  bridging the gap between the Cosm and the fully loaded Aeron.
