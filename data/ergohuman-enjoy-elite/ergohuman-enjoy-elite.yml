name: Ergohuman Enjoy Elite
description: A 24-hour-rated premium ergonomic chair with mesh backrest,
  dual-pivot synchro mechanism maintaining a 2:1 backrest-to-seat tilt ratio,
  automatic lumbar support that follows recline, and optional leg rest and
  headrest backed by a 10-year warranty. Designed for demanding environments
  where continuous all-day use is the norm with reliable build quality. Compared
  to the Steelcase Leap's synchro-tilt with LiveBack adjustability and the
  Herman Miller Aeron's adjustable PostureFit lumbar, the Enjoy Elite matches
  similar ergonomic sophistication with a 2:1 synchronized tilt ratio at
  approximately $750.
