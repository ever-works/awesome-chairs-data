markdown: >-
  ## Overview


  The Ergohuman Enjoy Elite is a 24-hour rated chair designed for demanding
  environments such as offices and call centers. It features a dual-pivot
  synchro mechanism that maintains a 2:1 backrest-to-seat tilt ratio and an
  automatic lumbar support system.


  ## Features


  - Dual-pivot synchro-tilt mechanism with 2:1 backrest-to-seat ratio

  - Automatic lumbar support that moves with recline

  - Mesh fabric back with flexible frame

  - Adjustable seat height and tilt tension

  - Optional headrest and leg rest

  - Backed by a 10-year warranty


  ## Pricing


  Approximately $750 with optional configurations.
