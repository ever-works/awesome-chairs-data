name: DXRacer Tank Series
description: DXRacer Tank is built for big & tall users up to 400lbs with
  extra-wide seat and high backrest, using high-density foam and PU leather for
  durability in long gaming marathons. Features 135-degree recline, lumbar
  pillow, and 4D armrests; suits heavy-duty endurance seating better than
  standard gaming chairs like GTPlayer. Compared to Secretlab, wider for larger
  frames but less adjustable lumbar.
source_url: https://www.dxracer.com/us/en-us/product/6/tank-series
