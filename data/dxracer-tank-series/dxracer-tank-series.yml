name: DXRacer Tank Series
description: DXRacer Tank Series is a racing-inspired gaming chair built for
  larger users in immersive sim racing and competitive gaming, featuring
  high-density foam, PU leather or fabric, 135-180° recline, heavy-duty steel
  frame, and up to 400lbs+ capacity. It surpasses budget brands in durability
  and provides firmer, more robust support than Secretlab's softer comfort.
  Ideal for sim racing setups, esports tournaments, and daily PC use.
