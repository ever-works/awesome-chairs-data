name: DXRacer Tank Series
description: The DXRacer Tank Series is a robust big & tall gaming chair
  supporting up to 400lbs with a steel frame, extra-wide seat, and high-density
  foam padding for stability during intense gaming. Features include 4D
  armrests, lumbar pillow, and 135° recline with footrest. Suited for larger
  users in esports or sim racing; more affordable than Secretlab Titan Evo but
  with comparable durability for heavy use.
source_url: https://www.dxracer.com/us/en-us/product/6/tank-series
category: Big & Tall Chairs (400lbs+)
