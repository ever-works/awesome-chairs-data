name: DXRacer Tank Series
description: Gaming-focused big & tall chair with 400+ lb steel frame capacity,
  spacious wide seat, 4D armrests, and high-density foam for immersive long
  sessions; racing-style design excels in sim racing. Compared to BodyBilt J3504
  (office lumbar focus, 500lbs), Tank offers more gaming aesthetics but similar
  durability. Perfect for heavy users in esports or VR marathons.
