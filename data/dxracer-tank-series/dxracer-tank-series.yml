name: DXRacer Tank Series
description: DXRacer Tank Series is a robust gaming chair for larger users, with
  a steel frame supporting 350+ lbs, high-density foam padding, and 4D armrests.
  Offers deep recline, lumbar pillow, and racing-style design; suited for big &
  tall gamers or sim racing. More durable than budget options like GTRacing but
  less premium than Secretlab.
