name: DXRacer Tank Series
description: DXRacer Tank Series supports robust posture maintenance for all-day
  gaming and sitting in 12+ hour sessions, tailored for larger users with its
  400lbs capacity steel frame and high-density foam. Key features comprise 4D
  armrests, detachable lumbar pillow, 135° recline with footrest, and extra-wide
  seat base. Suited for esports pros, extended programming sessions, hybrid
  office/gaming; more durable and spacious than standard racing chairs.
