markdown: >-
  ## Overview


  Steelcase Leap V2 uses patented LiveBack technology to flex like a human
  spine.


  ## Features


  - LiveBack spine-mimicking technology

  - Adjustable lumbar support

  - 4-way adjustable arms

  - Seat depth and height adjustments

  - High-density foam for endurance


  ## Use Cases


  Dynamic support for coding marathons and office work, outperforming static PU
  leather gaming chairs.


  ## Pricing


  Refurbished bundles around $500-$800 with warranty.
