name: Respawn 110 Pro
description: The Respawn 110 Pro is a budget-friendly racing-style gaming chair
  designed for comfort during extended PC gaming sessions, featuring a sturdy
  steel frame, PU leather upholstery, adjustable lumbar support, and a
  multi-position recline up to 155 degrees. Key features include 4D armrests, a
  removable head pillow, and high-density foam padding for superior pressure
  relief compared to basic rockers like the GTPlayer. Ideal for gamers under 250
  lbs seeking value under $200.
