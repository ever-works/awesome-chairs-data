name: Herman Miller Embody Gaming Chair
description: The Herman Miller Embody Gaming Chair, co-developed with Logitech
  G, features a pixelated backrest for dynamic support mimicking spine movement,
  promoting circulation during marathon gaming sessions up to 12+ hours. Key
  features include adjustable backfit for pelvic support, no traditional lumbar
  (uses PostureFit SL), and breathable pixelated suspension; ideal for esports
  and programmers. Superior to standard gaming chairs like Secretlab in
  ergonomics and 12-year warranty, less racing-style aesthetics.
