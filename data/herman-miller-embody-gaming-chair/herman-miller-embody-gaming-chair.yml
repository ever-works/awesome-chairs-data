markdown: >-
  ### Herman Miller Embody Gaming Chair


  A gaming-focused variant of the Herman Miller Embody chair, designed for
  extended PC and console gaming sessions.


  #### Features

  - **Copper-infused cooling foam**: Improves heat dissipation during long
  sessions

  - **Additional seat foam layer**: Supports upright gaming posture

  - **BackFit adjustment**: Conforms to the unique spinal curve of each user

  - **PostureFit support**: Maintains natural pelvic tilt and open chest

  - **Adjustable arms**: Height and width adjustable

  - **Seat depth adjustment**: Slides forward/backward for coordinated movement


  #### Pricing

  - Starting at approximately $1,995. For current pricing and configuration,
  visit the [Herman Miller Embody Gaming Chair
  page](https://store.hermanmiller.com/gaming/embody-gaming-chair/).
