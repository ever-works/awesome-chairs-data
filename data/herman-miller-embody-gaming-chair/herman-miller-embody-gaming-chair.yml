name: Herman Miller Embody Gaming Chair
description: A gaming-focused iteration of the Herman Miller Embody chair,
  developed with Logitech G input, featuring a copper-infused cooling foam layer
  and an additional seat foam tier to promote active, upright gaming postures
  for 6+ hour sessions. It retains the Embody's pixel-matrix backrest for even
  weight distribution up to 300 lbs and supports PC and console use with
  adjustable height, depth, and width. Compared to the Steelcase Gesture's wide
  arm support or the Secretlab TITAN's aggressive bolsters, the Embody Gaming
  prioritizes spinal alignment over recline, making it a premium $1,995 choice
  for gamers who value ergonomics over aesthetics.
