name: Herman Miller Embody Gaming Chair
description: The Herman Miller Embody Gaming Chair features pixelated backrest
  for dynamic support mimicking spine movement, adjustable backfit for pelvic
  support, and breathable pixelated suspension. Key features include no
  traditional lumbar (uses PostureFit SL), 4D armrests optional, and backstop
  for recline. Perfect for long-hour programmers/gamers needing posture
  correction; superior to racing-style chairs with clinical ergonomics and
  12-year warranty.
