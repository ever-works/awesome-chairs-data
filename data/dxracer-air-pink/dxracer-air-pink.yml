markdown: >-
  ## Overview


  The DXRacer Air is a mesh gaming chair designed for users who prioritize
  breathability. It offers super breathable comfort in both the seat and the
  backrest, making it ideal for long gaming sessions. Available in pink
  colorway.


  ## Features


  - Mesh upholstery for maximum breathability

  - 3D adjustable armrests

  - Adjustable seat height

  - Soft memory foam pillow for neck support

  - Built-in lumbar support

  - Adjustable backrest recline

  - Upgradeable with optional accessories


  ## Optional Accessories


  - Cup holder

  - Cellphone mount

  - Footrest


  ## Ideal For


  - Gamers who sit for extended periods and need breathability

  - Users in warm climates

  - Anyone wanting a customizable gaming chair experience
