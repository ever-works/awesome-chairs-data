name: DXRacer Air Pink
description: Full-mesh gaming chair in a pink colorway with super-breathable
  seat and backrest, memory foam neck pillow, built-in lumbar support, 3D
  adjustable armrests, and adjustable seat height with recline. Designed for
  gamers in warm climates or those who want breathable comfort without
  sacrificing the racing aesthetic. Compared to the Secretlab Titan Evo, it
  replaces synthetic leather with mesh for maximum airflow, though it lacks the
  Titan's integrated lumbar adjustability and magnetic accessory ecosystem.
