name: Serta Fairbanks Big and Tall Chair
description: Heavy-duty hybrid chair for larger users up to 350lbs+ with 22-inch
  wide seat, steel-reinforced frame, and contoured lumbar, providing greater
  capacity and comfort than standard chairs for extended office or gaming.
  Features plush bonded leather, elevated headrest, and 130° recline for
  bariatric support in work-play scenarios up to 6'6\".
