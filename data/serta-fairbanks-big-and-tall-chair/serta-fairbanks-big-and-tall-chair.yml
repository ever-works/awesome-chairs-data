name: Serta Fairbanks Big and Tall Chair
description: Hybrid big & tall chair supporting 350+ lbs with 22-inch wide seat,
  steel-reinforced frame, and contoured lumbar for office/gaming endurance up to
  6'6"; plush bonded leather and 130° recline enhance comfort. Edges out
  standard chairs in capacity but trails Estevo (650lbs) in extreme duty;
  balances work-play better than gaming-focused Tank. Suited for daily 8-10 hour
  hybrid use.
source_url: https://www.serta.com
