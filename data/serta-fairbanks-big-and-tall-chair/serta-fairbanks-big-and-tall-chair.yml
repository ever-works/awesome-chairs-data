markdown: |-
  ## Features

  - 350-lb Weight Capacity
  - 22-inch Wide Seat
  - Bonded Leather Upholstery
  - Deep Plush Cushioning
  - Contoured Lumbar Zone
  - Elevated Headrest
  - Fixed Upholstered Armrests
  - 130° Recline

  ## Use Cases

  - Long office hours for bigger frames
  - Gaming sessions for tall users

  ## Pricing

  Mid-range pricing.
