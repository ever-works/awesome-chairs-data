markdown: >-
  ## Overview


  The Serta Fairbanks seamlessly blends office aesthetics with gaming comfort,
  making it ideal for hybrid work-hard, play-hard lifestyles. Built for larger
  users, it offers generous seating dimensions and plush cushioning for all-day
  comfort.


  ## Specifications


  | Feature | Details |

  |---------|--------|

  | Weight Capacity | 350 lbs |

  | Height Recommendation | 5'6\" — 6'6\" |

  | Seat Width | 22 inches |

  | Recline Range | 90° — 130° |

  | Material | Bonded Leather |

  | Armrests | Fixed, Upholstered |

  | Lumbar Support | Contoured Lumbar Zone |


  ## Features


  - **350-lb Weight Capacity**: Supports bigger frames without feeling cramped

  - **22-inch Wide Seat**: Generous seating width for larger builds

  - **Bonded Leather Upholstery**: Sleek, professional look that elevates any
  workspace

  - **Deep Plush Cushioning**: Thick padding for extended comfort without
  fatigue

  - **Contoured Lumbar Zone**: Built-in lower back support to reduce strain
  during long sessions

  - **Elevated Headrest**: Neck support designed for taller users

  - **Fixed Upholstered Armrests**: Sculpted for comfort in a permanent position

  - **130° Recline**: Switches between focused work and relaxed downtime

  - **Dual-Wheel Casters**: Smooth gliding across floors

  - **Versatile Design**: Functions equally well as an office chair and gaming
  chair


  ## Build Quality


  - Sturdy steel frame construction

  - Hefty and solidly built for stability

  - Dual-wheel caster system for mobility

  - Designed for durability and long-term use


  ## Pricing


  Mid-range pricing reflecting its dual-purpose office and gaming functionality,
  with competitive value for its build quality and comfort features.
