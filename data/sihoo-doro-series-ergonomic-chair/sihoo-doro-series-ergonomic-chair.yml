name: Sihoo Doro Series Ergonomic Chair
description: The Sihoo Doro Series is a premium line of ergonomic office chairs
  featuring dynamic auto-adaptive lumbar support, anti-gravity recline
  mechanisms, 6D coordinated armrests, and seat depth adjustment for 8+ hour
  desk sessions rated up to 300 lbs. Designed for professionals and WFH users
  who want advanced biomechanical support with breathable mesh at a mid-range
  price. Compared to the Herman Miller Aeron's PostureFit SL and the Steelcase
  Leap's LiveBack, the Doro series offers automated lumbar tracking and wider
  recline ranges at roughly $270–$550.
