name: Herman Miller Mirra
description: A mid-range Herman Miller ergonomic task chair with a flexible
  polymer back that responds to user movement, adjustable lumbar support, tilt
  tension control, and adjustable arms on a five-star base. Designed for
  professionals who want Herman Miller ergonomic quality without the premium
  Aeron price during daily desk sessions. Compared to the Herman Miller Aeron's
  PostureFit SL and the Steelcase Leap's adjustable lumbar, the Mirra's
  integrated back flex provides similar adaptive lumbar support in a simpler
  configuration that works well for most body types.
