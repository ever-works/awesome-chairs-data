markdown: >-
  ## Overview


  The Eureka Ergonomic Python II has earned the "best value" designation in
  January 2026, offering exceptional ergonomic features and build quality at an
  affordable price point that makes premium gaming comfort accessible to
  budget-conscious gamers.


  ## Features


  - **Premium Build Quality**: Exceptional construction for the price

  - **Ergonomic Design**: Full lumbar and neck support

  - **Adjustable Components**: Customizable armrests and recline

  - **Durable Materials**: High-quality upholstery and frame

  - **Memory Foam Cushions**: Comfortable lumbar and neck pillows

  - **Smooth Recline**: Multi-position tilt lock


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 155°

  - Seat Height Range: 18" to 22"

  - Warranty: 2-year manufacturer warranty


  ## Pricing


  Starting at $229.99
