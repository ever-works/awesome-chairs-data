featured: true
markdown: >-
  ## Overview


  Cost-effective ergonomic basics for daily desk work.


  ## Features


  - Dual repositionable lumbar pillows

  - Adjustable headrest (height/angle)

  - Height-adjustable armrests

  - Contoured high-density foam seat

  - Multi-lock tilt mechanism

  - 300lbs capacity


  ## Use Cases


  Perfect for budget home offices with 6-8 hour sitting needs. Good starter for
  students or casual gamers prioritizing lumbar relief. Reliable for standard
  builds in small apartments.


  ## Comparisons


  Vs FlexiSpot OC3: Simpler arms but dual pillows for better low-back targeting;
  equally affordable.


  ## Pricing


  $200–$250.
