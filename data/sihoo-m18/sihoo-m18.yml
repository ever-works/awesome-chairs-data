name: Sihoo M18
description: The Sihoo M18 is an entry-level ergonomic office chair with a
  contoured foam seat cushion, adjustable headrest, and built-in dual lumbar
  support pillows designed for 6–8 hour desk sessions rated up to 300 lbs. Its
  basic tilt tension and height-adjustable arms make it a practical choice for
  budget-conscious WFH setups. Compared to the Steelcase Leap's fully adjustable
  LiveBack and the Herman Miller Aeron's advanced lumbar system, the M18
  provides only manual lumbar pillow repositioning at a fraction of the price
  (~$200–$250).
