name: Sihoo M18
description: Entry-level ergonomic chair with dual adjustable lumbar pillows,
  contoured foam seat, height-adjustable headrest, and 300lbs capacity for
  budget WFH. Basic tilt for 6-8 hour use. Compares to FlexiSpot OC3 with pillow
  lumbar over dial but fewer arm adjustments.
source_url: https://sihoooffice.com/products/m18-ergonomic-chair
category: Budget Gaming & Office Chairs (Under $500)
tags:
