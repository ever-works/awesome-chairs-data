markdown: >-
  ## Overview


  The Laura Soho II is a handsome padded management chair prioritized for its
  looks over full ergonomic functionality.


  ## Features


  - Seat height adjustment

  - Tilt lock

  - Padded upholstery for comfortable appearance and feel


  ## Notes


  Limited adjustments make it less ergonomic. Some sloppy welds (hidden after
  assembly) and wobbly tilt-lock mechanism noted.
