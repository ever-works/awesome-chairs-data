name: Mimoglad Office Chair
description: Budget-friendly office chair priced well under $200 with solid
  construction and multiple color options. Offers adjustable lumbar height and
  tilt lock despite missing some premium features like seat depth adjustment.
  Suitable for back pain relief with a 5-year warranty and 300-pound weight
  limit.
