featured: false
markdown: >-
  ## Overview


  Surprisingly good for its low price, comparable to mid-range options like Hon
  Ignition.


  ## Features


  - Materials: Mesh back and upholstered foam seat, plastic frame

  - Adjustments: Height, lumbar height, tilt lock, recline resistance, headrest
  height

  - Armrests: Flip up, not adjustable

  - Ships assembled: No

  - Weight limit: 300 pounds

  - Warranty: 5 years


  ## Pricing


  Well under $200.
