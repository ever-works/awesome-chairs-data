name: Herman Miller Setu Chair
description: A task chair by Herman Miller with a kinematic spine that flexes to
  support the user's back, multi-tilt mechanism with tension control, and
  polyurethane adjustable arms designed for agile office environments and
  collaborative spaces. Ideal for meeting rooms, training areas, and shared
  workstations where flexibility and durability are key. Compared to the Herman
  Miller Aeron's adjustable PostureFit SL and the Steelcase Leap's LiveBack, the
  Setu provides simpler back flex with fewer manual controls, making it
  well-suited for multi-user environments at a lower price point.
