name: Secretlab Omega Series
description: Secretlab Omega is a streamlined gaming chair for entry-to-mid
  level users, with high-density foam padding, 135-degree recline, and 4D
  armrests for comfortable all-day sitting. More affordable than Titan Evo, it
  suits hybrid work-gaming better than basic office chairs due to its sporty
  design and durability.
