markdown: >-
  ## Overview


  Secretlab Omega Series reclines to 165° for relax mode, supporting gaming
  breaks and desk naps with premium features.


  ## Features


  - Recline: 165°

  - Footrest: Compatible

  - Massage: Accessory option

  - Cold-cure foam

  - 4-way lumbar

  - PU leather


  ## Use Cases


  - Budget premium gaming

  - Extended sessions with rest


  ## Comparisons


  - Vs office: Much deeper recline

  - Vs Secretlab Titan: Similar leather, more affordable


  ## Pricing


  Lower than Titan, direct discounts available.
