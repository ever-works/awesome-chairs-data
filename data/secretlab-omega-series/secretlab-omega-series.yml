name: Secretlab Omega Series
description: Secretlab Omega Series premium gaming chairs are engineered for
  endurance during marathon gaming sessions and trusted by esports
  professionals. Featuring advanced magnetic memory foam lumbar support that
  dynamically adjusts to your spine's natural curve, fully adjustable 4D
  armrests for optimal arm positioning, and proprietary cold-cure foam that
  molds to your body while providing sustained pressure relief over extended
  periods. Standout features include a 165° recline for full relaxation,
  swappable skins for easy customization, and a reinforced frame supporting up
  to 285 lbs. Ideal for long gaming marathons, live streaming marathons, and
  hybrid office-gaming setups where programmers endure coding sprints. Compared
  to DXRacer's racing-style chairs, which sacrifice ergonomics for aesthetics,
  Omega Series offers superior posture support and comfort. Against Herman
  Miller's office-focused designs, it delivers gaming-specific features at a
  more accessible price point without compromising on premium build quality.
