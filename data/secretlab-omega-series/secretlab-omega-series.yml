name: Secretlab Omega Series
description: The Secretlab Omega Series is an entry-level ergonomic gaming chair
  built for long sessions, with 4D armrests, magnetic head pillow, 4-way
  magnetic lumbar support, and cold-cure foam offering firm yet comfortable
  seating. Suited for gamers seeking deep 165° recline for relaxation and office
  workers wanting affordable premium ergonomics. It edges out DXRacer with
  higher-quality materials like denser foam and durable upholstery for better
  long-term use.
