name: Secretlab Omega Series
description: Secretlab Omega is a compact racing-style gaming chair for smaller
  users or tight spaces, with pebble seat base, 4D armrests, magnetic head
  pillow, and NEO Hybrid leatherette. Reclines to 165 degrees, supports 285lbs.
  Great starter chair vs. Titan Evo for petite gamers/office workers; more
  affordable with similar quality.
