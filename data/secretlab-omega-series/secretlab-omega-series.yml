name: Secretlab Omega Series
description: The Secretlab Omega Series is an ergonomic gaming and office hybrid
  chair designed for long sessions, featuring 4D armrests, magnetic head pillow,
  ColdCure foam, 165° recline, and swappable skins. It is ideal for gaming
  marathons, streaming, and office work. Compared to DXRacer, it provides more
  premium materials; versus budget chairs, superior durability and warranty.
