name: Secretlab Omega Series
description: The Secretlab Omega is the entry-level gaming chair in Secretlab's
  lineup, featuring cold-cure foam, a bucket-seat design, full 4-way lumbar
  support, and multi-recline up to 165° at a lower price than the Titan Evo.
  Ideal for budget-conscious gamers and streamers with smaller-to-average frames
  who want ergonomic Secretlab quality without the flagship price tag. It lacks
  the Titan's pebble-seat base and magnetic pillow system, but holds up well
  against similarly priced competitors like the Vertagear SL5000 and AndaSeat
  Kaiser 3 in build quality and longevity.
