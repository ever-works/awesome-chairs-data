name: IKEA Markus
description: Budget-friendly high-back office chair at approximately $230
  featuring a tall mesh back with built-in lumbar support, pneumatic height
  adjustment, tilt mechanism with lock, and a 243 lb weight capacity. Ideal for
  budget-conscious first-time home office buyers, students, and secondary desk
  setups where IKEA's 10-year warranty and reliable mesh ventilation matter.
  While it lacks adjustable armrests and fine-tuned lumbar depth compared to the
  Herman Miller Aeron or Steelcase Leap at 4–6x the price, its warranty and
  proven durability make it one of the strongest value options under $300.
