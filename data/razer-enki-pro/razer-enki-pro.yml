name: Razer Enki Pro
description: Hyper-premium mesh and Alcantara gaming chair built for esports
  marathons featuring high-density cold foam, adaptive lumbar curve, and
  aluminum frame. Includes 4D armrests, 152° recline, and magnetic pillow
  compatibility. Ideal for pro tournaments, marathon streaming, hybrid
  office/gaming; far superior materials to budget chairs and immersive gaming
  aesthetics vs office seating.
