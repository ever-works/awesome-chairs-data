markdown: >-
  ## Overview


  Alcantara and mesh for ultimate pro comfort.


  ## Features


  - Adaptive lumbar curve

  - High-density foam (coldfoam equiv)

  - 4D armrests

  - 152° recline

  - Alcantara upholstery

  - Aluminum frame

  - Magnetic pillow support


  ## Use Cases


  - Pro esports tournaments

  - Extended streaming

  - Marathon gaming


  ## Comparisons


  Vs budget: Mesh/Alcantara no-sweat 4x durable; adaptive support prevents back
  pain absent in cheap fixed designs.


  ## Pricing


  Premium; site for details.
