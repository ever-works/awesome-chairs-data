markdown: >-
  ## Overview


  AKRacing chairs feature deep 160°+ recline for relax mode, with footrest and
  massage features for optimal recovery during gaming or work.


  ## Features


  - Recline: 160°-180° models available

  - Footrest: Retractable

  - Massage: Built-in on premium lines

  - Ergonomic racing design

  - Premium PU leather


  ## Use Cases


  - Gaming marathons with naps

  - Long desk sessions


  ## Comparisons


  - Vs office chairs: Superior recline depth

  - Vs Secretlab Titan: Similar premium leather, pro-gamer focus


  ## Pricing


  Premium range, models from $400+.
