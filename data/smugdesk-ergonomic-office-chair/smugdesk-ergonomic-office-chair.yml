name: SmugDesk Ergonomic Office Chair
description: Ultra-budget mesh office chair at approximately $90 featuring a
  breathable mesh back, flip-up armrests, pneumatic height adjustment,
  adjustable lumbar support, and a 250 lb weight capacity. Ideal for
  budget-conscious buyers, first-time remote workers, and secondary desk setups
  where cost is the primary driver. While it provides essential mesh ventilation
  and basic lumbar support, it lacks the lumbar adjustability precision, seat
  depth control, and long-term durability of the Steelcase Series 1 or SIHOO M18
  at roughly double the price.
