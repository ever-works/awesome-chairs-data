name: RESPAWN 110 Racing Style Gaming Chair
description: Budget racing-style gaming chair around $170–200 offering bonded
  leather or upholstery options, removable lumbar and headrest pillows, 2D
  height-and-width adjustable armrests, 135° recline with tilt lock, and a
  segmental padded design, supporting up to 275 lbs. Ideal for budget-conscious
  gamers, first-time racing-chair buyers, and secondary gaming setups where
  recline range and segmented comfort matter. At roughly half the price of the
  Secretlab Titan Evo, it provides a solid recline angle with a footrest option,
  though it lacks the Titan's integrated lumbar, 4D armrests, and premium build
  quality.
