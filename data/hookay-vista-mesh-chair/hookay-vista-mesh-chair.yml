name: Hookay Vista Mesh Chair
description: Compact ergonomic office chair for endurance sitting in tight home
  office spaces, featuring a breathable Y-shaped mesh backrest that molds to the
  body and robust lumbar support for sustained comfort during long workdays.
  Includes synchro-tilt mechanism for natural recline, adjustable height, and
  armrests to fit diverse users. Offers superior breathability and posture
  support over budget mesh alternatives like Staples models, approaching the
  ergonomics of Herman Miller Aeron in a smaller footprint at lower cost.
