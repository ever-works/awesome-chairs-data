markdown: >-
  ## Overview


  The Herman Miller Setu is a collaborative seating solution designed for agile
  environments. It features a Kinematic backrest that flexes to support the
  user's movement.


  ## Features


  - Kinematic suspension back

  - Tilt tension with tension adjustment

  - Pneumatic seat height adjustment

  - Fixed arm pads

  - Lightweight construction

  - Sustainable materials


  ## Specifications


  - Weight Capacity: 300 lbs

  - Seat Height: 16.75"–21"

  - Warranty: 12-year Herman Miller warranty


  ## Pricing


  Starting at approximately $650.
