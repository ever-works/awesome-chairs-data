name: Herman Miller Setu
description: The Setu embraces a collaborative-first design philosophy, using a
  kinetic elastomeric suspension back that moves freely with the user and
  requires no manual adjustment. Its lightweight construction and agile
  multi-tilt mechanism are ideal for agile offices, hot-desking environments,
  and shorter-duration seating where flexibility and sustainability matter most.
  At around $650 it occupies a mid-tier price point between the Sayl and the
  brand's premium performance chairs.
