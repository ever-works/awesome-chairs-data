markdown: >-
  ## Overview


  Secretlab's Premium Footrest uses PlushCell memory foam for a soft, cushy
  surface to rest feet on while seated at a desk. It has been noted for staying
  remarkably clean over extended use, even in environments with pets.


  ## Features


  - PlushCell memory foam construction for soft comfort

  - Quilted fabric cover that resists dirt and pet hair

  - Patterned silicone base that keeps the footrest in place

  - Cover is hand-washable for easy cleaning

  - Available for $89


  ## Considerations


  - Ideal use is when feet are not planted flat on the ground; designed for
  occasional propping rather than permanent foot rest
