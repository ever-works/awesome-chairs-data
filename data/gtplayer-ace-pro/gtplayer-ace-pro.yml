markdown: >-
  ## Overview


  Most comfortable cheap gaming chair tested, keeps legs from soreness longer
  than pricier options. Speakers provide decent sound, easy to pair with PC or
  phone.


  ## Features


  - Built-in Bluetooth speakers in backrest

  - Footrest (manual pull-out)

  - Reclines to 150 degrees with lock

  - Firm backrest and seat cushion

  - One-year warranty


  ## Pricing


  Most affordable recommendation, typically under $200.
