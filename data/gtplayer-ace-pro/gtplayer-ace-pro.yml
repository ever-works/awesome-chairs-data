name: GTPlayer Ace Pro
description: Affordable gaming chair designed for extended sessions by gamers
  and programmers, with a 150-degree reclining backrest, retractable footrest,
  and built-in Bluetooth speakers for audio immersion during long play or coding
  marathons. Features PU leather upholstery over high-density foam padding for
  durable support, height adjustment, and a firm seat that reduces fatigue
  better than many sub-$150 alternatives. While armrests are fixed and padding
  thinner than premium models like Secretlab, it offers strong value for
  budget-conscious users seeking endurance comfort.
