name: Secretlab Classics
description: Secretlab Classics premium gaming chairs are crafted for marathon
  gaming endurance and esports pros, integrating magnetic memory foam lumbar for
  adaptive support, 4D armrests with extensive adjustability, and cold-cure foam
  engineered for long-lasting pressure relief and contouring comfort. Highlights
  feature a 165° recline for downtime recovery, swappable skins for style
  versatility, and high weight capacity up to 285 lbs for broader user
  compatibility. Excels in scenarios like extended gaming marathons, streaming
  productions, and programmer hybrid offices blending work and play. DXRacer
  alternatives prioritize racing aesthetics over ergonomic depth, while
  Secretlab Classics emphasizes sustained health benefits. In comparison to
  Herman Miller's pricier office chairs, it provides enhanced gaming
  optimizations such as magnetic adjustments and reclines tailored for dynamic
  sessions, all at superior value.
source_url: https://secretlab.co/collections/classics-series
