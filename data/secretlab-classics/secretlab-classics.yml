name: Secretlab Classics
description: Secretlab Classics series represents the foundational premium
  gaming chairs, featuring advanced ergonomics like magnetic head pillow, 4D
  armrests, cold-cure foam for superior molding and durability, and multi-tilt
  mechanism. Unlike standard racing chairs, they offer better posture support
  and long-term reliability for extended use. Perfect for marathon gaming
  sessions or prolonged office work.
