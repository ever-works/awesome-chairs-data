name: Secretlab Classics
description: Foundational premium chair line with cold-cure foam, aluminum
  wheelbase, NEO Hybrid Leatherette or SoftWeave fabric, 4D armrests, and
  magnetic pillows. Advanced L-ADAPT dynamic lumbar for luxury executive gaming
  and endurance work. Provides unmatched durability and 5-year warranty over
  budget chairs prone to sagging.
