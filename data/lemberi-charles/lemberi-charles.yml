name: LEMBERI Charles
description: Budget gaming chair under $100 supporting up to 400 lbs with a
  thick steel frame, steel base, built-in lumbar support, high-density shaping
  foam cushioning, retractable footrest, skin-friendly PU leather, and 90°–155°
  recline. Designed for gamers on a tight budget who need heavy-duty weight
  capacity and essential features like a footrest. Its $100 price point
  undercuts the AndaSeat Novis by over $150 while offering a higher weight
  capacity, though it sacrifices adjustable armrests (fixed only) and the
  refined ergonomics of the Secretlab Titan Evo.
