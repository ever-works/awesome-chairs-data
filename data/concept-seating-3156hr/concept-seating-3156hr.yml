name: Concept Seating 3156HR
description: A bariatric-grade office chair rated for up to 1,000 lbs with a 26"
  wide seat, bariatric tilt mechanism with adjustable seat and back angles,
  four-position seat depth adjustment, and a fully articulating headrest built
  on a seven-leg base. Designed for specialized applications requiring the
  maximum weight capacity available in office seating. Compared to the Herman
  Miller Aeron's 350 lb rating and the Steelcase Gesture's 400 lb limit, the
  3156HR offers 2.5× the capacity with seven-leg stability at $3,498 for
  specialized rather than general use.
