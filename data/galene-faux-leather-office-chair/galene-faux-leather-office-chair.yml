name: Galene Faux Leather Office Chair
description: Budget office chair at approximately $130–160 featuring faux
  leather upholstery, padded seat, pneumatic height adjustment, tilt tension
  control, and contract-grade construction, supporting up to 250 lbs. Ideal for
  budget-conscious buyers setting up a home office or secondary workspace where
  professional aesthetics at a low cost are desired. While it provides essential
  adjustability and a clean, modern look, it lacks the lumbar precision, seat
  depth adjustability, and mesh breathability of the Steelcase Series 1 or
  Herman Miller Sayl at 3–4x the price.
