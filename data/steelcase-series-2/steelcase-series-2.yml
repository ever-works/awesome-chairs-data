name: Steelcase Series 2
description: The Steelcase Series 2 is a mid-range ergonomic task chair with a
  flexor-system backrest that adapts to body movement, adjustable lumbar
  support, and multi-position arm and seat adjustments for healthy posture
  during 6+ hour desk sessions. Rated for users up to 300 lbs, it is well-suited
  for corporate offices, shared workspaces, and WFH setups where premium comfort
  is needed at a more accessible price point. Compared to the Herman Miller
  Aeron's advanced PostureFit SL and the Steelcase Leap's LiveBack, it provides
  solid baseline ergonomics with fewer fine-tuning options at roughly $500–$800.
