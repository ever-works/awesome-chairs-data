name: Actulum
description: Suited for programmers and remote workers enduring 10+ hour desk
  marathons, the Actulum kneeling chair excels in posture maintenance via its
  hip-opening kneel position that straightens the spine and activates the core.
  It boasts height-adjustable seat and knee pads, ventilated fabrics to prevent
  overheating, and a rocking base for natural shifts, backed by BIFMA
  certification for robust construction. Ideal for coding sessions and hybrid
  offices, it delivers better spinal ergonomics and discreet style than gaming
  chairs' padded bulk.
