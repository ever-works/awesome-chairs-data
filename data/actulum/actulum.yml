name: Actulum
description: An ergonomic kneeling chair that promotes proper spinal alignment
  through forward-tilt active sitting, featuring adjustable seat and knee pad
  heights for a customized fit. Ideal for desk workers seeking to reduce lower
  back strain and alternate between traditional and kneeling postures during
  long work sessions. Unlike the Herman Miller Aeron or Steelcase Leap, it
  eliminates backrest reliance entirely, demanding greater core engagement in
  exchange for improved hip angle and pelvis positioning.
