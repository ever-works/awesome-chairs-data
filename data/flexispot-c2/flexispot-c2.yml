name: FlexiSpot C2
description: An ultra-affordable ergonomic office chair at $99.99 with basic
  mesh back, standard pneumatic height adjustment, simple tilt mechanism, and a
  lightweight compact design with a 120° recline range. Designed for
  tight-budget WFH users and students needing essential airflow and height
  adjustability for light desk work. Compared to the Steelcase Series 1's $500
  entry-level build with four-way adjustable arms and weight-activated tilt, the
  FlexiSpot C2 offers the most basic version of mesh breathability and height
  adjustment at roughly 20% of the Series 1 price, best suited for shorter daily
  sessions.
source_url: https://www.flexispot.com/ergonomic-office-chair-c2
