name: FlexiSpot C7 Morpher
description: A premium ergonomic chair featuring an innovative Morphing Backrest
  that auto-adjusts to spinal curves, breathable mesh seat, pneumatic adjustable
  lumbar support, and 5D adjustable armrests on a BIFMA and SGS certified frame.
  Designed for desk workers who need adaptive back support that moves with their
  posture shifts during long work sessions. Compared to the Herman Miller
  Aeron's adjustable PostureFit and the Steelcase Leap's LiveBack, the Morpher's
  Morphing Backrest achieves similar adaptive spinal support at roughly $629
  with a 5-year warranty.
