markdown: >-
  ## Overview


  Studio F.A. Porsche co-designed luxury gaming chair with real leather and
  advanced ergonomics.


  ## Features


  - Genuine top-grain leather

  - 4D adjustable armrests (pearl white)

  - Dynamic lumbar curve support

  - 160° synchronous recline

  - Aluminum alloy 5-star base

  - High-density foam padding

  - Curved ABS back shell with ventilation


  ## Use Cases


  Perfect for high-end gaming rigs where style matches performance. Suited for
  extended sessions in home offices or streaming rooms. Supports up to 330 lbs
  for versatile user fits.


  ## Comparisons


  Vs Secretlab Titan 2020: Real leather feels more premium than NEO hybrid, but
  lacks magnetic headrest; stronger base but pricier.


  ## Pricing


  $799–$899.
