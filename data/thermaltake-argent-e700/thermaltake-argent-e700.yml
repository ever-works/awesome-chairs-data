name: Thermaltake Argent E700
description: Porsche-designed premium gaming chair with genuine leather
  upholstery, 4D armrests, 160° recline, dynamic lumbar support, and aluminum
  alloy base for high durability. Features a curved ABS shell for aesthetics and
  cooling ventilation. Ideal for luxury gaming setups; compares to Secretlab
  Titan with real leather over hybrid synth but less adjustability in headrest.
