name: DXRacer
description: DXRacer offers a range of racing-style gaming chairs with
  high-density foam, PU leather, and robust steel frames for durability in
  esports setups. Features include lumbar support, adjustable headrests, and
  wide seat pans for comfort over long hours. Compares favorably to budget
  options but lacks the ergonomic finesse of office chairs like Mirra.
source_url: https://www.dxracer.com
