name: DXRacer
description: DXRacer gaming chairs feature robust steel frames and PU leather
  for durable racing-style seating during esports or streaming. They offer
  high-back design, lumbar support, 135-degree recline, and wider seats suited
  for competitive setups. More affordable than some premium brands but less
  breathable than mesh alternatives.
