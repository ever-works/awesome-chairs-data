name: DXRacer
description: DXRacer chairs, pioneers in racing-style gaming seats, feature
  high-density foam padding, PU leather, and robust steel frames supporting up
  to 300lbs. Models like Air Pro offer mesh backs for breathability, adjustable
  lumbar pillows, and 135-degree recline. Suited for esports and long gaming
  marathons; more affordable than Secretlab with similar style but less premium
  materials.
