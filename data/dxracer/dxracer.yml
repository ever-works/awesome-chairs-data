name: DXRacer
description: Pioneer gaming chair brand that introduced the world's first gaming
  chair in 2006, producing ergonomic gaming chairs, desks, and accessories
  across multiple series (Formula, Blade, Craft, Master, KOI, Air, and Martian)
  with rigorous stability, load-bearing, and durability testing. Ideal for
  gamers seeking established brand heritage and a wide range of specialized
  chair types including mesh, temperature-controlled, eco-friendly, and
  collaboration editions. While individual models vary widely in features and
  price, DXRacer chairs collectively compete with Secretlab's Titan lineup and
  Herman Miller's Vantum by offering more variety in aesthetics, special
  features, and themed designs.
