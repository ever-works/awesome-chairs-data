name: DXRacer
description: DXRacer gaming chairs are purpose-built for endurance in prolonged
  gaming marathons and esports competitions, featuring 135° reclining backrest,
  high-density foam padding for superior pressure distribution, adjustable
  lumbar support pillow, robust steel frame with 275 lbs weight capacity, and
  durable PU leather upholstery. Ideal for streamers maintaining peak comfort
  during broadcasts, esports pros in tournaments, and racing sim enthusiasts
  requiring immersive posture. Offers comparable premium ergonomics to Secretlab
  and Noblechairs at a more accessible price with greater color variety for
  personalized setups.
