name: DXRacer
description: DXRacer chairs, like the Drifting series, offer racing-inspired
  design with PU leather, high-density foam padding, and 135° recline with
  lumbar pillow. Supports 275lbs with steel frame, multiple color options for
  esports setups. Great budget premium alternative to Noblechairs with similar
  style but lower cost.
