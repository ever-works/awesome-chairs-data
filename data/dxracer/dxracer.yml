featured: true
markdown: |-
  ## Overview

  DXRacer pioneered gaming chairs in 2006 with the Formula Series.

  ## Features

  - Robust steel frames
  - PU leather upholstery
  - High-back design
  - Lumbar support
  - 135-degree recline
  - Wide seat options

  ## Product Range

  Multiple series: Formula, Blade, Craft, Master, Air, etc.

  ## Pricing

  Mid-to-premium range, varies by model.
