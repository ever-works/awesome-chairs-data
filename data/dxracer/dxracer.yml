name: DXRacer
description: DXRacer gaming chairs are racing-inspired designs for immersive sim
  racing and competitive gaming across various models like Air Pro, Tank, and
  Drifting. They feature high-density foam, PU leather or fabric options,
  135-180° recline, steel frames, with up to 400lbs capacity in heavy-duty
  variants. Superior to budget brands in durability and firmer than Secretlab's
  softer comfort, suitable for sim racing setups, esports tournaments, and daily
  PC use.
