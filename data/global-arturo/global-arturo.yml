markdown: >-
  ## Overview


  The Global Arturo is an executive chair featuring bonded leather upholstery
  with a built-in lumbar cushion, waterfall front seat edge for comfortable leg
  positioning, and a waterfall seat edge design for pressure reduction.


  ## Features


  - Height adjustable padded arms

  - Pneumatic seat height adjustment

  - Tilt tension and lock adjustable

  - Built-in lumbar cushion

  - Waterfall front seat edge

  - Bonded leather upholstery


  ## Specifications


  - Weight Capacity: 250 lbs

  - Overall Dimensions: 27.5"W × 29"D × 46.5"-51.5"H


  ## Pricing


  Starting at $479
