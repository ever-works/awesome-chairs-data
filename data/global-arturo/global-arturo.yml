name: Global Arturo
description: A high-back executive leather chair with a 31" tall backrest, plush
  padded lumbar cushion, waterfall seat edge with built-in lumbar support, tilt
  tension and lock, and height-adjustable padded arms rated at 250 lbs. Designed
  for conference rooms and executive offices where traditional leather
  aesthetics take priority. Compared to the Steelcase Leap Executive's LiveBack
  adjustability, the Arturo prioritizes visual presence and plush seating over
  sophisticated ergonomic adjustment, making it better for meeting-room use than
  8-hour daily task seating.
