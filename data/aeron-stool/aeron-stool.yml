markdown: >-
  ## Overview


  The Aeron Stool is a stool-height version of Herman Miller’s Aeron chair. It
  is designed for high work surfaces and sit-stand computer setups, providing
  ergonomic support for extended periods of sitting similar to the standard
  Aeron chair.


  ## Use Cases


  - Versatile for mixed use in sit-stand workstations and high desks.

  - Ideal for collaborative environments or kitchen counters adapted for work.


  ## Features


  - Stool-height seating configuration

  - Intended for use with high work surfaces

  - Suitable for sit-stand and height-adjustable computer setups

  - Based on the Herman Miller Aeron chair design

  - Ergonomic support aimed at extended sitting

  - Mesh-style construction


  ## Comparisons


  - Unlike full-height chairs, provides a higher perch to facilitate easier
  standing transitions.


