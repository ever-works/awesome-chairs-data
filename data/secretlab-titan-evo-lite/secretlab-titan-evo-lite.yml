markdown: >-
  # Secretlab Titan Evo Lite


  ## Overview

  The Secretlab Titan Evo Lite is a more affordable gaming chair that retains
  the core ergonomic design of the Titan Evo series. It features built-in
  dynamic lumbar support, a memory foam head pillow, and cold-cure foam
  cushioning, making it suitable for long gaming or office sessions.


  ## Features

  - Built-in dynamic lumbar support

  - Memory foam neck pillow (magnetically attached)

  - Cold-cure foam cushioning

  - 4D adjustable armrests with Soft PU coated armrest tops

  - Upholstery options: Secretlab Prime Leatherette, SoftWeave Fabric

  - Two sizes: Regular (5’7”–6’2”), XL (5’11”–6’9”)

  - Weight capacity: 220lbs (Regular), 395lbs (XL)

  - Recline range: 85° to 165°

  - Warranty: Up to 5 years


  ## Pricing

  Approximately $399 for Prime Leatherette and $439 for SoftWeave Fabric (prices
  may vary by region and retailer).


  ## Use Cases

  Ideal for users seeking a high-quality ergonomic chair with essential
  adjustments at a lower cost. Suitable for gaming, remote work, and general
  desk use.
