name: Global ObusForme
description: A high-back ergonomic task chair with a 32" tall backrest,
  adjustable seat depth slider, independent back angle and height adjustment,
  forward/backward seat angle control, elastomeric suspension back support, and
  300 lb capacity. Designed for extended sitting sessions where comprehensive
  adjustability including seat depth and back angle customization is paramount.
  Compared to the Steelcase Leap's LiveBack suspension and seat depth slider,
  the ObusForme offers similar adjustability breadth at $814, though its lumbar
  support is molded into the backrest rather than independently adjustable like
  the Leap's or Aeron's systems.
