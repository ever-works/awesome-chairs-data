markdown: >-
  ## Overview


  The BTOD GO-2149-GG is a durable fabric big and tall office chair with a 24"
  wide seat and 400 lb. capacity. It features a generous seat height range
  making it well-suited for taller users. At approximately 30" wide and 34" deep
  overall, it's a substantial chair built for comfort.


  ## Key Specifications


  - **Weight Capacity:** 400 lbs.

  - **Seat Width:** 24" wide

  - **Seat Height Range:** 20"–24"

  - **Overall Dimensions:** 30" wide, 34" deep

  - **Weight:** ~70 lbs.

  - **Starting Price:** ~$542.99


  ## Features


  - 4" thick seat pad with waterfall front edge to promote healthy blood flow

  - Height-adjustable arms

  - Durable fabric upholstery

  - Seat height range of 20" to 24" — ideal for users over 6'4" tall

  - Large, substantial build


  ## Best For


  Tall users (over 6'4") who need a high seat height range and a wide, spacious
  seat with durable fabric upholstery around the $600 price range.


  ## Considerations


  - Two-year warranty on the entire chair — shorter than higher-end options

  - Minimum seat height of 20" may be too tall for shorter users; a footrest may
  be needed

  - Heavy at nearly 70 lbs., requiring extra hands for moving and assembly
