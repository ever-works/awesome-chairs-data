name: BTOD GO-2149-GG
description: A heavy-duty fabric big-and-tall office chair with a 24" wide seat,
  400 lb capacity, 4" thick waterfall-front seat pad, and a seat height range of
  20"–24" that accommodates users over 6'4" tall. Features height-adjustable
  arms and durable fabric upholstery on a substantial 30" x 34" frame. Compared
  to the Steelcase Leap's standard 18"–20" seat height range, the GO-2149's
  elevated minimum height targets exceptionally tall users, though it lacks the
  Leap's LiveBack lumbar support and seat depth adjustment.
