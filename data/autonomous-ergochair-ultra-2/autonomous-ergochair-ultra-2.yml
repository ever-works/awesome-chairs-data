markdown: >-
  ## Overview


  The Autonomous ErgoChair Ultra 2 is a 3D-printed office chair with an all-mesh
  design. It is a significant improvement over the original ErgoChair Ultra,
  featuring a more comfortable seat that no longer feels flat and hard.


  ## Features


  - 3D-printed construction

  - All-mesh design for excellent airflow and breathability

  - Adjustable seat depth

  - Recline lock

  - Wide backrest that does not dig into shoulders

  - Adjustable armrests


  ## Considerations


  - Armrests can sometimes go down with a loud crack when too much pressure is
  applied (e.g., when getting up or shifting weight), despite being locked

  - Two-year warranty is considered lackluster for the price point

  - Customer service quality has been reported as subpar by some users


  ## Pricing


  Priced at $399. Comes with a two-year warranty.
