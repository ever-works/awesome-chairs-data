name: Autonomous ErgoChair Ultra 2
description: A 3D-printed ergonomic chair with an all-mesh design for maximum
  airflow, featuring seat depth adjustment, recline lock, adjustable armrests,
  and a wide backrest rated for 300 lbs. Ideal for warm-climate desk workers and
  WFH users who prioritize breathability and moderate adjustability. Compared to
  the Herman Miller Aeron, it uses a similar mesh-first approach but at half the
  price with a 2-year warranty, though the armrest reliability and build quality
  fall short of Aeron-grade construction.
