name: DXRacer Master Series
description: DXRacer Master Series is a high-end gaming chair with ergonomic
  design for competitive esports, offering a steel frame, high-density foam
  padding, 4D armrests, and 135-180 degree recline depending on model. Features
  include PU leather or fabric upholstery, adjustable lumbar pillow, and wide
  seat base for stability. Suited for pro gamers and long-hour users; compares
  favorably to Secretlab with more robust build but less magnetic accessories.
