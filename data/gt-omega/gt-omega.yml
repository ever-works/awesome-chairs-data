markdown: >-
  ## Overview


  GT Omega manufactures ergonomic gaming and office chairs with a
  racing-inspired design, aimed at PC gamers and professionals who spend long
  periods seated at a desk.


  ## Features


  - Ergonomic design focused on supporting users during extended sitting
  sessions.

  - Racing-style aesthetics inspired by motorsport seating.

  - Suitable for PC gaming setups and desk-based work environments.

  - Office-ready styling for professional or home office use.


  ## Use Cases


  - PC gamers requiring a supportive chair for long gaming sessions.

  - Professionals or remote workers who sit at a desk for many hours.


