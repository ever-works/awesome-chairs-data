markdown: "## Overview


  The Move by Varier is a product that was designed in Norway by Per Ãie and is
  currently manufactured in Poland. It has been in production since 1985. It
  features a high build quality with parts coming from Germany and Norway and is
  backed by a strong warranty. The base is made from hardwood and is curved
  upwards on the edges.


  ## Features


  - Hardwood base curved upwards on edges for wobble motion

  - Flat section on base allows sitting without holding chair in place

  - Three-sided saddle seat with well-padded cushion

  - Three cylinder height options providing total range of 19\"â34\"

  - Parts sourced from Germany and Norway

  - Can be used in normal sitting position with short cylinder


  ## Pros


  - Good build quality

  - Strong warranty

  - Adjusts high enough for tall people

  - Can be used in normal sitting position with short cylinder

  - Massive height range fits people of almost any height


  ## Cons


  - Saddle seat can be awkward for some

  - Not suitable for full upright leaning

  - May not be good for long hours

  - Poor sitting mobility

  - Range of motion more limited than some competitors


  ## Pricing


  2025 Starting Price: $579.00"
