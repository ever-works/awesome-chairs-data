name: Humanscale Diffrient AI
description: The most adjustable Humanscale chair featuring the FormMotion
  auto-tilt mechanism with adjustable recline tension and range, the Tri-Panel
  mesh backrest with adjustable height and depth, fully adjustable 4D arms, and
  a mesh or foam seat. Designed for users who want the ergonomic benefits of
  Humanscale's automatic tilt but need the customization typically found in
  manual-adjust chairs like the Steelcase Leap. Compared to the Herman Miller
  Aeron's PostureFit SL and adjustable mesh, the Diffrient AI adds arm
  adjustability and seat depth slider to the auto-tilt foundation at
  approximately $2,000.
