name: X Chair Mavix M9
description: Engineered for extended gaming marathons and office work, the X
  Chair Mavix M9 provides superior lumbar support, plush high-density foam
  cushioning, and a 160-degree recline to minimize fatigue during 10+ hour
  sessions. Features include 4D adjustable armrests, breathable electrode
  fabric, aluminum alloy base, and quiet casters for smooth mobility. A 2026
  budget pick, it delivers premium ergonomics similar to Secretlab Titan but at
  half the price, ideal for gamers and remote workers seeking value.
