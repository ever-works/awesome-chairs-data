name: AndaSeat Kaiser 3
description: 2026 AndaSeat Kaiser 3 introduces AI-adaptive dynamic lumbar and
  cooling PU/fabric for 16+ hour heavy-duty use up to 395lbs, surpassing prior
  Kaiser 2's static support with auto-adjust and ventilation. Features 4D
  armrests, 155° recline, waterfall seat, magnetic pillows. Ideal for big gamers
  vs previous limited capacity.
