name: AndaSeat Kaiser 3
description: Racing-style gaming chair with a wide seat, durable PU leather
  upholstery, and multi-adjustable 4D armrests, lumbar support, and 180° recline
  for comfortable long-hour sits in gaming or office hybrid setups. It shares
