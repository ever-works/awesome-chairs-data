name: Razer Iskur V2
description: Razer Iskur V2 gaming chair features an adaptive 6D lumbar system
  that auto-adjusts to your posture, breathable mesh backrest, and 4D armrests
  for esports pros sitting 10+ hours. Supports 300 lbs with RGB lighting option;
  outperforms standard gaming chairs like DXRacer in lumbar tech but pricier;
  perfect for RGB enthusiasts and streamers.
