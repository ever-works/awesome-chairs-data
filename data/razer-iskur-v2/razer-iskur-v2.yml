name: Razer Iskur V2
description: "Razer Iskur V2 features an adaptive lumbar system that
  auto-adjusts to user movement, 6D armrests, and breathable mesh back for
  long-hour gaming or coding without fatigue. Includes height-adjustable
  headrest and 130° recline; excels in esports vs. standard PU leather chairs
  like DXRacer with better ventilation. Use cases: competitive gaming,
  streaming."
