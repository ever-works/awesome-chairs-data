name: Razer Iskur V2
description: Gaming chair optimized for VR/AR immersive experiences with haptic
  feedback compatibility, adaptive 6D lumbar support that auto-adjusts to user
  movements, 180-degree recline, RGB lighting synchronization, and contoured
  headrest. Designed for extended VR sessions, it provides superior ergonomics
  and immersion compared to standard gaming chairs like Secretlab or DXRacer,
  enhancing feedback from VR haptics.
