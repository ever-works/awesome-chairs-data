name: Razer Iskur V2
description: Razer Iskur V2 is an advanced gaming chair with 6D lumbar support
  that auto-adapts to user movement, breathable mesh backrest, and 4D armrests
  with haptic feedback compatibility. Features include high-density foam seat,
  130-degree recline, and RGB lighting options in NewGen model. Suited for
  esports and marathon sessions; outperforms standard racing chairs with
  adaptive ergo and official tournament use (e.g., VALORANT EMEA 2026).
