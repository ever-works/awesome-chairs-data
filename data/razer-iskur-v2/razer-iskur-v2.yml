name: Razer Iskur V2
description: "Razer Iskur V2 is an advanced gaming chair with built-in lumbar
  support curve that adapts to your spine, 6D lumbar system, and RGB lighting
  for immersive setups. Features high-density foam, contoured seat, and up to
  160° recline with swappable tops. Ideal for esports and marathon gaming;
  offers better lumbar tech than standard racing chairs like DXRacer. Use cases:
  competitive play, streaming, VR."
