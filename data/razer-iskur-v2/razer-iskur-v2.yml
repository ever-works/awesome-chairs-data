name: Razer Iskur V2
description: "Razer Iskur V2 gaming chair features 6D lumbar support that
  auto-adjusts to spine curvature, memory foam lumbar, and contoured headrest
  for immersive comfort in long sessions. Includes 180-degree recline, haptic
  motor integration for Razer games, vegan leather. Stands out vs standard with
  adaptive lumbar better than fixed-pillow chairs like Andaseat. Use cases: FPS
  gaming, VR, content creation."
