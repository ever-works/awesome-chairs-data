name: Razer Iskur V2
description: Razer Iskur V2 gaming chair features an adaptive lumbar curve
  system that auto-adjusts to spine shape, 6D lumbar support, contoured
  headrest, and breathable memory foam with mesh. Supports 300lbs, 180-degree
  recline, and RGB lighting sync. Great for immersive gaming; improves on
  original Iskur with better lumbar tech, competing with AndaSeat in ergonomics
  at a mid-premium price.
