name: IKEA Jarvfjallet
description: The IKEA Jarvfjallet is a budget ergonomic office chair (~$300)
  with a padded headrest with height adjustment, adjustable armrests, and a
  gently contoured backrest for basic lumbar support during 5–7 hour desk
  sessions up to 243 lbs. Positioned for WFH users who need more adjustability
  than the Markus but don't require full ergonomic tuning. Compared to the
  Steelcase Leap's dynamic LiveBack lumbar and the Herman Miller Aeron's mesh
  breathability, it offers conventional foam padding and fewer adjustment points
  at entry-level pricing.
