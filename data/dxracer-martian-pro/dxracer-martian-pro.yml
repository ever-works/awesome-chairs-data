name: DXRacer Martian Pro
description: DXRacer Martian Pro provides superior all-day support for gamers
  and office hybrid users with innovative tech-enhanced ergonomics in a racing
  chair form. Key features include electric height/tilt adjustments, airbag
  lumbar support, seat heating and cooling, built-in massager, adjustable
  armrests, and magnetic headrest pillow. Designed for long gaming marathons and
  work sessions; stands out vs Secretlab Titan Evo with climate control and
  massage functions, plus far greater durability than budget alternatives.
