markdown: >-
  ## Overview


  The DXRacer Martian Pro is a high-end gaming chair with advanced tech features
  for superior comfort during extended sessions.


  ## Features


  - Electric adjustments replacing manual levers

  - Built-in airbag lumbar support

  - Seat heating and cooling

  - Integrated massager

  - Magnetic headrest pillow that stays in place

  - Adjustable armrests for various body sizes

  - Firm seat cushion that retains shape

  - Built-in battery lasting weeks with occasional feature use; full charge in
  hours

  - Solid premium build quality; assembly in ~20 minutes


  ## Pricing


  Approximately £580 in the UK (sold out at time of review).


  ## Use Cases


  Ideal for gamers and professionals enduring 10-12 hour sessions, providing
  relief for back issues and climate control for comfort.
