name: Yonisee Office Chair
description: Budget mesh office chair at approximately $150 offering basic mesh
  back construction, pneumatic height adjustment, basic armrests, and a standard
  tilt mechanism, supporting up to 250 lbs. Designed for budget-conscious
  buyers, secondary desk setups, and light-use scenarios where minimal cost is
  the primary concern. Compared to the Staples Hyken or SIHOO M18 at similar or
  slightly higher prices, it provides basic mesh seating but with less refined
  lumbar support, narrower armrest positioning, and lower overall build quality.
