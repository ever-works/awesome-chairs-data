name: BodyBilt J3504 Big & Tall
description: Office-oriented heavy-duty chair with 500 lb capacity, extra-wide
  contoured seat, and reinforced frame for big and tall users in extended work
  or gaming; features adjustable lumbar and synchro-tilt for superior
  ergonomics. Compares to DXRacer Tank (gaming style, 400lbs) with better lumbar
  support and higher capacity for bariatric office needs. Ideal for 12+ hour
  programmer endurance sessions.
