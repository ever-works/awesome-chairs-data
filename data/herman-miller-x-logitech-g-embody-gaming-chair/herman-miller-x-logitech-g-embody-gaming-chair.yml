name: Herman Miller x Logitech G Embody Gaming Chair
description: The Herman Miller x Logitech G Embody Gaming Chair is a premium
  ergonomic hybrid designed for gamers, streamers, esports competitors, and
  long-hour sitters seeking office-grade support in gaming setups. Its
  innovative pixelated backrest and seat conform to body movements, using
  cooling foam and tensioned suspension for breathability and spinal alignment,
  with full adjustability including armrests, seat depth, backfit, and tilt
  limiter. Key features encompass high-density foam, 135° recline, 300 lbs
  weight capacity, and posturizing support to minimize strain. Suited for
  esports events, streaming marathons, hybrid work-gaming days, it bridges
  gaming style with professional ergonomics. Compared to DXRacer's
  racing-inspired fixed posture seats, it offers dynamic, health-focused
  adaptation; versus standard office chairs, it adds gaming aesthetics and
  enhanced cooling without sacrificing adjustability.
