  ## Herman Miller x Logitech G Embody Gaming Chair  

  ![Herman Miller Logo](https://www.hermanmiller.com/content/dam/hmicom/page_assets/homepage/primary-nav/herman-miller-logo.svg)

  ![Herman Miller x Logitech G Embody Gaming Chair](https://www.hermanmiller.com/images/embody-gaming-chair-1.png)

  ### Overview
  The collaboration chair supports extended gaming and work with advanced ergonomics.

  ### Features  
  - **Ergonomic Design**: Optimal spinal support.
  - **Cooling Foam**: Breathable comfort.
  - **Adjustability**: Armrests, tilt, seat depth.
  - **Weight Capacity**: 300 lbs.
  - **Recline**: Up to 135°.

  ### Pricing  
  - **MSRP**: $2,045 USD

  ### Use Cases
  - Esports, streaming, hybrid office-gaming.
