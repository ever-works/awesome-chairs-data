markdown: >-
  ## Headrest Review


  The Atlas Headrest is an aftermarket headrest for the Herman Miller Aeron,
  designed and built by former Herman Miller engineers. It is an upgraded
  sibling to the Engineered Now H4.


  ## Headrest Features


  - **Same materials as Aeron**: Uses identical pellicle mesh and frame material
  as the chair itself

  - **Three-point adjustment**: Height, depth, and pivot adjustments that can be
  cranked tight to eliminate all movement or loosened for slight adjustability

  - **Superior stability**: Locks firmly in any position without unwanted
  sliding or snapping

  - **Excellent recline support**: Particularly comfortable when sitting back in
  a reclined position

  - **Aesthetics**: Looks great from the front; from the back, visible bars
  detract from the chair's clean lines

  - **Wide range**: Tons of range in both height and depth


  ## Expert Ratings


  - Consensus: **A-Tier** (some reviewers considered it S-Tier material)

  - Considered second only to the Neutral Posture 8000 headrest

  - Rated as the most comfortable padded/mesh headrest option for the Aeron


  ## Pricing


  Premium aftermarket accessory; more expensive than the Engineered Now
  alternatives
