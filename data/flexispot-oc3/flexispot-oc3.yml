name: FlexiSpot OC3
description: Budget ergonomic gaming/office hybrid with breathable mesh back,
  adjustable lumbar, 4D armrests, 135° recline, and cold foam seat. Popular for
  value endurance sitting under $300. Compares to Sihoo M18 with more arm
  adjustments but similar basic lumbar.
