markdown: >-
  ## Overview


  Affordable mesh hybrid chair for daily use.


  ## Features


  - Breathable mesh backrest

  - Adjustable 3D/4D armrests

  - Lumbar support dial

  - Cold mold foam seat

  - 135° recline lock

  - Aluminum wheelbase


  ## Use Cases


  Great for entry-level gamers or remote workers on tight budgets needing
  all-day ventilation. Suitable for 6-8 hour office tasks with easy adjustments.
  Versatile for small spaces with compact footprint.


  ## Comparisons


  Vs Sihoo M18: Better armrest range and mesh cooling at similar price; less
  padded seat.


  ## Pricing


  $250–$300.
