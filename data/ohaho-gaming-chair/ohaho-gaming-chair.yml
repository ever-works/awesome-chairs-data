name: Ohaho Gaming Chair
description: Entry-level gaming chair around $100–130 featuring PU leather
  upholstery, removable lumbar and neck pillows, fixed padded armrests, 90°–145°
  recline with tilt lock, and a 250 lb weight capacity, ideal for
  budget-conscious first-time buyers and secondary desk setups where basic
  racing-chair styling at a low cost matters. While it provides essential
  recline and basic lumbar pillow support, it lacks the integrated lumbar, 4D
  armrests, and premium build quality of the Secretlab Titan Evo or Herman
  Miller Vantum at roughly triple the price.
