name: Haworth Soji
description: The Haworth Soji is a premium ergonomic office chair with
  adjustable lumbar support, 4-dimensional armrests (height, width, depth,
  pivot), and seat depth adjustment for users up to 300 lbs during 8+ hour desk
  sessions. Its waterfall seat edge reduces thigh pressure and promotes
  circulation for corporate and WFH environments requiring reliable all-day
  comfort. Compared to the Herman Miller Aeron's mesh-based support and the
  Steelcase Leap's LiveBack flex, the Soji provides traditional cushioned
  ergonomics with broader lumbar adjustability at roughly $600–$900.
