markdown: >-
  ## Overview


  The X4 Leather Executive Office Chair is designed with the executive suite in
  mind, available in top grain leather and premium buttery-soft leather options.
  It features Dynamic Variable Lumbar (DVL)® Support that pivots with you to
  keep you comfortable throughout the workday.


  ## Features


  - **Dynamic Variable Lumbar (DVL)®**: Patented lumbar support system

  - **10 Adjustable Ergonomics**: Comprehensive customization options

  - **Premium Leather Options**: Top grain or ultra-premium leather

  - **Executive Design**: Sophisticated aesthetics for professional spaces

  - **Advanced Recline**: Smooth multi-position recline mechanism

  - **Heavy-Duty Construction**: Built for durability and longevity


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 130°

  - Upholstery: Top Grain or Premium Leather

  - Warranty: Extended manufacturer warranty

  - Free Shipping: Available in-stock


  ## Pricing


  Starting at $1,299 (Premium Leather: $1,599)
