name: Sihoo M102C
description: The Sihoo M102C is an entry-level ergonomic office chair with
  custom-tunable lumbar support, adjustable armrests, and tilt tension for
  standard 6–8 hour desk sessions rated up to 300 lbs. Designed for
  budget-conscious WFH users who need basic posture support without a headrest.
  Compared to the Steelcase Leap's 4D armrests and the Herman Miller Aeron's
  PostureFit SL, it offers simpler adjustment at roughly $130–$170 with foam
  seat cushioning instead of mesh.
