markdown: >-
  ## Sihoo M102C Ergonomic Office Chair


  ### Overview

  The **Sihoo M102C** is an entry-level ergonomic office chair designed for
  basic posture support during standard desk sessions.


  ### Features

  - **Customizable lumbar support**: Vertical lower-back alignment

  - **Adjustable armrests**: Height and angle

  - **Tilt tension control**: Standard recline with tension knob

  - **Foam seat cushion**: Padded comfort for extended sitting


  ### Specifications

  - Weight Capacity: 300 lbs

  - Warranty: 3-Year Warranty


  ### Pricing

  Approximately $130–$170. Visit [Sihoo Ergonomic
  Chairs](https://sihoooffice.com/collections/ergonomic-chairs) for current
  pricing.
