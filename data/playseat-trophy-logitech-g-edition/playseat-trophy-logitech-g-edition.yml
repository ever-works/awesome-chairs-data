name: PlaySeat Trophy Logitech G Edition
description: Dedicated racing simulation cockpit seat with official Logitech G
  partnership integration, compatible wheel and pedal mounting points, and a
  foldable design for easy storage, supporting up to 150 kg. Purpose-built for
  sim racing enthusiasts who need an authentic racing seat position with force
  feedback immersion rather than a general-purpose gaming or office chair.
  Unlike the Secretlab Titan Evo or Herman Miller Vantum, the PlaySeat Trophy is
  a single-use cockpit rather than an adjustable seat—it cannot serve as an
  office chair or for non-racing games, but it delivers unmatched racing
  authenticity for sim racing setups.
