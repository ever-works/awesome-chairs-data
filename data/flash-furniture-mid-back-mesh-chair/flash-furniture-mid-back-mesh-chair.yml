markdown: >-
  ## Overview


  The Flash Furniture Mid-Back Mesh Chair is a reliable and affordable mid-back
  mesh office chair from a trusted commercial furniture brand, offering
  essential ergonomic features and durability for everyday office use.


  ## Features


  - **Breathable Mesh Back**: Ventilated design for comfort

  - **Commercial-Grade Quality**: Built for daily professional use

  - **Adjustable Height**: Pneumatic seat height adjustment

  - **Tilt Mechanism**: Tilt tension control

  - **Padded Seat**: Comfortable cushioned seating

  - **Durable Construction**: Long-lasting components


  ## Specifications


  - Weight Capacity: Up to 250 lbs

  - Recline Range: Basic tilt function

  - Seat Height Range: 18" to 22"

  - Warranty: 2-year manufacturer warranty

  - Certifications: Commercial-grade standards


  ## Pricing


  Starting at $129.99
