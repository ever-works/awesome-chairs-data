name: Flash Furniture Mid-Back Mesh Chair
description: A reliable mid-back mesh office chair with breathable ventilated
  back, padded seat cushion, pneumatic height adjustment, and tilt tension
  control, backed by a 2-year commercial-grade warranty. Suitable for everyday
  office and WFH use where essential ergonomic support and proven durability
  matter. Compared to the Steelcase Series 1's entry-level ergonomics, the Flash
  Furniture offers similar basic mesh ventilation and height adjustability at
  roughly $130, though it lacks the Series 1's four-way arm adjustability and
  brand warranty depth.
