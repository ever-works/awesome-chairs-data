name: GTPlayer Mesh Series Ergo12
description: Budget-friendly mesh office chair at approximately $200 featuring
  breathable mesh back construction, adjustable lumbar support, basic pneumatic
  height adjustment, tilt mechanism, and a 250 lb weight capacity. Ideal for
  budget-conscious first-time remote workers, students, and secondary desk
  setups where mesh ventilation and essential ergonomics at an accessible price
  are the priorities. While it delivers core mesh airflow and lumbar support, it
  trades the refined seat depth control, multi-axis armrests, and long-term
  durability of the SIHOO M57 or Branch Ergonomic Chair at a higher tier for
  accessible cost.
