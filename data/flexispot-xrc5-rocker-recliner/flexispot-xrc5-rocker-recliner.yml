name: FlexiSpot XRC5 Rocker Recliner
description: Oversized gaming recliner with four-zone massage, built-in heat
  function, rocker and swivel action, and spacious cushioned proportions that
  accommodate taller and larger users comfortably. Designed for gamers and
  streamers who want a relaxation-first seating experience rather than an
  upright racing posture. Unlike traditional gaming chairs from Secretlab or
  DXRacer that prioritize desk-facing ergonomics, the XRC5 serves as a lounge
  chair with massage and heat—more comparable to an X Rocker gaming recliner but
  with FlexiSpot's ergonomic pedigree and a more modern aesthetic.
