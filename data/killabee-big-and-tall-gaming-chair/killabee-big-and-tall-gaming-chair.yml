name: Killabee Big and Tall Gaming Chair
description: Heavy-duty gaming chair with 350lb+ capacity (optimized for 400lb
  users), featuring extra-wide seat, reinforced metal frame, and high weight
  limits for superior support over standard chairs. Includes massage lumbar,
  memory foam, footrest, and deep recline for larger gamers or office workers in
  extended sessions. Ideal for bariatric comfort in prolonged use.
