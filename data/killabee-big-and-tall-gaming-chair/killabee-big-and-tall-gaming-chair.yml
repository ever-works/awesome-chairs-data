name: Killabee Big and Tall Gaming Chair
description: Heavy-duty gaming chair providing robust support for big and tall
  users up to 400lbs during long hours of gaming or programming. Features wide
  seat, high capacity, reinforced metal frame, massage lumbar, and 180° recline.
  Significantly more durable than standard chairs, perfect for large gamers and
  programmers.
source_url: https://www.amazon.com/KILLABEE-Gaming-Chair-Massage/dp/B07FYND3W4
category: Big & Tall/High Capacity Chairs (400lbs+)
tags:
