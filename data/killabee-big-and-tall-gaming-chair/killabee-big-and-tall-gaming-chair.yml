name: Killabee Big and Tall Gaming Chair
description: Heavy-duty gaming chair with a 350 lb weight capacity, extra-wide
  seat, USB-powered massage lumbar support, retractable footrest, memory foam
  padding, and an expansive 90°–180° flat recline. Designed for larger gamers
  seeking maximum comfort extras like massage and full-flat reclining at a
  mid-range price point. It offers more weight capacity and a wider recline
  range than the Secretlab Titan Evo, though it lacks the Titan's integrated
  lumbar dial, 4D armrests, and long-term build refinement.
