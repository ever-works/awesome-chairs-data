name: Humanscale Path Eco Tasker
description: Sustainably constructed ergonomic task chair using 100%
  post-consumer recycled polyester in FormSense Eco Knit upholstery and recycled
  materials throughout, reducing carbon footprint compared to standard office
  chairs. Features weight-activated auto-tilt and adjustable arms for effortless
  long-hour (6-8 hour) comfort up to 300 lbs. Outperforms non-eco rivals like
  Herman Miller Aeron in sustainability while matching premium ergonomics.
