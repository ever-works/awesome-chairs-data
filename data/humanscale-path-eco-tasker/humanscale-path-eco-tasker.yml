name: Humanscale Path Eco Tasker
description: The Humanscale Path Eco Tasker is a sustainably built ergonomic
  task chair featuring a weight-activated auto-tilt mechanism, adjustable Duron
  arms, and eco-friendly upholstery options including FormSense Eco Knit for 6–8
  hour desk sessions rated up to 300 lbs. Designed for environmentally conscious
  offices and WFH setups that want premium humanscale ergonomics with a reduced
  carbon footprint. Compared to the Herman Miller Aeron's mesh-first cooling
  design and the Steelcase Leap's extensive adjustability, it emphasizes
  sustainability and streamlined controls at approximately $1,500–$1,800.
