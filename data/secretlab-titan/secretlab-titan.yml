name: Secretlab Titan
description: The predecessor to the Titan Evo, known for its innovative magnetic
  memory foam head pillow with velour upholstery that reviewers consistently
  rank as a standout comfort feature. Designed for gamers and streamers who
  spend long sessions reclined, the Titan's high backrest and racing-style
  bucket seat provide solid support at a lower price than the Evo refresh. While
  it lacks the Evo's 4-way adjustable lumbar system and has a non-adjustable
  headrest that limits upright versatility compared to the DXRacer Air Pro, its
  magnetic pillow system still outperforms traditional strap-on headrests in
  reclined comfort.
