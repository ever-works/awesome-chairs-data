name: Secretlab Titan
description: "The Secretlab Titan Evo gaming chair is engineered for extended
  sitting during gaming marathons or work sessions, featuring a wider seat base
  for larger users, patented cold-cure foam for pressure relief, and a
  165-degree recline with integrated lumbar support that auto-adjusts. Key
  features include 4D L-ADAPT armrests, magnetic memory foam head pillow, and
  CloudSwap interchangeable covers for customization. Ideal for gamers,
  streamers, and programmers needing endurance comfort; outperforms standard
  racing-style chairs like DXRacer in breathability and 5-year warranty
  durability. Use cases: esports tournaments, long coding sessions, hybrid
  office/gaming setups."
