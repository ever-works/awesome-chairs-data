name: Secretlab Titan
description: The Secretlab Titan Evo is a premium gaming chair designed for
  extended sitting sessions, featuring a 4-way adjustable lumbar support system
  that mimics the spine's natural curve for superior back health. Key features
  include cold-cure foam padding for pressure relief, magnetic memory foam head
  pillow, 165-degree recline, and 4D armrests; ideal for gamers, programmers,
  and office workers needing all-day comfort. Compared to DXRacer, it offers
  better magnetic pillow attachment and NEO Hybrid Leatherette for
  breathability.
