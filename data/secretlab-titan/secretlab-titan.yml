name: Secretlab Titan
description: Secretlab Titan is optimized for all-day sitting and gaming,
  ensuring proper posture support during 12+ hour sessions through its patented
  4-way lumbar system and cold-cure foam padding. Key features encompass 4D
  armrests, magnetic head pillow, and a multi-adjustable mechanism for
  personalized comfort. It excels in use cases like esports competitions,
  programming marathons, and hybrid office/gaming setups, offering greater
  durability than standard racing chairs such as DXRacer.
