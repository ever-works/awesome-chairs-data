name: Secretlab Titan
description: Secretlab Titan Evo is a premium gaming chair with cold-cure foam
  for plush comfort, 4D armrests, and magnetic head pillow for neck support
  during extended gaming or work marathons. It supports up to 285 lbs with
  reclining up to 165 degrees and swappable skins for customization. Better for
  gamers than Herman Miller Embody due to aggressive styling and RGB
  compatibility, though less office-professional.
