name: Secretlab Titan
description: The Secretlab Titan is an ergonomic gaming and office hybrid chair
  designed for long sessions, featuring 4D armrests, magnetic head pillow,
  ColdCure foam, 165° recline, and swappable skins. It supports gaming
  marathons, streaming, and extended office work with superior comfort. Compared
  to DXRacer, it uses more premium materials; versus budget chairs, it offers
  better durability and warranty.
