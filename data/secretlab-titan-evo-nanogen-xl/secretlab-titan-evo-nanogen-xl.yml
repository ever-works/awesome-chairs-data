markdown: >-
  ## Overview


  The Secretlab Titan Evo Nanogen XL is the big and tall variant of Secretlab's
  top-rated Titan Evo Nanogen gaming chair. It takes everything from the
  standard Nanogen edition and upsizes it to deliver comfort and support to a
  wider, larger audience.


  ## Specifications


  | Spec | Value |

  |------|-------|

  | Seat Height | 18.1-21.9" |

  | Seat Width | 19.3" |

  | Seat Depth | 19.7" |

  | Backrest Length | 35" |

  | Backrest Width | 22" |

  | Tilt Range | 85-165° |

  | Max Load | 395 lbs |


  ## Key Features


  - **Nanogen Hybrid Leatherette**: Ultra-soft, Brisa-like fabric that is
  significantly softer and more comfortable than standard PU leather

  - **Extra seat cushion**: Additional Nanofoam Composite cushioning for extra
  softness while maintaining support

  - **Adjustable lumbar support**: Delivers proper back support critical for
  larger users

  - **4D adjustable armrests**: Hot-swappable top cushions with magnetic
  attachment; defaults with velour-wrapped PlushCell foam arm toppers

  - **Magnetic head pillow**: PlushCell magnetic neck pillow for enhanced
  comfort

  - **Memory foam with cooling gel**: On headrest and armrest components

  - **Sturdy aluminum wheelbase**: Upgraded from plastic for enhanced durability

  - **Magnetic accessory compatibility**: Full compatibility with Secretlab's
  magnetic accessories including pillows, armrest covers, and the Ergonomic
  Recliner add-on


  ## Pros


  - Wide, well-cushioned seat for larger frames

  - Soft and comfortable yet still supportive

  - Sturdy aluminum wheelbase

  - Accessory ecosystem compatibility


  ## Cons


  - Pricier than the smaller standard model


  ## Pricing


  The Titan Evo Nanogen XL comes at a premium over the standard-sized Nanogen
  model, reflecting its larger dimensions and materials. It is positioned as a
  high-end gaming chair investment.
