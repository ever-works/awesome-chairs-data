name: Secretlab Titan Evo Nanogen XL
description: The big-and-tall version of Secretlab's flagship Titan Evo,
  featuring ultra-soft NanoGen Hybrid Leatherette, extra Nanofoam Composite
  cushioning, 4-way adjustable lumbar support, hot-swappable 4D PlushCell
  armrests, and a magnetic neck pillow with cooling gel — rated up to 395 lbs
  with an 85°–165° recline range. Ideal for larger gamers, streamers, and
  content creators who need maximum capacity without sacrificing plush comfort
  or ergonomic precision. It sets the benchmark for big-and-tall gaming chairs,
  outclassing the Razer Iskur V2 with superior material softness and magnetic
  accessories, while providing warmer, more cushioned comfort than Herman Miller
  Vantum's mesh-first design.
