markdown: >-
  ## Overview


  The Blacklyte Athena Pro is a traditional racing-style gaming chair with a
  bolstered seat and high backrest. It features the familiar design language of
  major gaming chair brands but distinguishes itself with quality fabric
  upholstery and a comprehensive set of adjustments.


  ## Features


  - Bolstered seat with racing-style design

  - High backrest

  - 4D armrests

  - Built-in lumbar support adjustable with knobs on the sides

  - Magnetic neck pillow

  - 155-degree recline

  - Fabric upholstery

  - Maximum floor-to-seat height of 20.1 inches


  ## Pros


  - Well-made construction

  - Fabric upholstery comparable to or better than SecretLab SoftWeave

  - Comprehensive adjustment options


  ## Cons


  - Not particularly unique design

  - Maximum floor-to-seat height (20.1 inches) is lower than most competitors
  (21-22 inches typical)

  - May not be suitable for users who prefer a higher sitting position


  ## Pricing


  Competitively priced in the racing-style gaming chair category.
