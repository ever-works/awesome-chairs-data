name: Blacklyte Athena Pro
description: Racing-style gaming chair with high-quality fabric upholstery
  comparable to SecretLab SoftWeave, featuring 4D armrests, built-in adjustable
  lumbar support via side knobs, a magnetic neck pillow, and 155° recline in a
  classic bolstered bucket-seat design. Ideal for gamers who prefer fabric over
  synthetic leather for breathability and long-term comfort. Its lower maximum
  seat height of 20.1 inches may not suit taller users compared to the Secretlab
  Titan Evo, which offers a broader height range and more refined ergonomics at
  a premium price.
