name: AIS Bolton Series Task Chair
description: An adjustable ergonomic task chair offering customizable seat
  depth, arm height, and seat height, specifically engineered to support users
  of smaller stature with proportional frame dimensions. The chair's multi-point
  adjustability and scaled-down build make it ideal for petite users in all-day
  office or WFH environments. Compared to the Herman Miller Aeron in its size-A
  variant or the Steelcase Leap's narrow arm-width settings, the Bolton delivers
  comparable petite-specific ergonomics at a more accessible
  commercial-furniture price point.
