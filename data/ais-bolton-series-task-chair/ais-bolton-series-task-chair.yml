markdown: >-
  ## Overview


  The AIS Bolton Series Task Chair provides adjustable seat depth, arms, and
  seat height that ergonomically support users of smaller stature, delivering
  the key adjustments short people need for all-day office comfort.


  ## Features

  - Adjustable seat depth for proper positioning across body types

  - Height-adjustable arms to prevent shoulder elevation

  - Pneumatic seat height adjustment for feet-flat positioning

  - Ergonomic support designed for smaller frames

  - Suitable for all-day office use

  - Seat depth adjustment ensures correct back contact with lumbar support
