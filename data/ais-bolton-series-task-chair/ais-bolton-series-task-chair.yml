name: AIS Bolton Series Task Chair
description: AIS Bolton Series Task Chair supports long-hour sitting with
  adjustable seat depth, synchro-tilt mechanism, mesh back, and adaptive lumbar
  support optimized for petite users, ensuring proper posture for office workers
