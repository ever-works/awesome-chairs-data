name: Sihoo Doro S300 Ergonomic Chair
description: The Sihoo Doro S300 is a premium mid-range ergonomic chair
  featuring auto-adaptive lumbar support that follows body movement, 6D
  armrests, seat depth adjustment, and a breathable mesh backrest for 6–8 hour
  desk sessions rated up to 300 lbs. Designed for WFH and corporate users who
  want automated ergonomic tuning without premium brand pricing. Compared to the
  Herman Miller Aeron's adjustable PostureFit SL and the Steelcase Leap's
  manually tuned LiveBack, it provides dynamic, weight-sensing lumbar response
  with a wider 130° recline at roughly $270–$350.
