markdown: >-
  # Sihoo Doro S300 Ergonomic Chair


  ## Overview

  The **Sihoo Doro S300** is a premium mid-range ergonomic chair with
  auto-adaptive features for daily computer use.


  ## Features

  - **Auto-adaptive lumbar support**: Dynamically follows body posture

  - **6D armrests**: Multi-directional adjustment

  - **Seat depth slider**: Forward/backward adjustment for leg comfort

  - **Full mesh backrest**: Breathable construction

  - **130° recline range**: Wide tilt for relaxation breaks

  - **Waterfall seat edge**: Reduces thigh pressure


  ## Specifications

  - Weight Capacity: 300 lbs

  - Warranty: 3-Year Warranty


  ## Pricing

  Approximately $270–$350. Visit [Sihoo Doro
  S300](https://sihoooffice.com/products/doro-s300-ergonomic-chair) for current
  pricing.
