markdown: >-
  ## Overview


  The Cramer Triton Max is Cramer's premier big and tall task chair designed to
  support users up to 500 pounds. Manufactured in Arkansas, USA, it combines
  ergonomic functionality with heavy-duty construction.


  ## Features


  - **Weight Capacity:** 500 lbs.

  - **Seat Width:** 23" wide seat

  - **Base:** 28" die-cast aluminum base

  - **Backrest:** Height-adjustable backrest

  - **Arms:** Height adjustable arms with a wide arm width range of 22"–29",
  accommodating a large variety of users

  - **Comfort Cushion:** Cramer's proprietary seat and back comfort cushions
  that adapt to different users

  - **Warranty:** 15-year warranty on casters, seat cylinders, and arms; 5-year
  on all other parts


  ## Comfort and Ergonomics


  - Backrest height adjustment to support different torso lengths

  - Seat height and arm height adjustments

  - Optional lumbar support available for users needing extra lower back support


  ## Build Quality


  - Made in the USA at Cramer's Arkansas facility

  - Over 90 upholstery options available

  - Designed for long-term durability in demanding environments


  ## Pricing


  - Price: Approximately $712.58


  ## Warranty


  - 15-year warranty on casters, seat cylinders, and arms

  - 5-year warranty on all other components
