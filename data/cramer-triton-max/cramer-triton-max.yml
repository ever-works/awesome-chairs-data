name: Cramer Triton Max
description: A heavy-duty big-and-tall task chair with a 500 lb weight capacity,
  23" wide seat, 28" die-cast aluminum base, and an industry-leading 15-year
  warranty on casters, cylinders, and arms, plus over 90 upholstery options
  including the exclusive Comfort Cushion system. Made in the USA for demanding
  environments where long-term durability is paramount. Compared to the Herman
  Miller Aeron's 12-year warranty, the Triton Max's 15-year component warranty
  exceeds it significantly, though the firmer ergonomic profile trades plush
  mesh comfort for solid, task-oriented postural support.
