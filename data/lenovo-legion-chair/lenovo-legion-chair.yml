name: Lenovo Legion Chair
description: Gaming chair marketed by Lenovo as one of the most advanced
  available, featuring multiple adjustments including seat height for users 5'5"
  to over 6'2", 4-way adjustable arms, smooth recline with 4 locking positions,
  height-adjustable lumbar support, and 2-way adjustable headrest. It has a mesh
  backrest with soft lumbar pad and open design for movement. Priced at
  $300-$400, noted for assembly challenges and variable comfort in long
  sessions.
source_url: https://www.lenovo.com/us/en/p/accessories-and-software/chairs/lenovo-legion-chairs
category: Gaming Chairs
tags:
  - gaming
