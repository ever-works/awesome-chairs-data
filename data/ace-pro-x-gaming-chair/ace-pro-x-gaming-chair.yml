name: Ace Pro X Gaming Chair
description: The Ace Pro X Gaming Chair is tailored for gamers engaged in
  prolonged sessions, providing ergonomic support to alleviate strain from long
  sitting periods through features like adjustable lumbar support, headrest, and
  retractable footrest. Constructed with robust materials including high-density
  foam and PU leather upholstery, it offers multi-directional armrest
  adjustability, extensive recline, and vibrant RGB lighting. Ideal for esports
  competitions and extended streaming marathons, it outperforms budget
  racing-style chairs in comfort and features while offering better value than
  premium alternatives like the Razer Iskur V2.
