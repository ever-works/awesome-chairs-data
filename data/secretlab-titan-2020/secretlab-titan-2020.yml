name: Secretlab TITAN 2020
description: Premium hybrid gaming and office chair featuring cold-cure foam,
  NEO Hybrid leatherette, magnetic memory foam headrest, 165° recline, 4D
  armrests, and integrated lumbar support. Engineered for endurance during
  esports marathons and long workdays. Compared to the Titan Evo, it provides
  similar premium materials and recline but at a lower price, lacking Evo's
  swappable magnetic headrest variants and NEO 2.0 leatherette upgrades.
