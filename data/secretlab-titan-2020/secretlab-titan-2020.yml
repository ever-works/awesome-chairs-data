name: Secretlab TITAN 2020
description: The Secretlab Titan 2020 is an upgraded gaming chair with NEO
  Hybrid leatherette that's softer and more breathable than standard PU,
  featuring a pebble seat base for better weight distribution and magnetic head
  pillow. It supports up to 165° recline, 4D armrests, and cold-cure foam for
  10+ hour comfort. Great for esports pros transitioning to work; predecessor to
  Titan Evo with similar premium build at mid-range price.
