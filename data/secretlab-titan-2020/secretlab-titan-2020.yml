markdown: >-
  ## Overview


  Secretlab TITAN 2020 series chair with premium cold-cure foam and magnetic
  headrest for pro-level comfort.


  ## Features


  - Cold-cure foam seat and back

  - NEO Hybrid leatherette upholstery

  - Magnetic memory foam head pillow

  - Integrated adjustable lumbar support

  - 4D full-metal armrests

  - 165° recline with lock

  - Multi-height seat options


  ## Use Cases


  Ideal for esports tournaments requiring sustained focus over 12+ hours. Suited
  for hybrid work/gaming setups with adjustable ergonomics for coding or
  streaming. Supports big & tall users up to 285 lbs with robust aluminum base.


  ## Comparisons


  Vs Titan Evo: Shares 165° recline and cold foam but uses older NEO
  leatherette; Evo adds swappable headrests and softer NEO 2.0. More affordable
  entry to Secretlab premium ecosystem.


  ## Pricing


  $499–$599 depending on size and material.
