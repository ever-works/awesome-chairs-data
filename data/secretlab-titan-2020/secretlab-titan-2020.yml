markdown: >-
  ## Overview


  The Secretlab TITAN™ 2020 Series provides greater comfort and support with
  more space than ever and customized ergonomics.


  ## Key Features


  - **Cold-Cure Foam**: Specially formulated patent-pending foam for perfect
  blend of even weight distribution and optimal pressure relief.

  - **PRIME™ 2.0 Leatherette**: 4X more durable than regular PU leather,
  stress-tested for abrasion, flex resistance, and real-world use.

  - **Ergonomic Support**: Signature Memory Foam Head Pillow with cooling gel
  layer; integrated adjustable lumbar support system.

  - **Levelled Fit Seatbase**: Enhances comfort.

  - **Complete Recline and Tilt Adjustability**: Full range for relaxation.

  - **Full-Metal 4D Armrests**: Multi-directional adjustability.


  ## Assembly


  Takes about 20 minutes. Assembly video and guide provided via email and
  Resources page.


  ## Care


  Engineered for years of daily use. Keep liquids away and wipe down regularly.
  Detailed Aftercare Guide available.


  ## Shipping


  Processed in 1 working day, delivered in 1-3 working days via FedEx & UPS
  (exceptions for distant locations). Tracking email provided.


  ## Customer Reviews


  4.9 out of 5 based on 16,155 reviews.
