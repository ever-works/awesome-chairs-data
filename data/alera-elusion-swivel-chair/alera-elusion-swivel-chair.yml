name: Alera Elusion Swivel Chair
description: Alera Elusion Swivel Chair is designed for long-hour sitting,
  featuring multifunction mechanism with adjustable seat glide, tilt tension,
  fully adjustable arms, breathable mesh backrest, and contoured foam seat with
  waterfall edge for posture support and circulation in programmers and office
  workers. It promotes natural back movement and leg pressure relief during
  extended desk work. Compared to gaming chairs, it excels in breathability and
  adjustability for professional environments.
