markdown: >-
  ## Features


  - Multifunction mechanism with adjustable seat glide

  - Fully adjustable tilt tension with free-floating or infinite locking

  - Adjustable armrests (height and width) with soft polyurethane pads

  - Breathable high-quality mesh backrest

  - Contoured foam seat cushion with waterfall edge for pressure relief and
  circulation

  - 5-star base with casters for swivel mobility


  ## Pros


  - Easy mobility

  - Dynamic lumbar support

  - Adjustable armrests

  - Contoured seat

  - More adjustability options

  - Suitable for gaming


  ## Cons


  - Assembly difficulty for some

  - Poor rolling on carpet

  - Limited weight capacity


  ## Pricing


  Rated highly for price among competitors.
