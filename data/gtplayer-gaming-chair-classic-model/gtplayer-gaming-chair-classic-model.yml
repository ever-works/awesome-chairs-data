markdown: >-
  ## Overview


  The GTPLAYER Gaming Chair Classic Model GT099 is an affordable gaming chair
  tailored for casual gamers and first-time buyers who need reliable seating
  without premium pricing. With its racing car seat-inspired design, this chair
  provides basic ergonomic support and gaming-style aesthetics.


  ## Features


  - **Classic Racing Design**: Sporty aesthetic for gaming setups

  - **PU Leather Upholstery**: Smooth, easy-to-clean surface

  - **Height-Adjustable Armrests**: Customizable arm positioning

  - **Reclining Function**: Up to 155° tilt with lock mechanism

  - **Removable Cushions**: Lumbar and neck pillow support

  - **Pneumatic Height Adjustment**: Standard gas lift


  ## Pricing


  Starting at approximately $109.99
