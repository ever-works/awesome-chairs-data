name: GTPLAYER Gaming Chair Classic Model
description: Entry-level racing-style gaming chair around $100–140 with PU
  leather construction, removable lumbar and neck pillows, height-adjustable
  armrests, 90°–155° recline with tilt lock, and a 250 lb weight capacity. Ideal
  for budget-conscious first-time buyers, teenagers, and secondary gaming setups
  where basic racing-chair aesthetics and adjustable recline are desired. It
  offers comparable features to the BestOffice and Homall gaming chairs at
  similar pricing, though it trades the build quality, 4D armrests, and
  integrated lumbar of the Secretlab Titan Evo for an accessible price floor.
