name: Homall S-Racer Gaming Chair
description: Ultra-budget racing-style gaming chair at $90–110 with PU leather
  upholstery, removable lumbar and neck pillows, fixed padded armrests, 130°
  recline, standard pneumatic height adjustment, and a 250 lb weight capacity.
  Ideal for budget-conscious first-time buyers, teenagers, and secondary gaming
  setups where minimal cost and basic seating are the priorities. Limited to
  roughly 5–6 hours of comfortable use compared to premium options like the
  Secretlab Titan Evo or Herman Miller Vantum, it sacrifices adjustability,
  build quality, and long-term durability for an accessible entry price with a
  6-month warranty.
