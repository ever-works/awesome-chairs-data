name: Ace Series ACE-PRO AMZ-H
description: Designed for gamers tackling extended playtimes on a budget, the
  Ace Series ACE-PRO AMZ-H delivers essential ergonomic relief with a contoured
  backrest, height-adjustable armrests, detachable lumbar and neck pillows, 155°
  recline mechanism with tilt lock, and durable PU leather over high-density
  foam padding supporting up to 280 lbs. Its pneumatic height adjustment and
  sturdy metal frame ensure reliable comfort without frills. Best for casual
  esports enthusiasts and beginner streamers, it surpasses basic budget rivals
  like Homall in recline depth and adjustability but doesn't match the premium
  magnetic lumbar of AndaSeat Kaiser series.
