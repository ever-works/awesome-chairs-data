name: Ace Series ACE-PRO AMZ-H
description: Engineered for gamers enduring prolonged sessions of up to 12+
  hours, the Ace Series ACE-PRO AMZ-H provides dynamic lumbar adjustment and
  high-back support to maintain optimal posture and reduce fatigue. Key features
  include 4D armrests, 155° multi-lock recline, breathable premium PU leather,
  high-density foam padding, and a class-4 gas lift for superior comfort. Ideal
  for esports tournaments and streaming marathons, it offers greater armrest
  versatility than budget racing-style chairs and matches Secretlab recline
  efficiency at a lower cost.
