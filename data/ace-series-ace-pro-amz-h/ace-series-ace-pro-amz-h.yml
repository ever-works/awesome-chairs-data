name: Ace Series ACE-PRO AMZ-H
description: This gaming chair supports extended periods of sitting for gaming,
  programming, or office tasks exceeding 12 hours, with dynamic lumbar
  adjustment and high-back support to preserve posture and alleviate fatigue. It
  includes 4D armrests, 155° multi-lock recline, breathable premium PU leather,
  high-density foam padding, and a class-4 gas lift. Suited for gaming marathons
  and daily work, it outperforms budget racing chairs in armrest versatility and
  rivals Secretlab models in recline capability at a lower price.
