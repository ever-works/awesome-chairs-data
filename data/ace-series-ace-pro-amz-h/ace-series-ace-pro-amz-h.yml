name: Ace Series ACE-PRO AMZ-H
description: Budget gaming chair at approximately $130 featuring ergonomic
  design, adjustable armrests, remappable lumbar and headrest cushions, 90°–155°
  recline with tilt lock, and a 280 lb weight capacity. Ideal for
  budget-conscious first-time buyers, casual gamers, and secondary desk setups
  where racing-style ergonomics at an accessible price matter. While it offers
  comparable features to entry-tier racing chairs from BestOffice and Homall, it
  trades the integrated lumbar, 4D armrests, and premium materials of the
  Secretlab Titan Evo or Herman Miller Vantum for a lower cost floor.
