name: Comhoma CH511
description: Mid-range gaming chair at $250–300 featuring high-density foam
  cushioning, PU leather upholstery, adjustable armrests, lumbar support,
  headrest, reclining backrest, and a ~250 lb weight capacity. Ideal for
  budget-conscious gamers, first-time desk buyers, and secondary setups where
  comfort and style matter without premium pricing. While it provides adequate
  ergonomic support for moderate sessions, it lacks the build quality, warranty
  coverage, and precision adjustability of the Secretlab Titan Evo or Herman
  Miller Vantum at 1.5x the price.
