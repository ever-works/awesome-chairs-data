name: Herman Miller Lino
description: The Lino takes a minimalist approach to Herman Miller ergonomics,
  pairing a breathable suspension back with an independently adjustable lumbar
  system and straightforward seat-depth control. Its uncluttered design makes it
  ideal for average-sized users (up to 300 lbs) seeking a comfortable, no-fuss
  desk chair for home offices or small teams. Positioned in Herman Miller's
  entry tier at $670–$855, it delivers core ergonomic support without the
  complexity of the brand's flagship models.
