markdown: >-
  ## Overview


  Vitrazza produces a tempered glass chair mat designed to replace traditional
  plastic or vinyl mats. It protects floors from caster wheel damage and
  improves chair movement on both hard floors and carpets.


  ## Features


  - Made from thick safety glass, resistant to scratches after years of use

  - Supports up to 1,000 pounds

  - Rubber bumpers keep the mat from directly contacting hardwood floors

  - Available in multiple sizes and shapes (rectangular and other options)

  - Does not scuff or chip hardwood surfaces


  ## Pricing


  Premium-priced compared to traditional plastic or vinyl mats. Exact pricing
  varies by size and shape selected.
