name: Staples Driscott Ergonomic Fabric Managers Big & Tall Chair
description: Affordable 400 lb big & tall manager chair with 23.6-inch
  extra-wide seat and heavy-duty fabric frame for budget-conscious larger users
  in office settings; basic adjustments provide essential support. Compares to
  pricier La-Z-Boy Westley (bonded leather luxury) with similar capacity but
  fabric breathability for warmer climates. Great entry-level for 8-hour daily
  endurance.
