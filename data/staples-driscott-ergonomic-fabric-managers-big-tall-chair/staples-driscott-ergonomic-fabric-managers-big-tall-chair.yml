markdown: >-
  ## Overview


  The Staples Driscott Ergonomic Fabric Managers Big & Tall Chair is designed
  for users who need extra room and higher weight capacity. Its seat is wider
  and deeper than most standard office chairs, making it an instant hit with
  testers above average in height and weight.


  ## Features


  - **Extra-wide seat**: Measures 23.6 inches wide by 19.9 inches deep, a couple
  of inches larger than standard picks

  - **High weight capacity**: Supports up to 400 pounds (same as the Steelcase
  Gesture)

  - **Plush, comfortable seat**: Felt plushy and comfortable to testers

  - **Adjustments**: Seat goes up and down, arms go up and down, lumbar support
  has a depth dial

  - **Cross-legged friendly**: Larger seat accommodates testers who like to sit
  cross-legged at their desks


  ## Flaws and Limitations


  - **Minimal armrest padding**: Armrests were not as comfortable as other
  chairs due to minimal padding

  - **Limited adjustments**: Only basic height adjustments for seat and arms;
  lumbar support depth dial did not make a noticeable difference in testing

  - **Short return window**: Staples' furniture return window is only 14 days


  ## Pricing


  - Budget-friendly price point (significantly less than premium picks like the
  Steelcase Gesture or Herman Miller Aeron)


  ## Warranty


  - Limited 5-year warranty
