name: Ficmax Massage Gaming Chair
description: Budget gaming chair around $130–160 with PU leather upholstery,
  USB-powered massage lumbar cushion, removable neck pillow, high-back design,
  135° recline with tilt lock, and a ~300 lb weight capacity. Designed for
  budget-conscious first-time buyers and casual gamers who want massage features
  and basic reclining without the premium price tag. At roughly one-third the
  cost of the Secretlab Titan Evo, it includes a massage function the Titan does
  not provide, though it trades the Titan's integrated lumbar precision and
  premium build for traditional pillow-based support with a basic gas lift
  mechanism.
