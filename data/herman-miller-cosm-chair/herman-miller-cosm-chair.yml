name: Herman Miller Cosm Chair
description: Premium ergonomic office chair from Herman Miller, ideal for
  long-hour computer work and hybrid gaming/office use. Features flexible
  elastomeric backrest for breathability, dynamic support akin to PostureFit,
  auto-harmonic tilt, adjustable arms. Perfect for programmers enduring 12+ hour
  days, executive offices, gamers seeking office-grade ergonomics. Compared to
  gaming chairs like Secretlab (more stylish but less dynamic support) or budget
  mesh chairs, offers superior durability and 12-year warranty.
