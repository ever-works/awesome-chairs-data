name: Herman Miller Cosm Chair
description: The Herman Miller Cosm Chair is an ergonomic office chair with
  auto-harmonic tilt, a flexible frame for natural movement, and a breathable
  elastomeric back. It features a frameless design, weight-activated recline,
  and supports up to 8 hours of daily use. Ideal for long coding sessions and
  office work, it serves as a more affordable dynamic alternative to the Aeron.
