markdown: >-
  ## Overview


  The Office Master OM5 is a self-weighing task chair designed for intuitive
  adjustment based on user weight and size, eliminating the need for manual
  levers.


  ## Features


  - Polyflex back and fabric seat

  - Seat height adjustment: 37–64 cm (14.7–25 inch)

  - Weight capacity: 136 kg (300 lbs)

  - Chair weight: 29 kg (64 lbs)

  - Available colors: Black, Grey, White

  - Automatic tension adjustments for backrest and seat pan

  - Smooth articulation with wheels on runners for transitioning between
  postures

  - Manual adjustments available for further customization


  ## Pricing


  Mid-range pricing with high-end quality. Availability primarily in the US;
  import fees apply elsewhere.


  ## Use Cases


  Suitable for multi-user environments, long work or gaming sessions, and users
  seeking fuss-free ergonomic support.
