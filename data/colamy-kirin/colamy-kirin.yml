markdown: >-
  ## Overview


  The Colamy Kirin chair at only $159 is a strong contender for the best chair
  under $300 in 2026, offering impressive ergonomic features and adjustability
  that rivals chairs costing significantly more.


  ## Features


  - **Adjustable Lumbar Support**: Customizable lower back support

  - **Breathable Mesh Back**: Promotes airflow for all-day comfort

  - **Adjustable Armrests**: Height and angle adjustable arms

  - **Tilt Function**: Reclining mechanism with tension control

  - **Height Adjustment**: Pneumatic gas lift for easy customization

  - **Durable Construction**: BIFMA certified for quality and safety


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 120°

  - Seat Height Range: 17.5" to 21.5"

  - Certifications: BIFMA certified

  - Warranty: 2-year manufacturer warranty


  ## Pricing


  Starting at $159
