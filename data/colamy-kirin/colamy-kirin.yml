name: Colamy Kirin
description: An ergonomic mesh chair offering adjustable lumbar support,
  breathable mesh back, height-adjustable armrests, pneumatic seat adjustment,
  and a 90°–120° tilt function with tension control at a BIFMA-certified build.
  Designed for budget-conscious WFH users seeking essential ergonomic features
  at $159. Compared to the Staples Hyken's similar mesh design and headrest, the
  Kirin provides comparable core adjustability at a lower price, though with a
  lighter duty rating and simpler armrest design than the Steelcase Leap.
