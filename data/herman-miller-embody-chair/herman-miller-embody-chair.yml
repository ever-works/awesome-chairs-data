name: Herman Miller Embody Chair
description: The Herman Miller Embody Chair is a premium ergonomic office chair
  featuring a pixel-matrix backrest that evenly distributes body weight and
  reduces spinal pressure during extended desk sessions. Its BackFit adjustment,
  seat-depth slider, and adjustable arms accommodate most body types up to 300
  lbs for both WFH and corporate office use. Compared to the Herman Miller
  Aeron's mesh seat and the Steelcase Leap's LiveBack, the Embody offers
  uniquely targeted pressure-point relief with a dynamic flexing back panel at a
  similar $1,400–$1,700 price tier.
source_url: https://store.hermanmiller.com/embody-chair
