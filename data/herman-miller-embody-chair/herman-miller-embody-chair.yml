name: Herman Miller Embody Chair
description: "Herman Miller Embody is an ergonomic office chair mimicking spinal
  movement with its pixelated backrest and dynamic suspension for natural
  posture support during long hours. Features include adjustable backfit for
  pelvic support, no traditional lumbar (uses PostureFit SL), and breathable
  pixelated seat. Perfect for programmers and endurance users (12+ hours);
  superior to gaming chairs like Secretlab in ergonomics and 12-year warranty,
  though pricier. Use cases: coding sessions, executive offices."
