markdown: >-
  ## Herman Miller Embody Chair


  ### Features

  - **Backfit Adjustment**: Customizes to the natural curve of your spine for
  personalized support

  - **Ergonomic Design**: Promotes healthy sitting posture, reducing strain and
  fatigue during extended periods

  - **Pixel-Matrix Backrest**: Evenly distributes body weight and reduces
  pressure on the spine

  - **Adjustable Arms**: Height and width adjustable

  - **Seat Depth Adjustment**: Slides forward or backward


  ### Pricing

  - Starting at approximately $1,400–$1,700 depending on configuration.


  For more details, visit the [Herman Miller Embody Chair
  page](https://store.hermanmiller.com/embody-chair).
