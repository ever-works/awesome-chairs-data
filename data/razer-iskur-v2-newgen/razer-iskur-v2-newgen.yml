name: Razer Iskur V2 NewGen
description: Latest Razer gaming chair featuring CoolTouch EPU leather
  technology, redesigned inner foam for cooler sitting, built-in adaptive lumbar
  curve, 4D armrests, multi-layered foam cushioning, and 90°–152° recline,
  supporting up to 299 lbs at $649 with a 3-year warranty. Ideal for competitive
  gamers and streamers who want Razer's signature racing aesthetic with advanced
  temperature regulation. Compared to the Secretlab Titan Evo's 165° recline and
  magnetic accessories, the Iskur V2 NewGen offers superior cooling technology
  and a more aggressive gaming look, while undercutting Herman Miller Vantum's
  $930+ price while still lacking the Titan Evo's full-flat resting ability.
