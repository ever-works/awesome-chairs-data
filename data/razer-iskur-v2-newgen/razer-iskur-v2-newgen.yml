markdown: >-
  ## Overview


  Razer released the Iskur V2 NewGen with new EPU leather featuring CoolTouch
  technology and redesigned inner foam for cooler sitting. This latest iteration
  represents Razer's commitment to combining gaming aesthetics with practical
  comfort features.


  ## Features


  - **CoolTouch EPU Leather**: New material technology for temperature
  regulation

  - **Redesigned Inner Foam**: Enhanced cooling and comfort

  - **Built-in Lumbar Support**: Integrated adjustable lumbar curve

  - **4D Armrests**: Comprehensive armrest adjustability

  - **Multi-Layered Cushioning**: Premium foam construction

  - **Recline Function**: Up to 152° recline angle


  ## Specifications


  - Weight Capacity: Up to 299 lbs (136 kg)

  - Recline Range: 90° to 152°

  - Height Range: Suitable for 5'6" to 6'2"

  - Warranty: 3-year manufacturer warranty

  - Certifications: Meets industry safety standards


  ## Pricing


  Starting at $649
