name: BV Dual Backrest Chair
description: An ergonomic chair with a unique dual split-backrest design
  inspired by the DuoRest concept, offering freedom of lateral movement and
  flexibility during seated work with an adjustable headrest. Ideal for desk
  workers who prefer dynamic, fluid back movement over rigid static support.
  Compared to the Steelcase Think's single flexible back panel, the
  dual-backrest provides more independent lateral flex but sacrifices firm
  centralized lumbar anchoring, all at a budget-friendly $230 price point.
