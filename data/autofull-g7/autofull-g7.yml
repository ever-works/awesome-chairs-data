name: AutoFull G7
description: Ergonomic gaming chair with a unique elasticated mesh backrest and
  adaptive lumbar support system that shifts with body position, offering
  breathability and a wide range of adjustability for users seeking posture
  guidance during long sessions. Ideal for gamers and desk workers who run hot
  or want dynamic lumbar support that responds to movement. Unlike the Secretlab
  Titan Evo's firm fixed-lumbar design, the G7's mesh construction and
  shape-adaptive system suit users who prefer a more flexible, breathable seat.
