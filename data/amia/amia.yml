name: Amia
description: Engineered for remote developers and office pros in 10+ hour
  sittings, the Steelcase Amia leverages LiveBack system to dynamically follow
  spine motion, ensuring unwavering posture support alongside breathable mesh
  and versatile arm/tilt controls. Premium components earn it BIFMA
  certification for longevity. Its subtle adaptability and airflow trump gaming
  chairs for serious coding and collaboration scenarios.
