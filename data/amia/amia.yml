markdown: >-
  ## Overview


  Amia uses LiveBack technology mimicking spine motion for dynamic support
  during extended sitting.


  ## Features


  - LiveBack dynamic lumbar support

  - Adjustable arms and tilt limiter

  - Breathable mesh back

  - Supports natural postures for coding and meetings


  ## Use Cases


  - Programmer long-hours work

  - Office and executive settings


  ## Comparisons


  More professional and subtle than gaming chairs with equivalent or better
  adjustability.


  ## Pricing


  Available on Steelcase store; varies by configuration.
