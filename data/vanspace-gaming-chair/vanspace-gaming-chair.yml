name: Vanspace Gaming Chair
description: Feature-stacked gaming chair with built-in Bluetooth speakers,
  retractable footrest, USB massage function, customizable RGB lighting, and PU
  leather construction at a mid-range price. Designed for gamers who want
  maximum entertainment extras—audio, massage, and lighting—in a single seat
  without paying for individual peripherals. Compared to the Secretlab Titan
  Evo, it delivers speakers, massage, and RGB that the Titan does not offer, but
  falls short in build quality, lumbar precision, and material refinement;
  durability concerns also place it below dedicated audio chairs like the
  GTRACING Music Series and Herman Miller Vantum.
