name: Steelcase Series 1 Air
description: The Steelcase Series 1 Air is a breathable mesh-back variant of the
  Series 1 ergonomic chair featuring 3D microknit back support, adjustable
  lumbar, 4D armrests with pivot, and a comfort dial for 6–8 hour desk sessions
  rated up to 300 lbs. Designed for budget-conscious WFH and corporate users who
  want full Steelcase ergonomic engineering with enhanced airflow in a compact
  frame. Compared to the standard Series 1's fabric back, it offers better
  temperature regulation during long sessions at roughly $500–$600, matching the
  Herman Miller Aeron's breathability at a fraction of the price.
