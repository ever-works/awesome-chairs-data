name: Global Furniture Duet
description: A commercial-grade ergonomic mesh office chair featuring adjustable
  lumbar support, multi-function mechanism with comprehensive adjustability, and
  professional aesthetics backed by BIFMA certification. Designed for demanding
  corporate environments where durability and mid-range pricing converge.
  Compared to the Steelcase Series 1's four-way adjustable arms and the Herman
