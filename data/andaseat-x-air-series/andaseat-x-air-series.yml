name: AndaSeat X-Air Series
description: Optimized for gamers enduring hot, sweat-inducing long sessions
  over 12 hours, the AndaSeat X-Air Series utilizes full-mesh backrest and seat
  for exceptional breathability, dynamic lumbar support, 3D adjustable headrest,
  and 4D/5D armrests to ensure airflow and ergonomic posture. Its flexible,
  spine-following frame with tilt mechanisms excels in endurance gaming and
  streaming setups. Surpasses leather-heavy Secretlab Titan in ventilation while
  rivaling Flexispot GC4 office chairs in ergonomics with added gaming flair.
