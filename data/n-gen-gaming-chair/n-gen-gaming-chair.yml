markdown: >-
  ## Overview


  The N-Gen Gaming Chair is a budget-oriented gaming chair that was evaluated in
  Wirecutter's gaming chair guide and found to be lacking in several key
  ergonomic areas.


  ## Design


  - Very short backrest providing limited upper body support

  - No headrest support

  - No recline function

  - Fixed armrests that are wide, low, and non-adjustable


  ## Criticisms


  Per Wirecutter testing:

  - **No headrest**: Lacks any form of head or neck support

  - **No recline**: Backrest is fixed in place with no tilting or reclining
  capability

  - **Short backrest**: The backrest height is insufficient for adequate support

  - **Armrests**: Wide, low, and completely non-adjustable, making them
  impractical for most users

  - **Ergonomics**: Not suitable for extended sitting sessions due to the lack
  of adjustability


  ## Price


  Budget tier pricing.


  ## Availability


  Available at major online retailers.
