name: N-Gen Gaming Chair
description: Budget gaming chair with a very short backrest, no headrest
  support, no recline capability, and wide, low, non-adjustable armrests,
  designed for occasional use by users seeking the lowest possible price point.
  Wirecutter testing found it lacking in nearly all ergonomic areas, making it
  unsuitable for extended gaming or office sessions. It falls significantly
  below entry-level competitors like the AndaSeat Novis, BestOffice, or even the
  IKEA STYRSPEL in comfort and usability—recommended only for the most extreme
  budget constraints.
