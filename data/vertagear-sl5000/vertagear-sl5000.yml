name: Vertagear SL5000
description: Ergonomic gaming chair designed for marathon sessions in esports,
  streaming, and PC building. Key features include 140° recline, 4D armrests,
  PUC leather (PU softness with PVC durability), removable memory foam cushions,
  optional RGB lighting, and 330 lb capacity. More stylish and flashy than
  subtle office chairs like Aeron but less understated; offers superior lumbar
  tracking compared to Razer Iskur.
