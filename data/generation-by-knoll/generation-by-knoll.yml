name: Generation by Knoll
description: Premium 2026 ergonomic chair for all-day office and light gaming
  support, with a flexible elastomer back and tilting seat that adapts to
  various postures and body types up to 300 lbs. Offers extensive adjustments
  including height, tilt, seat depth, lumbar, and 4D armrests, ideal for
  programmers and streamers requiring versatile, dynamic comfort. Surpasses
  budget gaming chairs like DXRacer in adjustability and 12-year warranty,
  though at higher cost.
