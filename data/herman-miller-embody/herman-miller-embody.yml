markdown: >-
  ## Overview


  The Herman Miller Embody chair features a pixelated backrest that promotes
  dynamic sitting without the need for additional back support.


  ## Features


  - Pixel matrix suspension

  - Adjustable backfit

  - Tilt limiter

  - BackFit adjustment

  - Seat depth adjustment


  ## Pricing


  Starting at $1,400–$1,700.
