name: Herman Miller Embody
description: "The Herman Miller Embody is a premium ergonomic office chair
  designed for extended sitting sessions, mimicking the spine's natural movement
  with its pixelated backrest and PostureFit SL sacral support. Key features
  include adjustable arms, tilt limiter, and breathable Pellicle mesh for
  all-day comfort. Ideal for programmers and office workers needing posture
  correction; compares favorably to Aeron for dynamic support but with better
  lumbar alignment. Use cases: long coding marathons, hybrid work."
source_url: https://www.hermanmiller.com/products/seating/office-chairs/embody-chair/
