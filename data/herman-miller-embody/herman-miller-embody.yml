name: Herman Miller Embody
description: Co-designed with a team of physicians and biomechanics experts, the
  Embody draws from human-spine research to create its pixel-matrix backrest
  that distributes weight evenly and promotes natural micro-movement across the
  entire back surface. Its BackFit dial, adjustable arms, and seat-depth slider
  accommodate a wide range of body types (up to 300 lbs), making it the go-to
  choice for professionals, programmers, and gamers who demand all-day spinal
  health. Starting at $1,400–$1,700 it sits at the top of Herman Miller's
  premium tier, rivaling only the Aeron in price.
