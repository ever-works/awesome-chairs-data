name: Herman Miller Embody
description: The Herman Miller Embody Chair promotes active sitting with
  pixelated backrest and pixelated seat for dynamic spinal support, aligning
  back, glutes, and sacrum to reduce pressure during extended use. Key features
  include no traditional lumbar (uses backfit adjustment), tilt limiter, and
  height-adjustable arms; perfect for office workers and gamers combating
  sedentary strain. Outperforms Aeron in movement encouragement but at higher
  cost than budget ergonomics like Sihoo M18.
