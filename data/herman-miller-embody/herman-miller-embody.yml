name: Herman Miller Embody
description: Posture-perfecting ergonomic chair designed for 8+ hour use with
  pixelated backrest that dynamically supports the spine, PostureFit adjustment
  for lumbar and sacral support, breathable Pellicle-like mesh, and fully
  adjustable arms, seat depth, and tilt. Ideal for programmers, office
  professionals, and gamers seeking long-endurance comfort without fatigue.
  Offers better ergonomics than gaming chairs' racer style and outlasts budget
  options with a 12-year warranty.
