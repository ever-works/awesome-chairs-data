name: Herman Miller Embody
description: Premium ergonomic gaming and esports chair offering pro-level
  comfort and immersion through pixelated backrest support like cold-cure foam,
  adjustable recline to 165°, and breathable Pellicle fabric. Suited for esports
  tournaments, streaming marathons, and long-hour sessions. Beats budget PU
  leather in durability, breathability, and dynamic spinal support.
