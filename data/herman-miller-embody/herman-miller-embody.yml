name: Herman Miller Embody
description: Herman Miller Embody features pixelated backrest with kinematic
  spine support mimicking natural movement, promoting circulation and reducing
  pressure for 12+ hour use. Key elements include no traditional lumbar (uses
  pixel matrix), adjustable arms, and backfit adjustment. Perfect for
  programmers/office workers; superior to Aeron for dynamic support in long
  hours.
