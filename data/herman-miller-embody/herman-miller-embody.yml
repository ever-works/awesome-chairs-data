name: Herman Miller Embody
description: "Herman Miller Embody chair revolutionizes ergonomic seating with
  its pixelated backrest that mimics spinal movement, promoting active posture
  and circulation for all-day use by programmers and office workers. Features
  include adjustable backfit for pelvic support, no traditional lumbar (uses
  back surface), and breathable pixelated suspension. Superior to gaming chairs
  for health-focused long hours; used by professionals for 12+ hour comfort,
  comparable to Aeron but more dynamic. Use cases: coding, design work,
  endurance sitting."
source_url: https://www.hermanmiller.com/products/seating/office-chairs/embody-chair/
