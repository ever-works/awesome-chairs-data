name: Herman Miller Embody
description: The Herman Miller Embody promotes active sitting with its pixelated
  backrest that mimics spinal movement, pixelated seat for even pressure
  distribution, and adjustable backfit for lumbar support. Features include a
  kinematic back, no traditional lumbar pillow needed, and 12-year warranty;
  perfect for programmers and long-hour desk workers combating back pain.
  Superior to standard gaming chairs like Secretlab in ergonomics and health
  focus, though less flashy.
