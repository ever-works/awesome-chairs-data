name: Herman Miller Embody
description: The Herman Miller Embody chair is an advanced ergonomic office
  chair engineered for prolonged sitting, mimicking the spine's natural motion
  with its pixelated Pixelated Support backrest and patented LiveBack technology
  that flexes with user movement. Key features include height-adjustable arms,
  backfit adjustment for lumbar support, tilt limiter with tension control, and
  breathable Pellicle suspension material for airflow. Ideal for programmers,
  gamers, and office professionals enduring long hours; it surpasses traditional
  chairs like the Aeron in dynamic support and pressure distribution but
  commands a premium price.
