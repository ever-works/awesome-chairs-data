name: Herman Miller Embody
description: The Herman Miller Embody chair is engineered for dynamic sitting,
  promoting health-positive posture through its pixelated backrest that mimics
  spinal movement and distributes weight evenly. Key features include adjustable
  backfit, arms, and seat depth; ideal for programmers and gamers enduring long
  sessions. Compared to standard office chairs, it offers superior breathability
  and motion support versus Secretlab Titan's racing style.
