name: Herman Miller Embody
description: The Herman Miller Embody chair promotes active sitting with its
  pixelated backrest and spine-mimicking frame, reducing pressure points during
  marathon coding or gaming sessions. It features no traditional lumbar but
  PostureFit SL for pelvic support, breathable Pellicle mesh, and fully
  adjustable arms; perfect for endurance users seeking dynamic posture
  correction over static support like in racing chairs. Stands out vs.
  competitors with 12-year warranty and health-focused design backed by
  biomechanics research.
