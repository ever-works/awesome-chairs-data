markdown: >-
  ## Overview


  Budget kneeling chair with metal X-shaped base and four casters. Offers
  pneumatic seat height adjustment despite low-end build.


  ## Use Cases


  - Versatile for mixed use as an active seating alternative in home or small
  offices.

  - Good for posture breaks during prolonged desk work.


  ## Features


  - Pneumatic height adjustment.

  - Thin supportive padding on seat and knee pads.

  - Strong warranty.


  ## Comparisons


  - More portable than full active chairs, but lacks swivel/rocking motion.


  ## Pricing


  Approximately $75.71.
