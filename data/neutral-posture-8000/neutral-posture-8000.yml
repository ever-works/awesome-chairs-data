markdown: >-
  ## Headrest Review


  The Neutral Posture 8000 headrest is consistently ranked at the very top of
  headrest evaluations.


  ## Headrest Features


  - **Extreme range of adjustability**: Can flip out of the way entirely if not
  needed

  - **Versatile positioning**: Can act as a neck roll or support the full back
  of the head

  - **Comfortable padding**: Described as super poofy and well-padded

  - **Stays in position**: Holds its place securely without unwanted movement

  - **Dual-mode use**: Can be used in relaxed mode aligned with the backrest
  when reclining (ideal for watching movies, phone calls), or articulated
  forward for task mode

  - **Large contour**: Big and spacious design

  - **Aesthetic quality**: Matches the chair's design language and build quality


  ## Expert Ratings


  - Consensus: **S-Tier** (highest rating)

  - Reviewers noted they could not identify any changes needed to improve the
  headrest

  - Called "the best headrest I have ever seen" by reviewers
