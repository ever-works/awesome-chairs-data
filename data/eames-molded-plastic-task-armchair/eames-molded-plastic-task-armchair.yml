markdown: >-
  ## Overview


  The Eames Molded Plastic Task Armchair is a Herman Miller office chair design
  by Charles and Ray Eames that features a single-piece polypropylene shell
  design on a four-star aluminum base with height adjustment via pneumatic lift.
