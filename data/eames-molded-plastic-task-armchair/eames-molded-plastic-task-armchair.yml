name: Eames Molded Plastic Task Armchair
description: An iconic mid-century chair by Charles and Ray Eames featuring a
  single-piece molded polypropylene shell on a four-star aluminum base with
  pneumatic height adjustment and optional upholstered seat pad. Suitable for
  design-conscious professionals, reception areas, and short-duration desk
  sessions where iconic aesthetics matter more than clinical ergonomics.
  Compared to the Herman Miller Aeron or Steelcase Leap, it lacks adjustable
  lumbar support, seat depth control, and back tilt, making it better for 1–2
  hour sessions rather than all-day WFH use.
source_url: https://www.store.hermanmiller.com/office-chairs-eames/chairs-eames-lounge-height-4068.html
