markdown: >-
  ## Overview


  The Raynor Ergohuman Mesh (model ME7ERG) is an all-mesh office chair with
  headrest that has been on the market for over a decade. It features a high
  backrest up to 30.5 inches tall and is designed as a one-size-fits-all option
  with similar functionality to premium chairs at a lower price.


  ## Features


  - Adjustable height backrest (up to 30.5" tall)

  - Height adjustable headrest with pivot function

  - Padded mesh headrest design matching the chair's mesh construction

  - Independent lumbar support section designed to flex based on user weight

  - Seat slider for depth adjustment

  - Tilt lock mechanism

  - Tension adjustment

  - Adjustable arms


  ## Potential Considerations


  - The seat has a noticeable frame on the sides, though Raynor includes foam
  padding at the front to reduce discomfort

  - The backrest does not go fully upright; it remains at a slight recline even
  at its most forward angle


  ## Pricing


  Starting price: $865.99 + Free Shipping
