name: Eureka Ergonomic Serene Napa Leather Executive Chair
description: An executive chair crafted from premium Napa leather with an
  adjustable headrest, adjustable lumbar support, smooth tilt mechanism, and
  thick high-rebound cushioning for extended meetings and desk work. Designed
  for professionals seeking refined aesthetics paired with ergonomic
  adjustability. Compared to the Steelcase Leap Executive's advanced lumbar
  engineering and the Herman Miller Aeron's PostureFit SL, the Serene focuses on
  plush leather comfort with simpler tilt-based ergonomics, at $849.
