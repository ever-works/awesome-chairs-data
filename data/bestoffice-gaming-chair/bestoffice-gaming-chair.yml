name: BestOffice Gaming Chair
description: Ultra-budget racing-style gaming chair under $80 with PU leather
  upholstery, removable lumbar and neck pillows, fixed padded armrests, standard
  pneumatic height adjustment, and a 250 lb weight capacity. Ideal for
  budget-conscious first-time buyers, teenagers setting up their first desk, and
  secondary gaming setups where cost is the primary concern. While it lacks the
  build quality, adjustability, and warranty of the Secretlab Titan Evo or
  Herman Miller Vantum, it serves as a functional entry point into gaming-chair
  ergonomics at the lowest price tier.
