name: Vigosit PRO Gaming Chair
description: Budget-friendly big-and-tall gaming chair around $200 featuring a
  350 lb weight capacity, 21-inch wide seat, PU leather upholstery, high-density
  foam padding, adjustable lumbar and neck pillows, 2D armrests, and 90°–155°
  recline. Ideal for budget-conscious larger gamers, first-time buyers needing a
  heavy-duty option, and secondary setups where both size accommodation and low
  cost are priorities. At roughly one-third the price of the Secretlab Titan
  Evo, it offers significantly higher weight capacity (350 lbs vs. 285 lbs) and
  a wider seat, though it lacks the Titan's integrated lumbar, 4D armrests, and
  premium upholstery options.
