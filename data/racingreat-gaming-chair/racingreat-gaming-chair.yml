name: Racingreat Gaming Chair
description: Ultra-budget racing-style gaming chair at approximately $70
  featuring two-tone PU leather, high-density moulded foam, removable lumbar and
  headrest cushions, 90°–155° recline with tilt lock, retractable footrest, and
  a ~240 lb weight capacity. Ideal for budget-conscious first-time buyers,
  teenagers setting up their initial desk, and secondary gaming setups where
  minimal cost is the primary concern. While it undercuts the Secretlab Titan
  Evo by over $400 and offers a footrest, it trades the Titan's 4D armrests,
  integrated lumbar, and premium materials for basic PU leather and fixed
  armrests.
