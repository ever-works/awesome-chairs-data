markdown: >-
  ## Overview


  The Racingreat Gaming Chair is an affordable racing-style gaming chair priced
  around $69.99. Despite its low cost, it delivers useful features typically
  found in more expensive models, making it a solid entry-level option for
  budget-conscious gamers.


  ## Features


  - **Material**: Two-tone PU leather upholstery with one-piece metal frame and
  high-density moulded foam cushioning

  - **Lumbar Support**: Removable lumbar cushion with strap clips

  - **Headrest**: Removable headrest pillow with clip straps

  - **Armrests**: Fixed padded armrests

  - **Recline**: 90° to 155° tilt angle with tilt and lock mechanism

  - **Footrest**: Slide-and-fold extendable footrest

  - **Casters**: Low-noise nylon casters


  ## Specifications


  | Specification | Detail |

  |---|---|

  | Weight | 14.9 kg |

  | Maximum Load | ~109 kg |

  | Seat Width | ~55 cm |

  | Seat Depth | ~59 cm |

  | Material | PU leather, metal frame, high-density foam |


  ## Pricing


  Approximately $69.99
