name: Trust GXT 716 Rizza RGB Gaming Chair
description: High-back gaming chair for kids and young adults featuring
  integrated RGB LED lighting with over 350 customizable modes, metal frame, PU
  leather construction, 2D adjustable armrests, removable lumbar and neck
  cushions, and 175° recline, supporting up to 150 kg (330 lbs) at approximately
  $263. Designed for young gamers and streamers who want a visually striking
  RGB-lit chair with solid ergonomic basics. While it delivers far more visual
  flair than unlit chairs like the Secretlab Titan Evo or DXRacer Air Pro, it
  lacks the advanced integrated lumbar adjustments and premium material quality
  of higher-tier competitors.
