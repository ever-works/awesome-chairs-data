markdown: >-
  ## Overview


  The Trust GXT 716 Rizza is a gaming chair designed for kids and young adults
  that integrates RGB LED lighting tubes along the outer edges. With over 350
  customisable RGB modes and a striking black PU leather finish, this chair
  delivers a futuristic aesthetic. Despite the LED focus, it maintains solid
  basic gaming chair functionality with height-adjustable arm rests and
  neck/lumbar support.


  ## Features


  - **RGB Lighting**: Integrated LED tubes along outer edges (not simple strips)
  with over 350 customisable modes

  - **Controls**: Remote control and powerbank with dedicated storage pocket

  - **Material**: Black PU leather seat with high-density foam padding, metal
  frame, plastic armrests

  - **Lumbar Support**: Removable cushion for lumbar areas

  - **Neck Support**: Removable cushion for neck areas

  - **Armrests**: 2D adjustable armrests (height and rotation) — essential for
  avoiding arm, wrist, and shoulder strain

  - **Seat Height**: Adjustable from 45–53 cm

  - **Recline**: Reclining backrest up to 175° with tilt mechanism and lock

  - **Casters**: Five black nylon wheels, suitable for various floor types


  ## Specifications


  | Specification | Detail |

  |---|---|

  | Weight | 18 kg |

  | Maximum Load | 150 kg |

  | Seat Height | 45–53 cm |

  | Seat Width | 46 cm |

  | Seat Depth | 50 cm |

  | Backrest Height | 80 cm |

  | Backrest Width | 68 cm |

  | Casters | Five black nylon wheels |


  ## Pricing


  Approximately $262.92 (£262.92). Includes powerbank and remote control for the
  LED lighting system.
