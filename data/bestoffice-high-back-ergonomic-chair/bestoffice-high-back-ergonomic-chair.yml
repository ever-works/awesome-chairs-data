name: BestOffice High-Back Ergonomic Chair
description: Budget high-back office chair offering mesh back construction,
  lumbar support, pneumatic height adjustment, and a swivel rolling base with an
  estimated 250 lb weight capacity. Ideal for budget-conscious buyers,
  first-time remote workers setting up a home office, and secondary desk setups
  where basic ergonomic support is needed at minimal cost. At roughly $80–100,
  it provides essential back support and adjustability, though it lacks the
  lumbar adjustability, seat depth control, and long-term durability of the
  Steelcase Series 1 or SIHOO M18 at roughly double the price.
