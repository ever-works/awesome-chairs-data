markdown: >-
  ## Key Features


  - **0 Gravity for 8 Hour Comfort**: High-density foam supports sit bones and
  provides deep pressure relief for thighs. Suitable for upright, cross-legged,
  or reclining positions.


  - **Slow-Rebound Memory Foam Headrest**: Ergonomically shaped with 4-inch
  height adjustment to fit neck curve, supports napping or posture during calls.


  - **4D Ergonomic Lumbar Support**: 4-way adjustable (up/down,
  forward/backward) to maintain natural spine curvature.


  - **Ergonomic 4D Arm Support**: Adjustable to reduce shoulder pressure and
  support forearms.


  - **Heavy-Duty Multi-Functional Tilt Mechanism**: Locks seat at preferred
  angles for gaming or relaxation.


  - **Multi-Scenario Infinite Adjustment**: Backrest adjusts 90°-135° with ±0.5°
  accuracy and 15° forward tilt for 7 usage scenarios including office, gaming,
  and movies.


  - **Modular Quick-Release Mesh Seat Frame**: Breathable mesh (45CFM air
  permeability) interchangeable with memory foam (50kg/m³); disassembles in 30
  seconds, reduces seat temperature by 5-8°C in summer.


  - **Optional Accessories**: Retractable footrest, mesh-frame seat cushion for
  customization.


  ## Pricing


  Pricing not specified on the page.
