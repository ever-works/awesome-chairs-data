name: DXRacer Master (GC/XLMF24LTA/N)
description: DXRacer Master Series (e.g., GC/XLMF24LTA/N) is a luxury ergonomic
  gaming chair with EPU leatherette upholstery, 4D armrests, and aluminum base
  for stability up to 350 lbs. Features high-density foam, adjustable lumbar
  pillow, and 135° recline, perfect for esports pros and long-hour programmers.
  Stands out from Secretlab with wider seat pan and swappable skins.
