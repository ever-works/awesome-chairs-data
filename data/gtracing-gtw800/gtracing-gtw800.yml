markdown: >-
  ## Overview


  GTW800 blends pro-style looks with therapeutic elements for extended
  streaming.


  ## Features


  - Weight Capacity: 300 lbs

  - Lumbar: Massage cushion (vibrating)

  - Lighting: Dynamic RGB base/backrest

  - Material: Smooth PU leather

  - Recline: 90-180°

  - Enhances blood flow and visual setup for all-day comfort


  ## Use Cases


  - Streamers: Camera-ready with RGB and massage

  - Programmers: Lumbar relief for long coding


  ## Comparisons


  - Vs DXRacer: Integrated massage and RGB at budget price; similar capacity


  ## Pricing


  Approximately $220-320.
