name: GTRACING GTW800
description: 2026 budget gaming chair tailored for streamers and all-day use,
  featuring a massage lumbar cushion for back relief during marathon sessions
  and dynamic RGB lighting for on-camera appeal. Constructed with smooth PU
  leather and high 300 lbs capacity, it's suited for programmers and gamers
  seeking professional aesthetics. Delivers added wellness features like massage
  over basic DXRacer models at a lower cost.
