name: Steelcase Leap Chair
description: The Steelcase Leap Chair is an ergonomic office chair featuring
  LiveBack technology that continuously contours to the spine's natural shape,
  providing dynamic lumbar support and pressure relief across the full 8-inch
  recline range. Its 4D adjustable armrests, seat-depth slider, and lower-back
  firmness dial accommodate users from 5'0" to 6'5" up to 400 lbs (500 lbs on
  the Leap Plus), making it a top choice for all-day desk work and corporate
  office environments. Compared to the Herman Miller Aeron's fixed PostureFit
  SL, the Leap offers far more manual adjustment points and a cushioned seat
  alternative to mesh, though both sit in the same premium $1,300–$1,600 tier.
