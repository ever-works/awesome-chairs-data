markdown: >-
  ## Steelcase Leap Chair


  The Steelcase Leap Chair is a flagship ergonomic office chair designed to
  provide unparalleled support and comfort through its innovative technology and
  customizable features.


  ### Features


  - **LiveBack® Technology**: The chair is equipped with LiveBack technology,
  which adapts and contours to the natural movement of your spine, ensuring
  continuous support.
    
  - **Manual Adjustments**: Offers total control over backrest resistance,
  allowing you to fine-tune the level of support to your personal preference.
    
  - **Lumbar Support**: Comes with height-adjustable lumbar support and a lower
  back firmness dial for added comfort.
    
  - **Fully Adjustable Arms**: The chair features 4-dimensional armrests that
  can be customized in height, width, depth, and pivot.
    
  - **Seat Ergonomics**: Includes flexible seat edges that adapt to different
  sitting styles and relieve pressure.
    
  - **Recline Adjustments**: Features a full recline range with four recline
  angle stop settings and an upright back lock.
    
  - **Adjustment Labels**: Adjustments are clearly labeled in both English and
  Braille for easy use.


  ### Additional Options


  - **Leap Plus**: Offers the same benefits as the standard Leap but supports
  users up to 500 lbs.


  ### Pricing


  Pricing ranges from approximately $1,300 to $1,600 for new units, depending on
  configuration. Refurbished models are available at lower price points through
  authorized resellers.


  For more information and purchasing options, visit [Steelcase Leap
  Chair](https://www.steelcase.com/products/office-chairs/leap/).
