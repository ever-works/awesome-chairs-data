name: AKRacing Core EX
description: Racing-style gaming chair featuring a wide seat, PU leather or
  breathable fabric options, and multi-adjustable elements including 4D armrests
  and lumbar for extended gaming and office hybrid use. Similar to DXRacer in
  racing design but with integrated adjustable lumbar differing from DXRacer's
  traditional pillow setup. Provides stable support for long sits in competitive
  environments.
