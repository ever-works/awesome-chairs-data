markdown: >-
  ## Overview


  AKRacing Core EX is a premium gaming chair with enhanced features for esports
  and long sessions.


  ## Features


  - 4D adjustable armrests

  - Up to 180° recline

  - PU leather or fabric upholstery

  - Integrated lumbar support

  - High-density foam padding


  ## Pricing


  Mid-to-premium range, value-packed.
