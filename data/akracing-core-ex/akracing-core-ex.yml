name: AKRacing Core EX
description: AKRacing Core EX is a budget-friendly racing-style gaming chair
  with PU leather, high-density foam padding, 180° recline, and 2D armrests,
  supporting up to 300 lbs for extended gaming marathons. Features padded
  headrest and lumbar pillow; great value alternative to premium Secretlab with
  similar racing aesthetics but lower price (~$250) and 3-year warranty. Ideal
  for entry-level esports.
