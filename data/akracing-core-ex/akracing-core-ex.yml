name: AKRacing Core EX
description: AKRacing Core EX gaming chair excels in endurance for gaming and
  office hybrid use, equipped with 180° recline, 4D adjustable armrests,
  integrated lumbar support, high-density foam, PU leather or fabric options,
  and 300 lbs steel frame capacity. Tailored for esports athletes, streamers,
  and heavy users needing wide seating. Delivers superior recline and value
  compared to Secretlab Titan Evo and Noblechairs Hero, with enhanced
  adjustability for personalized fit.
