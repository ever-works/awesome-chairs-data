name: AKRacing Core EX
description: The AKRacing Core EX gaming chair offers PU leather upholstery,
  high-density foam for endurance, and a 180° recline with footrest for full
  relaxation. Includes 4D armrests, adjustable lumbar pillow, and supports up to
  300 lbs; ideal for budget-conscious gamers wanting pro-level features for
  marathon sessions. Better value than DXRacer entry models with similar
  recline.
