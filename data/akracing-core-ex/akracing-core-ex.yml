name: AKRacing Core EX
description: AKRacing Core EX gaming chair provides PU leather upholstery,
  high-density foam, swiveling lumbar pillow, and 180° recline for full relax
  mode. Steel frame holds 300lbs, with 4D armrests and wide seat pan for bigger
  users. Affordable premium pick vs Secretlab, with better recline range for
  couch-like lounging.
