name: AKRacing Core EX
description: The AKRacing Core EX is a budget-friendly esports chair with PU
  leather, high-back design, 180° recline, and adjustable lumbar pillow for
  competitive gaming. Features 4D armrests and steel frame for durability under
  $500. Suited for entry-level pros; compares to GTRacing but with better
  warranty and build quality.
source_url: https://www.akracing.com/products/core-series-gaming-chair-ak-core-series-ex
