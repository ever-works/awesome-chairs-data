name: AndaSeat Kaiser 3E XL
description: Extra-large variant of the popular Kaiser 3E series, accommodating
  users up to 260 lbs and heights from 4'11" to 6'2", with magnetic lumbar
  support, 4D magnetic armrests, 160° recline, and PVC leather or fabric
  upholstery options. Well-suited for gamers and home-office workers across a
  broad range of body types seeking premium ergonomics on a budget. At $370, it
  delivers features comparable to the AndaSeat Kaiser 3 at a lower cost, though
  it falls short of the Secretlab Titan Evo's integrated lumbar refinement.
