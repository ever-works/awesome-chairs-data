name: AndaSeat Kaiser 3E XL
description: Designed for long sitting in gaming or programming up to 10+ hours,
  the AndaSeat Kaiser 3E XL provides extra-large dimensions, 4D magnetic
  armrests, side-adjustable lumbar, magnetic head pillow, and 160° recline to
  support larger builds and reduce back strain. PU leather or fabric ensures
  breathability and toughness. Perfect for tall gamers in marathons or office
  workers, it accommodates bigger users better than standard DXRacer chairs and
  offers solid value versus premium Herman Miller endurance options.
