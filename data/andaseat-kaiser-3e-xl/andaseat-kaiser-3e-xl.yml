markdown: >-
  ## Overview


  The AndaSeat Kaiser 3E XL was recently reviewed as one of the best gaming
  chairs in 2026. This extra-large variant accommodates a wider height and
  weight range, best for users 4'11\" to 6'2\" and under 260 lbs, making it
  ideal for a broad range of body types.


  ## Features


  - **XL Size**: Extra-large seat and backrest for bigger users

  - **Magnetic Head Pillow**: Designed to support head and neck naturally

  - **Adjustable Lumbar Support**: Integrated lumbar controlled by knobs on both
  sides

  - **4D Magnetic Armrests**: Large seat with ample armrest support

  - **Premium Materials**: Available in PVC leather or fabric variants

  - **Seven Color Options**: Multiple color choices for personalization


  ## Specifications


  - Weight Capacity: Up to 260 lbs

  - Height Range: 4'11\" to 6'2\"

  - Recline Range: 90° to 160°

  - Warranty: 2-year manufacturer warranty


  ## Pricing


  Starting at $369.99
