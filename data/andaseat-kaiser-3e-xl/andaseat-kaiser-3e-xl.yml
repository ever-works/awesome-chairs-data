name: AndaSeat Kaiser 3E XL
description: Built for gamers enduring long hours of play up to 10+ hours, the
  AndaSeat Kaiser 3E XL features extra-large sizing, 4D magnetic armrests,
  adjustable lumbar support via side knobs, magnetic head pillow, and 160°
  recline to support posture and reduce fatigue. Its PU leather or fabric
  options ensure durability and comfort with a steel frame. Ideal for esports
  competitors and tall programmers (up to 6'2", 260 lbs); offers better value
  and size accommodation than standard DXRacer models, though materials are less
  luxurious.
