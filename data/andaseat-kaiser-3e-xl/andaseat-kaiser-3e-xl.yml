name: AndaSeat Kaiser 3E XL
description: Crafted for diverse body types in prolonged gaming marathons, the
  Kaiser 3E XL fits users 4'11" to 6'2" up to 260 lbs with magnetic head pillow,
  knob-adjustable lumbar support, 4D magnetic armrests, 160° recline, and
  choices of PVC leather or fabric over cold-mold foam. The wide seat and
  premium build ensure fatigue-free sitting. Ideal for versatile esports setups
  and streaming workstations, it offers broader sizing than standard Secretlab
  Titans at lower cost, though with less sophisticated lumbar tech compared to
  Herman Miller collaborations.
