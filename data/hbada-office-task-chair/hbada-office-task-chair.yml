  ## Overview


  The Hbada Office Task Chair is a very affordable budget office chair that can
  be yours for just over $100, offering essential ergonomic features and comfort
  for users seeking basic but reliable seating on a tight budget.


  ## Features


  - **Ultra-Affordable Pricing**: One of the most budget-friendly options
  available

  - **Basic Ergonomic Support**: Essential lumbar and back support

  - **Mesh Back**: Breathable design for basic comfort

  - **Height Adjustment**: Pneumatic gas lift for seat height

  - **Simple Assembly**: Easy to put together

  - **Compact Design**: Space-saving footprint


  ## Specifications


  - Weight Capacity: Up to 250 lbs

  - Recline Range: Basic tilt mechanism

  - Seat Height Range: 17" to 21"

  - Warranty: 1-year manufacturer warranty


  ## Pricing


  Starting at $109.99
