markdown: >-
  ## Overview


  The Hbada Office Task Chair is a budget-friendly ergonomic office chair that
  offers essential features at an accessible price point. It features a
  breathable mesh back and comfortable cushioned seat for all-day use.


  ## Features


  - Breathable mesh back

  - Built-in lumbar support

  - Adjustable seat height

  - 3D adjustable armrests

  - Tilt mechanism with tension control

  - 120° tilt back


  ## Specifications


  - Weight Capacity: Up to 250 lbs

  - Seat Height Range: 17.5" to 21.5"

  - Recline Range: 90° to 120°


  ## Pricing


  Starting at approximately $154.99
