name: Hbada Office Task Chair
description: A budget office chair at approximately $155 with essential
  ergonomic support via built-in lumbar support, breathable mesh back, 3D
  armrests (height, width, rotation), and basic tilt mechanism with tension
  control. Designed for students and occasional WFH users who need functional
  seating on a tight budget. Compared to the Steelcase Series 1's $500 offering,
  the Hbada delivers mesh breathability and 3D arm adjustability at roughly 30%
  of the Series 1 price, though it lacks the Series 1's weight-activated tilt,
  seat depth slider, and commercial-grade build quality.
