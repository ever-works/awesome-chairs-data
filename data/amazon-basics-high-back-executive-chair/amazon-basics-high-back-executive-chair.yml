name: Amazon Basics High-Back Executive Chair
description: Budget-friendly high-back executive chair designed for
  professionals enduring long hours in office environments or home office
  management, featuring polished bonded leather upholstery, pneumatic height
  adjustment, padded armrests, and tilt mechanism with tension control for
  comfortable reclining. Key elements include a professional aesthetic suitable
  for executive desks, breathable leather alternative, and 275 lb capacity,
  supporting extended sessions without fatigue. Compared to gaming chairs'
  aggressive styling and casual seating's lack of adjustability, it offers
  reliable professional support at an accessible price point.
