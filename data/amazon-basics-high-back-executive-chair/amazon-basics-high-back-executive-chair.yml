markdown: >-
  ## Overview


  The Amazon Basics High-Back Executive Chair offers executive-style design with
  high-back construction and bonded leather upholstery, providing a professional
  appearance and comfort at Amazon Basics' value-focused pricing.


  ## Features


  - **High-Back Design**: Full back support to shoulders

  - **Bonded Leather**: Professional appearance with easy cleaning

  - **Padded Armrests**: Comfortable arm support

  - **Adjustable Height**: Pneumatic gas lift

  - **Tilt Function**: Reclining mechanism with tension control

  - **Executive Styling**: Professional appearance for offices


  ## Specifications


  - Weight Capacity: Up to 275 lbs

  - Recline Range: Basic tilt function

  - Seat Height Range: 18.9\" to 22.8\"

  - Warranty: 1-year limited warranty

  - Available Colors: Black and brown


  ## Pricing


  Starting at $119.99
