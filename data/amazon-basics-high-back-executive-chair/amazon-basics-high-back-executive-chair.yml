name: Amazon Basics High-Back Executive Chair
description: Budget executive-style office chair offering bonded leather
  upholstery, pneumatic height adjustment, padded armrests, and a basic tilt
  mechanism with tension control, supporting up to 275 lbs. Ideal for
  budget-conscious buyers, first-time remote workers, and secondary desk setups
  where cost matters more than precision ergonomics. At roughly $120, it
  provides an office-appropriate aesthetic and basic adjustability, though it
  lacks the lumbar depth, seat adjustability, and long-haul comfort of the
  Steelcase Series 1 or Herman Miller Sayl at 4x the price.
