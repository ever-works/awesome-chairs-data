markdown: >-
  ## Overview


  The Eureka Ergonomic Mathias is a premium executive office chair that features
  high-quality Napa leather, Italian minimalist style, and FSC-certified wood
  veneers for an elegant, refined aesthetic.


  ## Features


  - FSC-certified wood veneers — sustainable, beautifully finished surface
  accent

  - Premium Napa leather — soft, supple leather for a luxurious feel

  - Italian minimalist design style

  - Ergonomic padding for all-day comfort

  - Professional and elegant aesthetic suitable for home workspaces, executive
  offices, board rooms, and management offices

  - Sturdy construction


  ## Color Options


  - Classic Brown

  - Modern Black


  ## Target Users


  Well-suited for users who want premium aesthetics and comfortable leather
  seating rather than mesh ergonomic task seating.
