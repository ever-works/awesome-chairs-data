name: Eureka Ergonomic Mathias
description: An executive chair featuring Italian minimalist design with Napa
  leather upholstery, FSC-certified wood veneer accents, and thick padding for
  comfort during long meeting sessions. Designed for executive offices,
  boardrooms, and home workspaces where modern aesthetics complement ergonomic
  support. Compared to the Herman Miller Eames Executive's $4,098 price point,
  the Mathias delivers similar premium leather sophistication with wood accents
  at roughly $700, though it lacks the Aeron-grade adjustable lumbar and mesh
  breathability needed for all-day continuous desk work.
