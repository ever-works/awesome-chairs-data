name: OFM Essentials Racing Style Leather Chair
description: Budget racing-style gaming chair at approximately $90–120 featuring
  bonded leather upholstery, segmented padding, padded fixed armrests, pneumatic
  height adjustment, and a 250 lb weight capacity. Ideal for budget-conscious
  first-time buyers and secondary desk setups where gaming aesthetics matter at
  a low cost. While it provides basic racing-chair styling and adequate padding
  for short sessions, it lacks the lumbar adjustability, build quality, and
  ergonomic refinement of the Secretlab Titan Evo or Herman Miller Vantum at
  4–5x the price.
