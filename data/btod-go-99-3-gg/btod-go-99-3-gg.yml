name: BTOD GO-99-3-GG
description: A big-and-tall mesh office chair rated for 500 lbs of 24/7
  continuous use, featuring a 25.5" wide seat, fully adjustable lumbar support
  (up/down and in/out), height-adjustable backrest and arms, and reinforced
  components throughout. Built for control rooms and demanding environments
  where heavy-duty mesh support is critical. Compared to the Herman Miller
  Aeron's mesh suspension and 350 lb capacity, the GO-99-3 delivers 150 lbs more
  weight capacity and fully adjustable lumbar at roughly half the Aeron price,
  though the mesh is stiffer and the warranty is significantly shorter.
