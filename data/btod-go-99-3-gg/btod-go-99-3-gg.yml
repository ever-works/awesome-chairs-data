markdown: >-
  ## Overview


  The BTOD GO-99-3-GG is a big and tall mesh office chair designed to support
  users up to 500 lbs in round-the-clock applications. It features beefed-up
  components throughout and a generously sized 25.5" wide seat suitable for
  taller and larger users.


  ## Features


  - 500 lbs weight capacity

  - 25.5" wide seat with seat height range suited for tall people

  - Rated for 24/7 usage

  - Reinforced casters, cylinder, chair base, and arms

  - Swivel tilt mechanism with tilt lock and tension adjustment

  - Height adjustable arms

  - Height adjustable backrest

  - Fully adjustable lumbar support (up/down and in/out)

  - Mesh back design


  ## Potential Considerations


  - Only suitable for big and tall users; the seat, back, and arm width are too
  large for average-sized people

  - Arms do not have adjustability beyond height and are too far apart for most
  average users

  - No seat slider to adjust the seat depth

  - Lower quality components manufactured in China with a short warranty period

  - Mesh is not as soft or flexible as higher-end products


  ## Pricing


  Starting price: $566.99 + Free Shipping
