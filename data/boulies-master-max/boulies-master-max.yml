name: Boulies Master Max
description: A big-and-tall ergonomic chair with extended seat dimensions
  supporting up to 150 kg, featuring 4D aluminum armrests, a customizable lumbar
  pillow, cold-cure foam seating, and a 95°–165° recline range with optional
  built-in leg rest. Built for larger users needing robust construction during
  short-to-moderate desk sessions. Compared to the Herman Miller Aeron size C,
  the Master Max offers similar weight capacity with a wider, cushioned foam
  seat but lacks the advanced mesh suspension and PostureFit lumbar
  adjustability of its premium counterpart.
