markdown: >-
  ## Overview


  Executive big & tall chair for extended sitting with premium materials.


  ## Features


  - 150kg (330lbs) capacity

  - Extended wide seat/depth

  - 4D aluminum armrests

  - Adjustable lumbar pillow

  - Cold-cure foam cushion

  - 95°-165° recline + rocking

  - Optional leg rest


  ## Use Cases


  Supports programmers during 10+ hour coding marathons with posture focus.
  Ideal for executives needing robust daily office comfort. Fits larger users in
  hybrid work/gaming without bottoming out.


  ## Comparisons


  Vs Titan Evo: Wider seat and leg rest for big users; similar recline but more
  office-oriented lumbar.


  ## Pricing


  $599–$799.
