markdown: >-
  ## Overview


  The Boulies Master Max is designed as an executive/big and tall option,
  offering extended seat width and height with a 150kg weight capacity. It is
  built for larger frame users who require a robust base and reliable support
  during short to moderate sitting sessions.


  ## Key Features


  - **Extended seat width and height** for larger users

  - **150kg weight capacity** with reinforced construction

  - **4D adjustable armrests** with aluminum construction for multi-axis
  adjustment

  - **Customizable integrated lumbar pillow** that adjusts up and down to match
  the natural curvature of the spine

  - **Cold-cure foam seat cushion** that resists bottoming out during use

  - **Tailored round-edge cushion** to eliminate sharp edges and reduce pressure
  on hips and thighs

  - **Rocking/reclining mechanism** with 95°-165° recline range and 15° rocking
  flexibility

  - **Optional built-in leg rest** for reclining breaks

  - **Class-4 gas lift** and heavy-duty base for durability

  - **Available materials**: Ultraflex PU leather or water-repellent fabric


  ## Best For


  - Large-frame users needing more robust build quality and weight capacity

  - Users who spend under 8 hours seated and need reliable day-after-day support

  - Those looking for high-quality materials with an executive look and feel


  ## Considerations


  - Recommended for short to moderate sessions rather than prolonged 8+ hour use

  - Premium pricing relative to value models

  - Leather option may feel warmer than mesh in hot climates — fabric/mesh
  variants recommended for users who sweat easily

  - Sizeable chair footprint that may take up more room
