name: Boulies Master Max
description: Boulies Master Max supports long-hour sitting for big-and-tall
  users with ergonomic design, featuring extended seat dimensions, 4D aluminum
  armrests, customizable lumbar pillow, cold-cure foam seating, and wide recline
