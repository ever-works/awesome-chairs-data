markdown: >-
  ## Overview


  The TS-83 Techni-Sport Gaming Chair is a durable, premium pink-accented gaming
  chair built with a steel frame and memory foam cushions. It features lighter
  pink accents throughout the chair with a cool gray base color and black frame
  and armrests.


  ## Features


  - Steel frame construction for durability

  - Memory foam cushioning for premium comfort

  - 4D armrests adjustable across height, depth, width, and angle

  - Faux leather material

  - Non-marking casters

  - Back recline up to 150°

  - Particularly wide seat for larger users

  - 3% of all sales go towards fighting breast cancer


  ## Dimensions


  - Seat depth: 25.5"

  - Seat width: 29.5"

  - Height: 53"

  - Max weight capacity: 300 lbs


  ## Pricing


  Positioned as a pricier chair with premium features. The 150° recline is
  slightly restrictive compared to some competitors.
