name: TS-83 Techni-Sport Gaming Chair
description: Premium pink-accented racing gaming chair with steel frame, memory
  foam cushioning, 4D adjustable armrests, 150° recline, faux leather
  upholstery, and a particularly wide 29.5" seat supporting up to 300 lbs, with
  3% of sales donated to breast cancer research. Ideal for gamers and streamers
  who want a pink aesthetic with premium build quality and charitable giving.
  Compared to the Secretlab Titan Evo's more reserved design language, the TS-83
  stands out with bold pink accents while offering a wider seat and charitable
  contribution, though its 150° recline is more limited than the Titan Evo's
  165° maximum.
