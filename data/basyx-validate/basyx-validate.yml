name: Basyx Validate
description: A big-and-tall office chair with reinforced components supporting
  up to 450 lbs, featuring a 31.6" high backrest, SofThread vinyl upholstery,
  integrated headrest, and center-tilt with tension control. Designed for larger
  users in demanding corporate or home office environments where structural
  integrity matters. Unlike the highly adjustable Steelcase Leap or Herman
  Miller Aeron, the Validate trades extensive ergonomics for brute-force support
  with a simple tilt mechanism and limited adjustability suited for stable,
  stationary use.
