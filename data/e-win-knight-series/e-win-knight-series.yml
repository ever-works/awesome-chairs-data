name: E-Win Knight Series
description: Designed for intense gaming and office endurance, the E-Win Knight
  Series supports prolonged sitting with thick high-density foam padding,
  high-back ergonomic design, and adjustable features to combat fatigue in 12+
  hour sessions. Includes padded headrest, 4D armrests, 170° recline, lumbar
  pillow, and heavy-duty metal frame up to 550 lbs. 2026 budget pick
  outperforming entry-level racers like GTPlayer in durability and capacity for
  big & tall gamers.
