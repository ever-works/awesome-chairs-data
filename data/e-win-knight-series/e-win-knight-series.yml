  # EWin Knight Series

  **Website:** https://ewinracing.com/products/ewin-knight-series-gaming-chair

  Heavy-duty racing-style gaming chair for extended sessions.

  ## Features

  - Thick cushioning and high backrest
  - Adjustable armrests and lumbar pillow
  - 170° recline with footrest
  - Supports up to 550 lbs
  - PU leather, metal frame

  ## Pricing

  Typically $300-500 USD range.

  ## Use Cases

  Gaming, office, big users.
