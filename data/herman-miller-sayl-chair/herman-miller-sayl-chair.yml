name: Herman Miller Sayl Chair
description: An ergonomic office chair by Yves Béhar featuring a distinctive
  elastomeric suspension frame that provides flexible back support, adjustable
  lumbar, tilt limiter, and adjustable arms in a compact frame with sustainable
  materials. Designed for smaller users and design-conscious professionals
  seeking Herman Miller build quality at a mid-range price for daily desk use.
  Compared to the Herman Miller Aeron's mesh suspension and the Steelcase Leap's
  LiveBack, the Sayl's unique suspension frame provides lighter, more flexible
  back support with less comprehensive adjustability at a lower price point.
