name: Noblechairs Hero
description: Noblechairs Hero is a versatile gaming chair with a flat waterfall
  seat edge to reduce thigh pressure during long sessions, 135° recline, and 4D
  armrests with adjustable width/depth. Features Alcantara or PU leather
  options, integrated lumbar support, and a stable aluminum base; great for
  esports pros and everyday gamers seeking office-like ergonomics. Outperforms
  budget racing chairs in build quality but pricier than GTRacing.
