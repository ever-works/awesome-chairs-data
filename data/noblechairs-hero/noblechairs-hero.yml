name: Noblechairs Hero
description: Ergonomic gaming chair designed for marathon sessions in esports,
  streaming, and PC building. Key features include 165° recline, 4D armrests,
  real leather or breathable Alcantara fabric, cold foam padding, wide seat pan,
  and class-4 gas lift for stability. More stylish and flashy than subtle office
  chairs like Aeron but less understated; offers superior lumbar tracking
  compared to Razer Iskur.
