name: Noblechairs Hero
description: Noblechairs Hero is a premium racing-style gaming chair with
  genuine leather options, 4D armrests, integrated lumbar support, and a
  cold-cure foam seat for superior durability and comfort during extended
  gaming. Features 135° recline, aluminum five-star base, and customizable
  stitching; supports up to 330lbs. Excels over standard PU leather chairs like
  GTPlayer in material quality and 3-year warranty, ideal for competitive
  esports.
