name: Noblechairs Hero
description: "Noblechairs Hero series offers premium real leather or fabric
  gaming chairs with a wide seat (22 inches), 4D armrests, and 135-165° recline
  for immersive esports and sim racing. Built on a steel frame supporting 330
  lbs, with integrated lumbar and headrest; excels in durability for big & tall
  users compared to DXRacer (better leather quality). Use cases: long-hour
  coding, competitive gaming."
