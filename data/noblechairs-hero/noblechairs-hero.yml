name: Noblechairs Hero
description: Noblechairs Hero is a premium racing-style gaming chair with
  breathable ECO-Leather, 4D armrests, integrated lumbar support, and aluminum
  base for stability up to 330lbs. It reclines to 135 degrees with a
  multi-functional mechanism and includes a removable headrest. Ideal for
  esports pros; rivals DXRacer in style and Secretlab in comfort, with a 2-year
  warranty and more sophisticated upholstery.
