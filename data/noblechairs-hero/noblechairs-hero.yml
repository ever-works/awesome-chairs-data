name: Noblechairs Hero
description: Designed for endurance sitting in 10+ hour coding or gaming
  marathons, Noblechairs Hero includes integrated lumbar support, 4D armrests,
  135° recline, and breathable TX fabric options for premium all-day comfort
  without fatigue. Suited for esports pros and remote workers prioritizing
  luxury and durability. Offers superior integrated lumbar support over the
  Secretlab Titan's manual adjustments.
