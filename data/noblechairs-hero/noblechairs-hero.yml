markdown: >-
  ## Overview


  Noblechairs Hero delivers luxury gaming comfort using real leather upholstery
  and cold foam padding. Equipped with a class-4 gas lift for enhanced
  stability, it appeals to premium users favoring subtle European design over
  RGB-heavy alternatives.


  ## Features


  - Real leather upholstery

  - Cold foam padding

  - Class-4 gas lift

  - Alcantara material options

  - Wide seat pan

  - Adjustable arms

  - 4D armrests

  - XL casters


  ## Pricing


  - HERO Hybrid Leather Series: $619.00 (Free Shipping)

  - HERO TX Anthracite: $549.00 (Free Shipping)

