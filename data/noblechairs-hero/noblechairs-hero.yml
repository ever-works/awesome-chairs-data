markdown: >-
  ## Overview


  Premium cold foam and leather for pro gaming marathons.


  ## Features


  - Cold foam padding

  - 4D armrests

  - Integrated lumbar support

  - 135° recline

  - Class-4 gas lift

  - Real leather/TX fabric

  - Magnetic pillow compatible


  ## Use Cases


  - Esports tournaments

  - Long streaming

  - Daily pro sessions


  ## Comparisons


  Vs budget: Leather/coldfoam lasts 5x longer without wear; superior lift
