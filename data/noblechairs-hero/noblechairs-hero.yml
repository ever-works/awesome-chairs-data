name: Noblechairs Hero
description: Noblechairs Hero is a premium racing-style gaming chair with
  breathable eco-leather, integrated lumbar support, 4D armrests, and 135-degree
  recline. Offers real leather upgrades, wide seat, and stable aluminum base.
  Ideal for esports pros and heavy users up to 330lbs; compares to DXRacer with
  better fabric options and German engineering.
