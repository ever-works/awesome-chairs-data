markdown: >-
  ## Product Summary: Haworth Zody Chair


  ### Overview

  The **Haworth Zody Chair** is an innovative ergonomic office chair designed to
  support healthy posture and reduce fatigue during prolonged sitting periods.


  ### Features

  - **Asymmetrical Lumbar Support**: Allows users to fine-tune comfort
  independently on each side

  - **Pelvic Support System**: Ensures consistent lumbar support and balanced
  feel

  - **Dual Position Support**: Accommodates seated and intermediate perch
  positions, ideal for sit-to-stand desk setups

  - **GREENGUARD Gold Certified**: Tested to be free from over 10,000 chemicals

  - **Cradle to Cradle Bronze Certified**: Meeting rigorous environmental
  standards


  ### Specifications

  - Weight capacity: up to 325 lbs

  - Seat height, depth, and tilt tension: all adjustable

  - Free ground shipping; arrives mostly assembled

  - 30-day free returns


  For more information, visit the [Haworth Zody
  Chair](https://store.haworth.com/products/zody-executive-chair).
