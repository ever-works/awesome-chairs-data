name: Haworth Zody Chair
description: The Haworth Zody Chair is a premium ergonomic task chair featuring
  an asymmetrical lumbar support system that allows independent left/right
  adjustment, a pelvic support pad for maintaining natural spinal curvature, and
  a synchro-tilt mechanism for users up to 325 lbs. It accommodates 6+ hour desk
  sessions in corporate offices or standing-desk setups with its dual-position
  seated and perched modes. Compared to the Herman Miller Aeron's centered
  PostureFit lumbar and the Steelcase Leap's LiveBack, the Zody's unique
  asymmetrical design targets specific pressure points more precisely at roughly
  $800–$1,200.
