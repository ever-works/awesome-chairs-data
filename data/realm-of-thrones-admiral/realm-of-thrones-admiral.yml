name: Realm of Thrones Admiral
description: Budget-friendly racing-style gaming chair with an oversized
  adjustable mesh headrest (height and pivot), PU leather upholstery, steel
  frame, and a recline range up to 155°, supporting up to 300 lbs. Rated C+ to
  B-Tier by reviewers, it is praised for its unusually large and comfortable
  headrest that accommodates users of varying heights. Compared to the Secretlab
  Titan Evo's magnetic memory foam head pillow, the Admiral's oversized mesh
  headrest offers more breathability and coverage, though the chair overall
  lacks the Titan's integrated lumbar, material quality, and office-grade
  refinement.
