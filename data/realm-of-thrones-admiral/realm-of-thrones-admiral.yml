markdown: >-
  ## Headrest Review


  The Realm of Thrones Admiral is a random Amazon purchase chair that features
  an unusually large mesh headrest.


  ## Headrest Features


  - **Massive size**: Oversized headrest provides generous coverage

  - **Height and pivot adjustment**: Offers both vertical and angular adjustment

  - **Comfortable mesh**: More comfortable than the ErgoChair Pro with no hard
  points

  - **Dual-mode support**: When sitting upright, it stays out of the way; when
  reclining, it engages comfortably

  - **No uncomfortable frame contact**: Despite appearances of hard points,
  nothing is felt during actual use


  ## Expert Ratings


  - Consensus: **C+ to B-Tier**

  - More comfortable than similarly sized headrests such as on the Humanscale
  Freedom chair

  - Better than the LE9 and ErgoChair Pro headrests in comfort


  ## Drawbacks


  - Tendency to move when not desired

  - Some reviewers feel it doesn't quite match the quality of the chair itself
