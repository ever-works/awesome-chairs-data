name: GTPlayer GT800A Footrest
description: Budget gaming chair at approximately $130 with PU leather
  upholstery, fixed-height armrests, built-in retractable footrest, 90°–145°
  recline with pivoting seat mechanism that adjusts with the backrest, and a 280
  lb weight capacity. Ideal for budget-conscious first-time buyers, casual
  gamers, and secondary desk setups where integrated footrest and pivoting
  comfort matter. While it offers a unique syncing pivot mechanism uncommon at
  this price tier, it lacks the 4D armrests, integrated lumbar precision, and
  long-term build quality of the Secretlab Titan Evo or Herman Miller Vantum at
  roughly triple the price.
