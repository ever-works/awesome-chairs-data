markdown: >-
  ## Overview


  Entry-level PU leather gaming chair with footrest and basic adjustments,
  emphasizing value for casual extended use under $150.


  ## Key Features vs Price


  - **Retractable Footrest** (premium-like relaxation in budget tier)

  - **Pivoting Seat** (syncs with recline, uncommon under $200)

  - **145° Recline** (with tilt lock for versatile positioning)

  - **PU Leather** (durable, easy-clean surface)

  - **Padded Fixed Armrests** (comfortable for short-medium sessions)


  ## Long-Hour Comfort


  Good for up to 6 hours with footrest aiding breaks; PU holds up but benefits
  from airflow in warm environments.


  ## Comparisons to Premium


  Homall (~$120) or BestOffice: Similar but GTPlayer adds pivoting seat. Vs
  Secretlab (~$500+): Lacks adjustability but 70% less cost for core gaming
  needs.


  ## Specifications


  - Weight Capacity: 280 lbs

  - Recline: 90°-145°


  ## Pricing


  Starting at $129.99.
