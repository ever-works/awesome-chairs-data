name: GTPlayer GT800A
description: The GTPlayer GT800A is an entry-level PU leather gaming chair with
  a retractable footrest and basic adjustments including height and recline from
  90° to 145° with pivoting seat. It supports up to 280 lbs and provides good
  value for starter setups compared to similar budget options like Homall. Ideal
  for casual gamers and first-time buyers seeking an affordable chair with
  footrest under $150.
