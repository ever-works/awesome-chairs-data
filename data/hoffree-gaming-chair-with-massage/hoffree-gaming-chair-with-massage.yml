name: HOFFREE Gaming Chair with Massage
description: Ergonomic high-back gaming chair with built-in lumbar massage,
  Bluetooth shoulder speakers, RGB LED lighting, extendable footrest, padded
  armrests, and 300 lb weight capacity, supporting users up to 6'4" for 6–8
  continuous hours. Ideal for gamers and streamers seeking an all-in-one
  entertainment seat with massage, audio, and ambient lighting. While it
  integrates more features than the Secretlab Titan Evo—bluetooth speakers,
  massage, and RGB—it lacks the Titan's precision lumbar dial and premium build
  quality.
