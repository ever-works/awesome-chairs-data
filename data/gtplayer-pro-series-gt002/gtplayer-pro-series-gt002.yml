name: GTPLAYER Pro Series GT002
description: Mid-range gaming chair at approximately $150–180 with PU leather
  upholstery, 4D adjustable armrests, removable lumbar and neck support pillows,
  high-density foam cushioning, 90°–155° recline, and a ~300 lb weight capacity.
  Designed for first-time gaming chair buyers and budget-conscious home office
  workers who want advanced adjustability without premium pricing. At roughly
  one-third the cost of the Secretlab Titan Evo, it includes 4D armrests rarely
  found at this tier, though it trades the Titan's integrated lumbar system,
  magnetic accessories, and premium build quality for a traditional design.
