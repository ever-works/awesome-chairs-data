markdown: >-
  ## Overview


  The Modway Articulate Ergonomic Mesh is a budget-friendly office chair
  designed to offer comfort and breathability with a mesh back and padded seat.
  It is an excellent choice for cost-conscious users seeking a lightweight,
  adjustable office chair.


  ## Features


  - **Breathable Mesh Back**: Designed with a ventilated mesh panel for air
  circulation and reduced heat buildup

  - **Padded Seat**: Soft cushion for seated comfort

  - **Adjustable Armrests**: Height-adjustable padded arms

  - **Height Adjustment**: Pneumatic gas lift

  - **Swivel Base**: Five-star base with smooth-rolling casters

  - **Multiple Colors**: Available in a variety of color options


  ## Specifications


  - Weight Capacity: Up to 200 lbs

  - Dimensions: 26"D x 26"W x 41.5"H

  - Warranty: 1-year limited warranty


  ## Pricing


  Starting at approximately $109.99
