name: Modway Articulate Ergonomic Mesh
description: Budget mesh office chair around $100–130 with a breathable mesh
  back, padded seat, height-adjustable armrests, pneumatic height adjustment,
  and a 200 lb weight capacity. Ideal for budget-conscious first-time buyers,
  light-use home offices, and secondary desk setups where mesh ventilation at a
  low price point is desired. While it offers essential adjustability and
  reliable mesh airflow, it lacks the lumbar precision, seat depth
  adjustability, and build longevity of the Steelcase Series 1 or Herman Miller
  Sayl at 4–5x the price.
