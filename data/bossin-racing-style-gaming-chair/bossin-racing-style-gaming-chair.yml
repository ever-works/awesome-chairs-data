name: Bossin Racing Style Gaming Chair
description: Budget racing-style gaming chair around $140 featuring PU leather
  upholstery, USB-powered massage lumbar pillow, retractable footrest, 155°
  recline, and a 250 lb weight capacity. Designed for budget-conscious
  first-time buyers and casual gamers who want comfort extras like massage and a
  footrest without premium pricing. While it delivers more features than the
  BestOffice gaming chair at a similar price, it still lacks the integrated
  lumbar precision, 4D armrests, and long-term build quality of the Secretlab
  Titan Evo or Herman Miller Vantum.
