markdown: >-
  ## Overview


  The Bossin Racing Style Gaming Chair with massage function and retractable
  footrest provides essential gaming chair features at a budget-friendly price,
  making it ideal for entry-level gamers or casual users.


  ## Features


  - **Racing-Style Design**: Sporty aesthetic for gaming setups

  - **Massage Lumbar Pillow**: USB-powered vibrating support

  - **Retractable Footrest**: Extends for relaxation

  - **Adjustable Height**: Pneumatic gas lift

  - **Reclining Function**: Multi-position backrest

  - **Affordable Pricing**: Entry-level gaming chair option


  ## Specifications


  - Weight Capacity: Up to 250 lbs

  - Recline Range: 90° to 155°

  - Power: USB-powered massage

  - Warranty: 1-year limited warranty

  - Colors: Multiple color options available


  ## Pricing


  Starting at $139.99
