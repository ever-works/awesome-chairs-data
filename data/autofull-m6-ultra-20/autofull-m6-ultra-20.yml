name: Autofull M6 Ultra 2.0
description: The AutoFull M6 Ultra 2.0 is a premium esports gaming chair
  equipped with advanced cooling technology, massaging lumbar support, and RGB
  lighting to enhance immersive gaming experiences. Perfect for competitive
  players enduring 8+ hour sessions, it offers greater adjustability than
  standard office chairs and rivals high-end models like Herman Miller at half
  the price. Standout features include 6D armrests, anti-gravity recline, and
  built-in speakers for superior audio.
