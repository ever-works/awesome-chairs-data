markdown: >-
  ## Overview


  Autofull M6 Ultra 2.0 builds on previous Mechanical Master chairs with refined
  6D armrests (height, width, pivot, depth, tilt, 360° rotation) optimized for
  various gaming inputs including handheld devices.


  ## Features


  - Adaptive 2D lumbar support: height (1.9″) x depth (3.94″) adjustable, tracks
  user movement

  - 6D armrests: height, width, pivot, depth + tilt + 360° rotational

  - Clip-on neck pillow: depth (1.26″) and height (3.94″) adjustable

  - Luxury extras: deep back massager, battery-powered heating and cooling fan
  seat controls, retractable footrest

  - Recline: 90-160°, rock or lock upright modes (no multifunction tilt lock)

  - Sizing: Seat 20″ (W) x 20″ (D), Backrest 20.2″ (W) x 32″ (H), Seat height
  16.3-19.5″

  - Size rating: 5’7″ to 6’4″; 330 lbs

  - Warranty: 3 years


  ## Pricing


  $499 on Amazon
