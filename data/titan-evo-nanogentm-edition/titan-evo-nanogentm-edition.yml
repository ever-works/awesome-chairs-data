name: TITAN Evo NanoGen™ Edition
description: The TITAN Evo NanoGen™ Edition upgrades Secretlab's flagship Titan
  Evo with advanced NanoGen Hybrid Leatherette and extra Nanofoam Composite
  cushioning for noticeably softer, silkier comfort during extended gaming or
  streaming sessions. Ideal for users who prioritize plush seating over cost
  savings, as it carries a premium over the standard Titan Evo. While the Razer
  Iskur V2 offers comparable adaptive lumbar support, the NanoGen's velvety
  material feel and hot-swappable 4D armrest cushion system provide a more
  luxurious daily experience.
