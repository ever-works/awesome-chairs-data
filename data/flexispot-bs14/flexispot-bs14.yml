name: FlexiSpot BS14
description: A cost-friendly ergonomic chair featuring adjustable lumbar
  support, breathable mesh back, height and angle adjustable armrests, pneumatic
  seat height adjustment, and a 125-degree recline with tension control, backed
  by a 3-year warranty. Ideal for budget-conscious desk workers who still want
  solid ergonomic adjustability during long work sessions. Compared to the
  Steelcase Series 1's $500+ entry-level offering, the BS14 delivers mesh
  breathability, adjustable arms, and recline functionality at $160, though it
  lacks the Series 1's weight-activated tilt and refined commercial build
  quality.
