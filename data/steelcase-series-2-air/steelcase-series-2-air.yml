name: Steelcase Series 2 Air
description: The Steelcase Series 2 Air is a mesh-backed ergonomic chair
  featuring steelcase's flexible flexor-system backrest with enhanced airflow,
  adjustable lumbar support, and seat-depth slider for 6–8 hour desk sessions
  rated up to 300 lbs. Designed for corporate offices and WFH setups where
  temperature regulation is a priority during long computer sessions. Compared
  to the standard Series 2's fabric back and the Herman Miller Aeron's full
  Pellicle mesh, it provides a hybrid approach with mesh breathability and the
  Series 2's proven adjustment mechanics at roughly $600–$900.
