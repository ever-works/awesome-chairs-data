name: Herman Miller Eames Executive Chair
description: Iconic mid-century executive chair ideal for professionals in
  long-hour office or home office management roles, featuring polished aluminum
  frame, full-grain leather upholstery, 20° tilt mechanism, and ergonomic
  padding for refined support and breathability during meetings or desk work.
  Key attributes include premium craftsmanship, subtle adjustments, and durable
  construction up to 300 lbs for enduring comfort. Unlike gaming chairs' bold
  reclines or casual seats' basic padding, it prioritizes timeless professional
  elegance and sculptural sophistication.
