name: Herman Miller Eames Executive Chair
description: An iconic mid-century executive chair by Charles and Ray Eames,
  upholstered in premium full-grain leather with a precision aluminum die-cast
  frame, 20° tilt mechanism, and ergonomic padding for comfortable meeting-room
  seating. Designed for executive offices, boardrooms, and design-conscious
  professionals who value legendary aesthetics during 1–3 hour seated sessions.
  Compared to the Steelcase Leap's highly adjustable LiveBack lumbar and the
  Herman Miller Aeron's PostureFit SL, the Eames Executive trades adjustable
  tilt tension, seat depth control, and mesh breathability for sculptural
  elegance and full-grain leather craftsmanship at a $7,898 price point.
