markdown: >-
  ## Secretlab TITAN Evo Lite


  ![Secretlab Logo](https://www.secretlab.co/assets/logo.png)


  ![TITAN Evo Lite](https://www.secretlab.co/assets/titan-evo-lite.jpg)


  ### Overview

  The **TITAN Evo Lite** is a high-quality ergonomic office chair designed by
  Secretlab, offering the essential features of the TITAN Evo series at a more
  budget-friendly price. Perfect for users who require ergonomic support while
  maintaining quality.


  ### Features

  - **Ergonomic Design**: Provides optimal support for prolonged sitting.

  - **High-Quality Materials**: Made with durable materials ensuring
  long-lasting use.

  - **Adjustable Components**: Customizable settings for maximum comfort.


  ### Category

  - **Ergonomic Office Chairs**


  ### Tags

  - Affordable

  - Ergonomic

