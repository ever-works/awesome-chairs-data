name: TITAN Evo Lite
description: The TITAN Evo Lite is Secretlab's streamlined gaming chair that
  delivers core ergonomic features — including 4-way lumbar support, 4D
  armrests, and a multi-tilt mechanism — at a more accessible price point than
  the full Titan Evo lineup. Ideal for budget-conscious gamers, students, and
  casual streamers who need a reliable chair for 4–6 hour sessions without
  premium add-ons like magnetic pillows or Nanofoam cushioning. It offers better
  build quality and adjustability than budget alternatives like the GTPlayer
  GTRacing or Homall S-Racer, but lacks the Nanogen Edition's ultra-soft
  materials and the XL model's big-and-tall capacity.
