name: Autonomous ErgoChair Ultra
description: An ergonomic office chair designed for larger frames up to 300 lbs,
  featuring a heavily padded seat cushion, prominent lumbar support, and
  breathable fabric back with a solid metal wheel hub for durability.
  Well-suited for big-and-tall desk workers needing reinforced construction and
  breathability during long sessions. Compared to the Herman Miller Aeron size C
  or Steelcase Leap's standard frame, it offers similar size accommodation and
  strong lumbar presence, though with fewer adjustment points and non-adjustable
  armrests.
source_url: https://www.autonomous.ai/office-chairs/ergochair-ultra
category: Ergonomic Office Chairs
