markdown: >-
  ## Overview


  The Autonomous ErgoChair Ultra is designed to comfortably accommodate larger
  frames, with testing confirming comfort for users up to 6-foot-1 and 270
  pounds. It features an extremely comfortable seat pad and noticeable lumbar
  support.


  ## Features


  - Solid metal wheel hub construction to prevent stretching and floor scraping
  over time (unlike nylon hubs found on some chairs)

  - Extremely comfortable, well-padded seat

  - Strong, palpable lumbar support

  - Breathable fabric that keeps the back cool during extended use

  - Supports users up to 300 pounds

  - Easy assembly with solid nuts and bolts


  ## Cons


  - Wheels are weak for a 300-pound-rated chair and do not glide well; may need
  upgrading to roller blade-style wheels for carpeted surfaces

  - Armrests do not twist, which can make them less comfortable compared to
  chairs with fully adjustable arms


  ## Pricing


  Mid-range pricing — positioned as a value option for its target audience.
