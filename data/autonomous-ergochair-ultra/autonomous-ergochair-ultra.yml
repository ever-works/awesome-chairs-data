name: Autonomous ErgoChair Ultra
description: "Autonomous ErgoChair Ultra is an ergonomic office chair optimized
  for 8-12 hour workdays, promoting natural posture with prominent lumbar
  support and breathable fabric back. Features include padded seat, tilt
  mechanism for big-and-tall up to 300 lbs; use cases: programming marathons,
  executive offices. Compares to Herman Miller Embody (dynamic flex) vs budget
