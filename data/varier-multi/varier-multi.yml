markdown: >-
  ## Overview


  The Varier Multi is a portable kneeling chair that strikes a balance between
  comfort, quality, and convenience. It is designed for occasional use and short
  periods of working (around 1-2 hours at a time).


  ## Features


  - Foldable and portable design for easy storage

  - Made to an exceptionally high quality standard

  - 7-year warranty

  - Promotes active sitting and proper posture during use

  - Lightweight enough to carry and store away when not needed


  ## Best Use Case


  The Multi is ideal for short sitting periods (up to 1-2 hours). For longer
  work sessions (beyond 2 hours), Varier recommends the Wing, Variable, Variable
  Plus, or Thatsit chairs instead.
