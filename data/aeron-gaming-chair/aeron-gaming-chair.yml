name: Aeron Gaming Chair
description: The Herman Miller Aeron Gaming Chair is an ergonomic mesh chair
  optimized for long gaming and work sessions, featuring Pellicle suspension for
  breathability, PostureFit SL for lumbar/spinal support, and fully adjustable
  4D arms. It supports up to 350 lbs with sizes A/B/C for petite to tall users,
  ideal for programmers and gamers needing posture correction during 12+ hour
  marathons. Compares to Secretlab Titan Evo by offering superior breathability
  and 12-year warranty vs faux leather durability.
