name: Aeron Gaming Chair
description: Iconic full-mesh gaming chair featuring breathable Pellicle mesh
  back and seat for superior airflow during long gaming or programming sessions
  in hot climates. Provides inherent flex lumbar support and adjustability for
  all-day comfort without overheating. Stands out versus fabric or leather
  chairs with exceptional ventilation and lightweight design.
