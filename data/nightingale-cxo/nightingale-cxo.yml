markdown: >-
  ## Overview


  The Nightingale CXO is a heavy-duty ergonomic office chair manufactured in
  Canada. It is the heaviest and most solid mesh chair in its class, with a
  weight capacity of 350 lbs. The chair combines mesh back support with ENERSORB
  memory foam on the seat and headrest.


  ## Features


  - ENERSORB memory foam headrest that is height adjustable with tilt
  functionality

  - Built-in coat hanger on the back of the headrest

  - ENERSORB memory foam seat cushion for a soft, sink-in feel

  - Adjustable lumbar support

  - 4-way adjustable arms

  - 350 lbs weight capacity

  - Made in Canada

  - Fully loaded with ergonomic adjustments


  ## Sizing


  The CXO with headrest does not accommodate users shorter than 5'3", as the
  headrest would push the top of the head forward rather than cradle the neck.


  ## Pricing


  Starting price: $2,395.99 + Free Shipping
