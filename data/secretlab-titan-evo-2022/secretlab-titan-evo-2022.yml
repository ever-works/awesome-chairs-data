markdown: |-
  ## Overview

  2022 Evo with advanced lumbar for pro endurance.

  ## Features

  - Four-way adjustable lumbar
  - High-resiliency foam (coldfoam equiv)
  - 4D armrests
  - 165° recline
  - Magnetic pillow support
  - Multiple sizes/materials

  ## Use Cases

  - Tournament gaming
  - Marathon streaming

  ## Comparisons

  Vs budget: 5-year warranty vs 1; no assembly issues, materials last 5x longer.

  ## Pricing

  Premium; site for variants.
