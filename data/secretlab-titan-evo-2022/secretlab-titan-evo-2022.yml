name: Secretlab Titan Evo 2022
description: "The Secretlab Titan Evo is a premium gaming chair designed for
  extended sessions, featuring a ColdCure foam seat for pressure relief, 4D
  L-ADAPT armrests for full adjustability, and a magnetic memory foam head
  pillow. Key features include magnetic lumbar support dial for customizable
  curve, swappable skins for personalization, and a multi-tilt mechanism up to
  165° recline. Ideal for gamers and office workers needing all-day comfort;
  compares favorably to DXRacer for build quality but excels in breathability
  and warranty (5 years). Use cases: esports marathons, hybrid work setups."
