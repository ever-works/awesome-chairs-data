name: Haworth Assure
description: The Haworth Assure is an entry-level ergonomic task chair with a
  breathable mesh backrest, molded synchro-tilt seat, adjustable arm height, and
  fixed lumbar contour for standard 6–8 hour desk sessions rated up to 300 lbs.
  Designed for budget-conscious corporate offices and WFH users who want
  reliable Haworth construction without premium pricing. Compared to the Herman
  Miller Aeron's advanced PostureFit SL and the Steelcase Leap's dynamic
  LiveBack, it offers simpler, fixed-support ergonomics at roughly $280–$350.
