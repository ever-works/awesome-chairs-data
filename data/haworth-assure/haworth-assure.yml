markdown: >-
  ## Haworth Assure Office Chair


  ### Features

  - **Mesh backrest** for breathability

  - **Molded conforming seat cushion**

  - **Center tension synchro-tilt** with upright back lock

  - **Height-adjustable arms**

  - **Seat height adjustment**: 3" range


  ### Specifications

  - Weight Capacity: 300 lbs

  - Overall Height: 38.75"–42.75"

  - Overall Width: 26"

  - Overall Depth: 24"

  - Seat Height: 16"–20"

  - Seat Width: 20"

  - Seat Depth: 16"–19"


  ### Pricing

  Standard: ~$350 (often available at ~$280 with promotions).


  ## Warranty & Returns

  - 5-year warranty, 30-day free returns

  - Free ground shipping


  For more details, visit [Haworth
  Assure](https://store.haworth.com/products/assure-chair).
