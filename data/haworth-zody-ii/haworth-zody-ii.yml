name: Haworth Zody II
description: The Haworth Zody II is an upgraded ergonomic task chair featuring
  adaptive suspension mesh with three ergonomic zones, patented asymmetrical
  lumbar support for independent side-to-side adjustment, and a 3-point
  synchronous tilt system. Rated for users up to 325 lbs, it is designed for 8+
  hour corporate desk sessions and sit-to-stand workflows with seated and
  perched modes. Compared to the Herman Miller Aeron's 8Z Pellicle and the
  Steelcase Leap's LiveBack, the Zody II offers comparable zone-mapped back
  support with unique pelvic stabilization and a wider 4D arm range at roughly
  $900–$1,300.
