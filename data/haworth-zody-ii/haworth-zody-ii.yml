markdown: >-
  ## Haworth Zody II


  The **Haworth Zody II** is an advanced ergonomic task chair with upgraded
  upright seating support and refined adjustability.


  ## Features

  - **3-Point Synchronous Tilt System**: Aligns with natural body pivot points

  - **Asymmetrical Lumbar Support**: Personalized comfort with independent
  left/right adjustment

  - **Pelvic Support System**: Consistent lower-back support

  - **Adaptive Suspension Mesh**: Three distinct ergonomic zones

  - **Torsional Flex Technology**: Dynamic backrest response to shifts in
  position

  - **4D Adjustable Arms**: Height, width, depth, and pivot

  - **Seat Depth Adjustment**: 16.8"–19.5" (with lumbar); 17.5"–20.2" (without)


  ## Sustainability

  - Cradle to Cradle certified; GREENGUARD Gold certified


  ## Pricing

  Approximately $900–$1,300 depending on configuration. Visit [Haworth Zody
  II](https://store.haworth.com/products/zody-ii-chair) for current pricing.
