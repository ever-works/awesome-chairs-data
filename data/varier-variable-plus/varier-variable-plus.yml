markdown: "## Overview


  The Varier Variable Plus builds on the iconic Variable Balans, one of the
  greatest kneeling chairs ever designed. It adds an integrated backrest to
  encompass three core essentials of healthy sitting: Movement, Balance, and
  Forward Tilt.


  ## Features


  - Integrated backrest that allows users to recline and rest without any knobs
  or adjustments needed

  - Promotes active sitting with built-in movement to trigger balance reflex and
  keep core muscles engaged

  - Forward-tilt design aligns the spine properly over the pelvis for good
  posture

  - No mechanical adjustments required â the chair adapts to the user's
  movements naturally

  - Ideal for intensive keyboard work, long telephone calls, and video calls

  - High-quality materials designed to last decades

  - Designed by legendary ergonomic designer Peter Opsvik


  ## Warranty


  Backed by Varier's quality standards with long-lasting construction
  materials."
