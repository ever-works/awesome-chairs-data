name: Furmax Gaming Chair High Back
description: Budget racing-style gaming chair at $80–110 with PU leather
  upholstery, removable lumbar and neck pillows, 90°–130° recline, pneumatic
  height adjustment, and a 275 lb weight capacity. Ideal for budget-conscious
  first-time buyers, teenagers setting up their first desk, and secondary gaming
  setups where low cost and basic recline are priorities. At roughly one-fifth
  the price of the Secretlab Titan Evo, it delivers essential gaming-chair
  features, though it trades the Titan's integrated lumbar, 4D armrests, and
  premium build quality for an accessible price floor.
