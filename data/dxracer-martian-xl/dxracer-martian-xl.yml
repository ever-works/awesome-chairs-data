name: DXRacer Martian XL
description: Flagship electric gaming chair with motorized positioning controls,
  remote-operated adjustments, memory position presets, and a reinforced
  AC/battery power system, supporting up to 400 lbs in an XL frame. Built for
  gamers seeking the most technologically advanced seating experience with
  automated recline and ergonomic fine-tuning. At $1,299, it significantly
  exceeds the Secretlab Titan Evo Nanogen XL in price while offering
  motorization no Herman Miller or Razer chair currently provides, though it
  requires power proximity and has a more complex setup.
