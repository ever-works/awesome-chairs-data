markdown: >-
  ## Overview


  The DXRacer Martian XL is an electrical gaming chair representing the cutting
  edge of gaming seating technology. Recently reviewed in 2026, this motorized
  chair offers automated adjustments for ultimate convenience and comfort.


  ## Features


  - **Motorized Adjustments**: Electric controls for positioning

  - **XL Size**: Extra-large design for bigger users

  - **Premium Build**: High-end materials and construction

  - **Advanced Ergonomics**: Comprehensive support system

  - **Memory Settings**: Save preferred positions

  - **Remote Control**: Easy adjustment from seated position


  ## Specifications


  - Weight Capacity: Up to 400 lbs

  - Recline Range: Motorized recline control

  - Power: AC powered with backup battery

  - Warranty: 2-year manufacturer warranty

  - Seat Dimensions: Extra-large for maximum comfort


  ## Pricing


  Starting at $1,299
