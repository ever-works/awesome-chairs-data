markdown: >-
  ## Overview


  GTRacing Rush Series provides 160°+ recline with footrest and massage for
  ultimate relax during gaming or work breaks.


  ## Features


  - Recline: 160°+

  - Footrest: Included

  - Massage: Lumbar support

  - Adjustable 4D armrests

  - High backrest

  - Real leather, aluminum base


  ## Use Cases


  - Gaming with recovery naps in executive setups

  - Prolonged desk work


  ## Comparisons


  Deep recline matches new Secretlab 2026 updates; massage feature edges out
  Noblechairs standard lines for recovery. Better durability than budget.


  ## Pricing


  Affordable premium, under $500.
