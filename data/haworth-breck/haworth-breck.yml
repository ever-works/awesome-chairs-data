name: Haworth Breck
description: The Haworth Breck is a compact ergonomic task chair optimized for
  shorter users (under 5'8") featuring a shortened seat with depth adjustment,
  4D adjustable armrests, weight-activated recline, and GeoStretch mesh back
  with 3-zone lumbar support for sessions up to 325 lbs. Built for WFH and small
  desk setups where compact footprint and tool-free assembly matter. Compared to
  the Herman Miller Aeron size A and the Steelcase Leap's standard frame, it
  offers similar space savings with more arm adjustability and a wider recline
  range at roughly $368–$419.
