name: Secretlab Titan Evo NanoGen Edition
description: The NanoGen Edition upgrades the Secretlab Titan Evo with
  ultra-soft Nanofoam Composite cushioning and a proprietary NanoGen Hybrid
  Leatherette that delivers a noticeably softer, silkier feel than standard NEO™
  leatherette — ideal for gamers and streamers prioritizing plush comfort during
  marathon sessions. It retains the same 4-way L-ADAPT™ lumbar support, 4D
  PlushCell armrests, and magnetic accessory ecosystem of the standard Titan
  Evo, but carries a $40–$60 premium. Compared to the Razer Iskur V2's adaptive
  lumbar system, it offers superior material softness and hot-swappable
  accessories, though budget-conscious buyers will find the standard Titan Evo
  delivers the best value.
