  ### Description
  The Secretlab Titan Evo NanoGen Edition is designed to offer extreme comfort, featuring a new covering that enhances the overall seating experience. However, it is priced higher than the standard model, which may provide better value for those on a budget.

  ### Features
  - **Extreme Comfort:** Designed to provide exceptional comfort for long gaming sessions.
  - **New Covering:** Equipped with a new and improved covering for enhanced durability and comfort.

  ### Pricing
  - **Direct Pricing:** Purchase directly from Secretlab to avoid up to 25% in middlemen costs.
  - **Free Shipping:** Available for a limited time on select chairs.
  - **Minimum Spend Discount:**
    - $40 off for orders over $850 with an eligible chair.
    - $50 off for orders over $1,489 with an eligible desk.
    - $100 off for orders over $1,999 sitewide.
  - **Flexible Payments:** Start with Katapult for as low as $1 (usually $45) for flexible payment options.

  ### Promotions
  - **Christmas Sale:**
    - Up to $249 off select products.
  - **Limited Time Offers:** Valid from December 5, 2025, to January 2, 2026.

