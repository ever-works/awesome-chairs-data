name: FlexiSpot C8 BS11 Pro
description: A versatile all-mesh office chair with a curved seat base,
  adjustable lumbar support through the curved back design, adjustable headrest,
  and synchronized back tilt and armrest adjustments rated for 130 kg with a
  5-year warranty. Available as the C8 in the US and the BS11 Pro in the UK.
  Ideal for desk workers seeking full mesh ventilation without bulky aesthetics.
  Compared to the Herman Miller Aeron's suspension mesh seat and PostureFit SL,
  the C8 delivers similar full-mesh breathability at a fraction of the cost,
  though without separate adjustable lumbar behind the mesh.
