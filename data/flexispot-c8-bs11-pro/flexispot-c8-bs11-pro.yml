markdown: >-
  ## Overview


  The FlexiSpot C8 BS11 Pro is a versatile all-mesh office chair with a curved
  seat base, adjustable lumbar support, adjustable headrest, and back tilt with
  armrest adjustments.


  ## Features


  - All-mesh construction for maximum breathability

  - Curved seat base design

  - Adjustable lumbar support via curved back

  - Adjustable headrest

  - Synchronized back tilt and armrest movement

  - Weight capacity: 130 kg (286 lbs)

  - 5-year warranty


  ## Pricing


  Starting at $349.99
