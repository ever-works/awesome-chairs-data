markdown: >-
  ## Overview


  The BTOD Petite Series is an affordable, highly customizable office chair
  designed for petite and small individuals. It is made in Taiwan and offers a
  wide selection of mechanisms, arms, and back options to suit individual
  preferences. An even smaller variant, the BTOD Bantam, is also available for
  those needing a more compact chair.


  ## Dimensions


  - Minimum seat height: 15.5 inches

  - Seat depth: 16 inches (adjustable with seat slider add-on)

  - Arm height range: 5 to 7.5 inches (standard two-way arms)

  - Arm width range: 16 to 20 inches


  ## Features


  - Thick 4-inch padded seat for a soft, plush sitting experience

  - Customizable options: different mechanisms, arms, back options

  - Standard two-way arm setup with optional upgrades

  - Seat slider add-on for adjustable seat depth

  - Limited lifetime warranty: lifetime coverage on chair frame and parts, five
  years on foam and fabric


  ## BTOD Bantam Variant


  An even smaller option within the Petite series. The Bantam features a smaller
  seat, smaller back, and a smaller seat height range compared to the BTOD
  Petite, designed for individuals who need a more compact chair.


  ## Pricing


  Starting at $507.99 (2026). Price increases as additional adjustment options
  are added.
