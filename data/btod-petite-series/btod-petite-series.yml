name: BTOD Petite Series
description: An ergonomic office chair designed specifically for petite users
  with a 15.5\" minimum seat height, 16\" seat depth with optional slider, and
  4\" thick padded seat, available in fully customizable configurations with a
  limited lifetime warranty. The scaled-down frame proportions and wide
  adjustment range make it ideal for shorter desk workers needing proportional
  support during long office sessions. Compared to the Herman Miller Mirra's
  compact build or the Steelcase Series 1's entry-level ergonomics, the Petite
  delivers superior seat cushioning, lifetime warranty coverage, and more
  configuration options tuned specifically for smaller frames.
