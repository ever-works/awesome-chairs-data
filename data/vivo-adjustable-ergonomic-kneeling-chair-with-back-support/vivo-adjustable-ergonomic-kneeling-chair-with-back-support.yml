  ## Features


  - **Optional Back Support**: Removable backrest for added comfort

  - **Adjustable Height**: Customizable for different desk heights

  - **Thick Padding**: Comfortable knee and seat cushions

  - **Sturdy Frame**: Metal construction for stability

  - **Wheels**: Rolling casters for easy mobility

  - **Affordable Price**: Budget-friendly kneeling chair option


  ## Specifications


  - Weight Capacity: Up to 250 lbs

  - Height Adjustment: Multiple positions

  - Frame Material: Steel

  - Cushion Material: High-density foam

  - Warranty: 3-year manufacturer warranty


