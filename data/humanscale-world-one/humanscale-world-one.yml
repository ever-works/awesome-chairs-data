name: Humanscale World One
description: The Humanscale World One is an all-mesh ergonomic task chair with a
  self-adjusting recline mechanism that calibrates to body weight,
  height-adjustable arms, and seat-height control, designed for budget-conscious
  buyers wanting the Humanscale auto-tilt experience. It accommodates users up
  to 300 lbs and is suited for daily computer work in shared offices or home
  setups. Compared to the fully adjustable Herman Miller Aeron or the Steelcase
  Leap's extensive controls, it sacrifices seat depth adjustment and recline
  fine-tuning for simplicity and a lower entry price point.
