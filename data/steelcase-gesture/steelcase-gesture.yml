name: Steelcase Gesture
description: The Steelcase Gesture is a premium ergonomic office chair built
  with 3D LiveBack technology that mirrors spinal motion and 360-degree
  armrests—the widest range on the market—enabling healthy postures across
  laptops, tablets, and phones. It accommodates a broad range of body types with
  adjustable seat depth and recline, supporting users up to 400 lbs during long
  desk sessions in corporate offices or WFH setups. Compared to the Herman
  Miller Aeron's mesh-first design, the Gesture uses a cushioned seat and
  emphasizes arm/posture flexibility over breathable mesh, earning it
  Wirecutter's "Best Office Chair" pick from 2015–2024 at a similar $1,300+
  price point.
