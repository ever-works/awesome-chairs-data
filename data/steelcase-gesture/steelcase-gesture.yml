name: Steelcase Gesture
description: Steelcase Gesture supports natural postures across devices with
  360-degree armrests, LiveBack technology mimicking spine movement, and
  adjustable seat depth for programmers switching between keyboard and tablet.
  Ideal for dynamic work vs static gaming chairs like Secretlab Titan.
source_url: https://www.steelcase.com/products/office-chairs/gesture/
