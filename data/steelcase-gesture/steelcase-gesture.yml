name: Steelcase Gesture
description: Steelcase Gesture delivers posture support for all-day sitting with
  LiveBack technology mimicking spine movement and 360-degree adjustable arms
  accommodating various postures across devices. Includes contoured backrest and
  seat depth adjustment for lumbar relief. Suited for programmers and office
  professionals; provides more nuanced adjustability than gaming chairs for
  multi-posture work.
source_url: https://www.steelcase.com/products/office-chairs/gesture/
