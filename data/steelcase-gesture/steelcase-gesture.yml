name: Steelcase Gesture
description: Steelcase Gesture adapts to multi-posture sitting with 360 arm
  movement for modern workflows across devices like laptops, tablets, and
  phones. Superior for dynamic use versus static gaming chairs, comparable to
  Herman Miller Embody. Features LiveBack technology and highly adjustable arms.
source_url: https://www.steelcase.com/products/office-chairs/gesture/
category: ergonomic-office-chairs
tags:
