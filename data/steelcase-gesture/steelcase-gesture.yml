featured: false
markdown: |-
  ## Features

  - 3D LiveBack technology that mirrors natural spine motion
  - 360-degree adjustable arms with widest range on market
  - Adjustable seat depth and recline
  - Contoured backrest for S-shape spine support
  - Supports up to 400 lbs

  ## Recognition

  Wirecutter's 'Best Office Chair' from 2015–2024.

  ## Pricing

  Starting around $1,300–$1,600 depending on configuration.
