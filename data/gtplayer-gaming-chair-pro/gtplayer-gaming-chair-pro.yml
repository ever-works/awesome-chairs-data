markdown: >-
  ## Overview


  The GTPLAYER Gaming Chair Pro is a feature-rich gaming chair with built-in
  Bluetooth speakers and massage function, offering entertainment-focused
  features alongside ergonomic support for truly immersive gaming experiences.


  ## Features


  - **Built-in Bluetooth Speakers**: Immersive audio experience

  - **Massage Function**: USB-powered lumbar massage

  - **Ergonomic Design**: Racing-style with full support

  - **Retractable Footrest**: For relaxed gaming sessions

  - **PU Leather Upholstery**: Durable and easy to clean

  - **Reclining Function**: Up to 170° recline


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 170°

  - Power: USB-powered massage

  - Warranty: 1-year manufacturer warranty

  - Bluetooth: Version 4.1


  ## Pricing


  Starting at $189.99
