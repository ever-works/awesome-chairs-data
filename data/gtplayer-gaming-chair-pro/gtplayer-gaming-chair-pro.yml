name: GTPLAYER Gaming Chair Pro
description: Feature-rich gaming chair with built-in Bluetooth speakers (v4.1),
  USB-powered lumbar massage, retractable footrest, PU leather upholstery, and
  an expansive 90°–170° recline, supporting up to 300 lbs at $190. Designed for
  gamers who want immersive audio and massage without wearing a headset during
  long sessions. It offers more built-in entertainment features than the
  Secretlab Titan Evo or Herman Miller Vantum, though it trades the Titan's
  ergonomic precision and material quality for a feature-heavy entertainment
  approach.
