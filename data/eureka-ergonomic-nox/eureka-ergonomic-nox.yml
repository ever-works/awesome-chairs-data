markdown: >-
  ## Overview


  The Eureka Ergonomic Nox Chair represents a leap in the brand's design
  language, departing from gaming-chair aesthetics to deliver a refined, modern
  executive chair. It features genuine leather upholstery and a striking
  silhouette with a well-concealed metal structure.


  ## Design & Build


  - Clean, minimalist design language

  - Silhouette-tapered lumbar support that is bold without being flashy

  - Sweeping, well-shaped armrests

  - Full-metal seat base (not molded plastic)

  - Clean metal-to-metal attachment points where the arms and seat meet the
  backrest

  - Good cable management with a hidden wire channel from the seat base


  ## Features


  - Height and angle adjustable armrests with a soft-touch top surface

  - Good build quality relative to gaming and budget ergonomic chairs

  - Seat reclines up to 135°

  - Lumbar support that feels bold but subtle in design


  ## Target Users


  - Professionals who want a modern, executive-looking chair

  - Users seeking premium genuine leather with a clean metal construction rather
  than a gaming-chair aesthetic

  - Those comfortable with a more minimalist design approach compared to
  traditional executive chairs


  ## Pricing


  Priced around $260, making it an accessible premium option compared to leather
  task chairs from traditional office brands that often exceed $700.
