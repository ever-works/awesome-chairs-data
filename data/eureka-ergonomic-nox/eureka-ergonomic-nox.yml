name: Eureka Ergonomic Nox
description: A premium genuine leather executive chair with a bold
  silhouette-tapered lumbar profile, sweeping armrests integrated into a full
  metal seat base, and well-constructed build quality. Designed for executive
  environments where professional aesthetics and durable construction are
  priorities. Compared to the Steelcase Leap Executive or Herman Miller Eames
  Executive leather offerings, the Nox provides comparable genuine leather
  craftsmanship at a lower price, though it lacks the advanced adjustability of
  its flagship counterparts.
