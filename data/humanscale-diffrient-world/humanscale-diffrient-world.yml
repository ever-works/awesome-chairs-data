name: Humanscale Diffrient World
description: An ergonomic task chair featuring Humanscale's signature
  weight-activated auto-tilt mechanism, Tri-Panel breathable mesh backrest with
  integrated lumbar, and fixed-height arms designed for hands-free ergonomic
  support. Ideal for desk workers who want premium automatic adjustability
  without manual tuning during daily use. Compared to the Herman Miller Aeron's
  adjustable PostureFit SL which requires manual dialing, the Diffrient World's
  auto-tilt provides effortless recline calibration based on body weight, though
  it sacrifices arm adjustability and seat depth control at a similar premium
  price point of ~$1,700.
source_url: https://www.humanscale.com/products/diffrient-world-office-chair
category: Ergonomic Office Chairs
