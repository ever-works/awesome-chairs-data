markdown: >-
  ## Overview


  The Diffrient World features the original Tri-Panel mesh backrest that flexes
  to provide targeted lumbar support automatically. It uses Humanscale's
  signature weight-activated auto-tilt mechanism.


  ## Features


  - Weight-activated auto-tilt mechanism — no manual adjustment needed

  - Tri-Panel mesh backrest with integrated lumbar support

  - Fixed height arms

  - Mesh seat cushion for breathability

  - Simple, elegant design

  - Pneumatic seat height adjustment


  ## Pricing


  Starting at approximately $1,700.
