markdown: >-
  ## Overview


  The Dowinx Gaming Chair with breathable fabric upholstery and massage lumbar
  support offers superior airflow compared to leather alternatives, providing
  cooler and more comfortable extended gaming sessions.


  ## Features


  - **Breathable Fabric**: Superior airflow versus PU leather

  - **Massage Lumbar Support**: USB-powered vibrating cushion

  - **Ergonomic Design**: Full body support for gaming

  - **Adjustable Components**: Armrests and recline

  - **Cooling Comfort**: Fabric prevents heat buildup

  - **Sturdy Construction**: Durable frame and base


  ## Specifications


  - Weight Capacity: Up to 350 lbs

  - Recline Range: 90° to 170°

  - Upholstery: Breathable fabric material

  - Power: USB-powered massage

  - Warranty: 1-year manufacturer warranty


  ## Pricing


  Starting at $199.99
