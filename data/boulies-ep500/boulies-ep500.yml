markdown: >-
  ## Overview


  The Boulies EP500 is designed specifically for extended work sessions,
  providing consistent support to maintain posture throughout the workday. It is
  a chiropractor-appointed model engineered based on the expert requirements of
  Boulies' in-house chiropractors.


  ## Key Features


  - **Dynamic Lumbar Support**: Adapts in real-time to your movements, shifting
  along with you to provide optimal back support at every position

  - **Foldable 5D Armrests**: Full range of adjustments including height, pad
  rotation, flip-up/fold-down functionality, and front-to-back sliding; armrests
  can be flipped up to create a spacious seating area for cross-legged sitting

  - **Adjustable Seat Depth**: Ensures proper tailbone support and promotes
  ergonomic alignment for different leg lengths

  - **Backrest tilt angles**: Adjustable at 98°, 110°, and 126°

  - **Generous 50 cm seat width** for users who find standard office chairs too
  narrow

  - **Integrated footrest** to support legs during recline and break periods

  - **Mesh version available** recommended for users who perspire easily


  ## Best For


  - Individuals who sit for long periods and tend to shift positions frequently
  (sitting cross-legged, reclining)

  - A wide variety of work activities including sewing, typing, reading, and
  taking short breaks

  - Users of average to tall stature (165–190 cm)

  - Those who want dynamic lumbar support and 5D armrests — features typically
  found only on premium chairs over $1,000 from brands like Steelcase or Herman
  Miller
