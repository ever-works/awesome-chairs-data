name: Boulies EP500
description: Boulies EP500 supports long-hour sitting with ergonomic design
  featuring chiropractor-designed dynamic lumbar support that adapts in
  real-time, breathable mesh back, foldable 5D armrests, adjustable seat depth,
  and integrated footrest. Key features include multi-angle recline and wide
  seat for comfort during programming, office work, or gaming sessions. Compared
  to Herman Miller Aeron, it is more affordable with dynamic lumbar and
  extensive arm adjustments but less premium suspension; vs. Secretlab chairs,
  it provides better posture support and breathability for professional use.
