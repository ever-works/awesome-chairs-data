name: Lamia Chair
description: A sleek mid-back ergonomic office chair with a mesh backrest,
  adjustable armrests (height and angle), synchro-tilt mechanism, and pneumatic
  height adjustment. Designed for compact workspaces and WFH users who want
  breathable mesh support with a minimalist footprint during daily desk
  sessions. Compared to the Staples Hyken's larger mesh design and adjustable
  headrest, the Lamia offers similar mesh breathability in a more compact
  profile, though it lacks the Hyken's headrest and the Steelcase Leap's
  advanced lumbar adjustability.
