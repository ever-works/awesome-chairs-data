name: Hinomi H2 Pro
description: Highly adjustable mesh gaming chair with 19 adjustment points
  including seat depth, rock tension, 5-point lumbar, 4-point headrest, and 6D
  fold-away armrests, supporting up to 330 lbs with 136° tilt and a foldable
  backrest design that tucks under desks. Ideal for gamers and office workers in
  compact spaces who need deep ergonomic customization comparable to premium
  Steelcase Gesture-level adjustability. At its competitive price point, it
  rivals the Herman Miller Vantum's ergonomic depth with more adjustment points,
  though it lacks the Vantum's 12-year warranty and uses a less refined mesh.
