markdown: >-
  ## Overview


  The Oak Hollow Aloria Series is a mesh-back office chair designed with taller
  users in mind. It offers impressive airflow, sturdy construction, and
  dual-side controls for quick adjustments. Available in Standard and Tall seat
  height options.


  ## Features


  - Tall, well-ventilated mesh back for maximum airflow

  - Controls on both left and right sides of the seat for easy adjustment

  - Available in Standard and Tall seat height options

  - Optional longer seat stem available for users taller than 6-foot-1

  - Incredibly sturdy and solid construction

  - Adjustable seat height

  - Simple and straightforward setup


  ## Height Considerations


  Even the Standard seat height option sits high enough that users around 6 feet
  tall may find their feet leave the ground when leaning back beyond the first
  recline position. Tall users will benefit most from this chair's proportions.


  ## Pricing


  Competitively priced for the level of build quality and adjustability offered.


  ## Design


  The chair is heavy due to its solid construction, making it difficult to move
  around. It should be assembled in the room where it will be used. The
  substantial weight comes from quality materials rather than hollow components.
