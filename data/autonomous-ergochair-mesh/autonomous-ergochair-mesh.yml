name: Autonomous ErgoChair Mesh
description: A mid-range ergonomic chair with a fully breathable mesh seat and
  backrest, 9 adjustment points including adjustable lumbar support and
  synchro-tilt mechanism, and seat depth adjustment from 19" to 21.5". Designed
  for WFH and corporate desk workers who want premium ergonomic features at an
  accessible price. Compared to the Herman Miller Aeron's advanced PostureFit SL
  and the Steelcase Gesture's LiveBack, it offers similar mesh breathability and
  multiple adjustments at roughly a third of flagship pricing.
