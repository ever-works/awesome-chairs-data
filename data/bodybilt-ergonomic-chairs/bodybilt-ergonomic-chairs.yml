markdown: >-
  ## Overview


  BodyBilt offers a collection of ergonomic chairs designed to enhance comfort
  and provide optimal support for long durations of sitting.


  ## Use Cases


  - Versatile for mixed use in office, gaming, healthcare, and industrial
  environments.

  - Customizable for petite to big & tall users.


  ## Features


  - Tailor-made adjustability for posture-perfect seating.

  - Premium foam, diverse lumbar options, contoured seating.

  - Comprehensive adjustability including Optima arms.

  - Models: Enduri, Ergetta, Aircelli, Sci, Supretti, Sola.


  ## Comparisons


  - More customizable than standard ergonomic chairs, suitable for specialized
  needs like industrial or gaming.


  ## Pricing


  Contact BodyBilt for pricing on custom configurations.
