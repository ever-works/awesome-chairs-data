markdown: >-
  ## Overview


  The Von Racer Gaming Chair is one of the most affordable pink gaming chairs
  available, typically priced around $129. It features a full pink PU leather
  design with white accents around the sides.


  ## Features


  - Full pink PU leather construction with white accents

  - Extendable, foldable padded footrest

  - USB electric massage pillow (lumbar)

  - 135° maximum recline angle

  - Racer-back ergonomic design

  - Ergonomic form factor with comfortable cushioning


  ## Dimensions


  - Seat depth: 18.9\" 

  - Seat width: 18.1\"

  - Height: 48.8\" - 52\"

  - Max weight capacity: 250 lbs


  ## Pricing


  Typically available for around $129, making it one of the cheapest pink gaming
  chairs with extra features.
