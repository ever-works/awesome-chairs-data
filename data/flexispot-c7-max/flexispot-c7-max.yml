name: FlexiSpot C7 Max
description: The top-of-the-line C7 variant featuring a thick foam seat with
  lumbar curve, adjustable backrest height, 3D armrests, versatile headrest, and
  advanced adjustable lumbar system rated at up to 300 lbs, backed by a 5-year
  warranty. Designed for professionals demanding full-range adjustability and
  premium cushioning during long desk sessions. Compared to the Steelcase
  Gesture's seat depth slider and 4D arms, the C7 Max offers comparable
  adjustability with a thicker foam seat and adjustable lumbar at $550, though
  without the Gesture's weight-activated tilt mechanism.
