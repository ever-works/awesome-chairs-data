name: Sihoo S300
description: The Sihoo S300 is a budget-friendly ergonomic office chair with a
  breathable mesh back, adjustable lumbar support, and tilting backrest for
  standard 6–8 hour desk sessions rated up to 275 lbs. Designed for WFH and
  student setups where basic posture support is needed at entry-level pricing.
  Compared to the Herman Miller Aeron's advanced PostureFit and the Steelcase
  Leap's 4D armrests, it provides only basic tilt, height, and lumbar
  adjustments without armrest depth or seat depth control at roughly $150–$200.
