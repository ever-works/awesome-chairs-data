markdown: >-
  ## Sihoo S300


  ### Overview

  The **Sihoo S300** is an entry-level ergonomic office chair designed for
  budget-conscious users who need basic posture support.


  ### Features

  - **Mesh backrest**: Breathable design for airflow

  - **Adjustable lumbar support**: Basic lower-back alignment

  - **Tilting backrest**: Standard tilt for relaxed postures

  - **Height-adjustable seat**: Standard pneumatic lift


  ### Specifications

  - Weight Capacity: 275 lbs

  - Warranty: 3-Year Warranty


  ### Pricing

  Approximately $150–$200. Visit [Sihoo
  S300](https://sihoooffice.com/products/s300) for current pricing.
