name: Asus ROG Destrier Core
description: Tailored for gamers in extended sessions up to 10 hours, the Asus
  ROG Destrier Core features breathable mesh suspension for back and seat,
  adjustable height, tilt, armrests, and lumbar cushion to promote airflow and
  posture support in warm conditions. Despite minor armrest stability notes, it
  delivers solid value for daily use. Ideal for casual esports players and
  beginner streamers; outperforms PU leather budget racing chairs like Dowinx in
  cooling but trails premium Asus ROG Destrier in armrest firmness.
