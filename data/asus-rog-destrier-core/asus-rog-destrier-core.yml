name: Asus ROG Destrier Core
description: The Asus ROG Destrier Core accommodates up to 10 hours of gaming or
  desk work with breathable mesh suspension on back and seat, adjustable
  height/tilt/armrests/lumbar cushion for airflow and spinal health in heated
  setups. Though armrests may wobble slightly, it holds up well. For entry
  esports and streaming beginners, it tops PU budget racers like Dowinx in
  cooling yet lags premium Asus models or Herman Miller in armrest solidity.
