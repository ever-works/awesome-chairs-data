name: AndaSeat Kaiser 3 XL Gaming Chair
description: Engineered for bigger gamers during extended play sessions, the
  Kaiser 3 XL supports up to 395 lbs and 6'8" tall users with a spacious design,
  dynamic adjustable lumbar support, 4D armrests, thick memory foam cushioning,
  and a 165° recline backed by a sturdy steel frame. Key features encompass
  premium PU or fabric upholstery, smooth-rolling casters, and comprehensive
  adjustability for personalized fit. Suited for heavy-set esports players and
  long-haul streamers, it exceeds Secretlab Titan Evo in weight rating and
  recline range at a lower cost, although it trails Herman Miller Vantum in
  subtle office aesthetics.
