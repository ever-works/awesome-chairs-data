name: AndaSeat Kaiser 3 XL Gaming Chair
description: Oversized ergonomic gaming chair supporting up to 395 lbs and users
  up to 6'8", featuring integrated adjustable lumbar support, premium
  cushioning, 4D armrests, 165° recline, and a robust steel chassis. Ideal for
  larger gamers and streamers who need heavy-duty construction with full
  adjustability. Compared to the Secretlab Titan Evo, it offers a higher weight
  capacity and more aggressive recline at a lower price, though its finish lacks
  the office-chic refinement of Herman Miller.
