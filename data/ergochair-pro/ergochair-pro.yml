markdown: >-
  ## Overview


  The ErgoChair Pro is Autonomous's mid-range ergonomic office chair featuring a
  mesh backrest with an adjustable headrest.


  ## Headrest Assessment


  - **Tier Rank:** C+ (average across reviewers)

  - **Adjustment:** Height and pivot adjustment with decent range

  - **Comfort Issues:** The mesh material can feel abrasive on the neck; some
  users report it pulls hair

  - **Positive Aspects:** Generous size, firm but comfortable fit, allows
  natural head movement


  ## Features


  - Mesh backrest construction

  - Adjustable headrest with height and pivot adjustment

  - 3D armrests

  - Seat depth slider

  - Lumbar cushion with dual tension settings


  ## Pricing


  Retail price: $499. 30-day return window, 2-year warranty.


  Check [Autonomous](https://www.autonomous.ai/office-chairs/ergonomic-chair)
  for current promotions.
