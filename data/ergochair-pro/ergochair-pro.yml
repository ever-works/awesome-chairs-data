name: ErgoChair Pro
description: The Autonomous ErgoChair Pro is a mid-range ergonomic office chair
  featuring a breathable mesh backrest with adjustable headrest, 3D armrests,
  seat-depth slider, and lumbar cushion with dual tension settings for users up
  to 350 lbs and up to 6'5" tall. Designed for WFH and corporate desk workers
  who want extensive adjustment points without premium pricing. Compared to the
  Herman Miller Aeron's mesh breathability and the Steelcase Leap's LiveBack,
  the ErgoChair Pro offers similar adjustability at roughly half the price
  (~$499), though plastic build components and non-locking armrest tops trade
  off long-term durability.
