markdown: >-
  ## Sihoo M59AS Ergonomic Chair


  ### Overview

  The Sihoo M59AS is an ergonomic office chair combining budget pricing with
  useful features like flip-up armrests and a coat hanger.


  ### Features

  - **Dual-section backrest**: Adapts to the spine's natural S-curve

  - **Dynamic lumbar support**: Automatic lower-back tracking

  - **3D flip-up armrests**: Height, depth, and angle adjustment with
  space-saving flip-up

  - **Dual-jointed headrest**: Height and rotation adjustment

  - **Saddle-shaped seat cushion**: Even pressure distribution across hips and
  thighs

  - **Breathable mesh**: Airflow for extended sessions

  - **126° recline**: Multiple lock positions for relaxation breaks

  - **Integrated coat hanger**: Built-in rear hook for convenience


  ### Specifications

  - Weight Capacity: 300 lbs

  - Warranty: 3-Year Warranty

  - 30-Day Free Returns


  ### Pricing

  Sale Price: $239.99 (Regular: $449.99)


  For more details, visit [Sihoo
  M59AS](https://sihoooffice.com/products/sihoo-m59as-ergonomic-office-chair).
