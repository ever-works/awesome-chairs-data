name: Sihoo M59AS Ergonomic Chair
description: The Sihoo M59AS is a budget-friendly ergonomic office chair
  featuring a dual-section backrest with dynamic lumbar support, 3D flip-up
  armrests, and a dual-jointed headrest for adjustable neck support during 6–8
  hour desk sessions rated up to 300 lbs. Its breathable mesh design and 126°
  recline with integrated coat hanger make it a practical choice for WFH and
  student setups. Compared to the Steelcase Leap's premium build and the Herman
  Miller Aeron's mesh sophistication, it offers basic ergonomic features at
  roughly $240 with more plastic construction but useful conveniences like
  armrest flip-up storage.
