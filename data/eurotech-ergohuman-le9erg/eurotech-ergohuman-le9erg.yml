markdown: >-
  ## Overview


  The Eurotech Ergohuman LE9ERG is an ergonomic office chair offered in multiple
  upholstery configurations: full mesh, leather and mesh combination, or
  all-leather. It is widely available through office chair retailers and
  features robust lumbar support paired with an adjustable headrest.


  ## Headrest Assessment


  - **Tier Rank:** C- (average across reviewers)

  - **Adjustment:** Height adjustable with pivot; easier to adjust than some
  competitors but less solid

  - **Comfort Issues:**
    - The headrest is considered too aggressive, especially in the leather version, constantly pushing the head forward
    - Tends to slide down during use, particularly when reclining, requiring frequent readjustment
    - Leather version feels warm and can cause discomfort during extended use
    - The aggressive lumbar support combined with the aggressive headrest makes it difficult to find a comfortable position
  - **Reviewer Consensus:** Most reviewers rated it C- to D-tier, noting it
  works better than many lower-ranked options but falls short of being genuinely
  comfortable or recommended


  ## Features


  - Multiple upholstery options: mesh, leather-mesh combo, and all-leather

  - Aggressive lumbar support design that pushes the lower back forward

  - Adjustable headrest with height and pivot adjustment

  - Designed to pitch the head forward for monitor focus during tasking


  ## Pricing


  Pricing varies by retailer and upholstery option. Check the Eurotech website
  or authorized dealers for current pricing.
