name: Aeris Swopper
description: An active-sitting stool with 3D spring-driven movement that
  promotes dynamic posture through side-to-side, forward-backward, and vertical
  bouncing, strengthening core and back muscles over time. Its seat height is
  fully adjustable and the 360-degree swivel allows easy repositioning, making
  it ideal for sit-stand desk users who want to alternate between sitting and
  standing. Unlike the static support of the Herman Miller Aeron or Steelcase
  Leap, the Swopper's backrest-free design demands continuous muscular
  engagement, trading passive comfort for active muscular conditioning.
