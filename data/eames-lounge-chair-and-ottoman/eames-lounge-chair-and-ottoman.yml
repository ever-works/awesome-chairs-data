  ## Overview

  The Eames Lounge Chair and Ottoman is an iconic Herman Miller lounge chair set designed for luxurious comfort and support. While not a traditional task or office chair, it is frequently used for relaxed computer work and general lounging in home offices and living areas.

  ---

  ## Features

  - **Iconic lounge chair + ottoman set** designed by Eames and produced by Herman Miller.
  - **Suited for relaxed computer use** in home offices rather than formal desk-bound work.
  - **Comfort-focused design** for lounging and extended sitting in living spaces.
  - **Real leather upholstery** (tagged as `real-leather`), emphasizing premium material quality.
  - **Luxurious seating experience**, indicated by tags like `luxury` and `comfortable`.
  - **Coordinating ottoman** to support legs and feet for full-body lounging.
  - **Brand authenticity** as an official Herman Miller product.

