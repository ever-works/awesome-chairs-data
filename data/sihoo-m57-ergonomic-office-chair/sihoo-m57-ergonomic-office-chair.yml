name: Sihoo M57 Ergonomic Office Chair
description: The Sihoo M57 is a budget-friendly ergonomic office chair featuring
  a full mesh back and seat cushion with adjustable lumbar support and 3D
  armrests for standard 6–8 hour desk sessions rated up to 300 lbs. Designed for
  cost-conscious WFH and home office users who need basic ergonomic support
  without premium pricing. Compared to the Steelcase Leap's dynamic LiveBack and
  the Herman Miller Aeron's PostureFit SL, it provides simpler mesh-based
  support with fewer adjustment points at roughly $200–$300.
