markdown: >-
  ## Overview


  The Concept Seating 3152HR is a bestselling 24-hour rated office chair
  manufactured in Wisconsin, combining durability with extensive ergonomic
  adjustability. It features a unique seven-leg base for enhanced stability and
  movement.


  ## Key Specifications


  - **Weight Capacity:** 550 lbs.

  - **Seat Width:** 23" wide

  - **Arms Width Adjustment:** 5" total (2.5" per side)

  - **Starting Price:** ~$2,159.38


  ## Features


  - Unique seven-leg base for easier movement and better stability than standard
  five-leg designs

  - Seat height and seat depth adjustment

  - Five-position tilt lock

  - Adjustable height backrest

  - Inflatable lumbar support

  - Fully articulating headrest (can function as neck roll, headrest, or rotate
  away completely)

  - Swing away T-arms option available

  - Dymetrol suspension seat for long-period support

  - Made in Wisconsin


  ## Best For


  Users seeking a durable 24-hour rated chair with extensive ergonomic
  adjustments. Ideal for shift workers, control rooms, and environments where
  chairs see continuous use.


  ## Considerations


  - The 23" wide seat pan, combined with the Dymetrol suspension, may feel
  narrower than advertised

  - Aesthetics are utilitarian rather than sleek

  - Users under 5'6" may benefit from the optional partial foot ring (additional
  $114.84) for proper foot support
