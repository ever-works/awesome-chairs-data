name: Concept Seating 3152HR
description: A 24-hour-rated heavy-duty office chair manufactured in Wisconsin
  with a 550 lb weight capacity, unique seven-leg base, Dymetrol suspension
  seat, adjustable seat depth, five-position tilt lock, adjustable backrest
  height, inflatable lumbar support, and fully articulating headrest. Built for
  control rooms, shift work, and continuous-use environments demanding
  exceptional durability. Compared to the Steelcase Leap's 400 lb rating and the
  Herman Miller Aeron's 350 lb capacity, the 3152HR offers significantly higher
  weight tolerance and a seven-leg stability system at $2,159.
