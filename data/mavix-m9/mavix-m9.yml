name: Mavix M9
description: Premium hybrid gaming-office chair for ultra-long sits, the Mavix
  M9 integrates cooling gel-infused foam, dynamic lumbar support, and extensive
  adjustments to ensure comfort and cooling during 14+ hour marathons. Features
  22-inch wide seat, 127° recline, 4-way arms, adjustable headrest/back height,
  and M-Breeze fabric. 2026 model as value pick, blending Mavix ergonomics with
  gaming style better than pure gamers like Noblechairs.
