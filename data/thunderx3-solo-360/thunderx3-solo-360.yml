markdown: >-
  ## Overview


  The ThunderX3 Solo 360 is a budget-friendly gaming chair praised for its
  well-rounded performance, combining comfort, adjustability, and a subtle
  design.


  ## Specifications


  - Seat type: Task chair

  - Weight capacity: 136 kg (300 lbs)

  - Warranty: 1 year


  ## Features


  - 360-degree adjustable armrests (3D x 360)

  - Synchronous tilt for recline with seat adjustment

  - Adjustable headrest (up/down)

  - Firm foam cushioning with breathable materials: multi-layer fabric (Loft
  Air), mesh, or leatherette

  - Generous recline with lockable positions

  - Easy assembly for one person


  ## Pricing


  Positioned as a very affordable option in the budget category.
