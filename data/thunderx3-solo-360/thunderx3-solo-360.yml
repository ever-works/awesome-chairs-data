name: ThunderX3 Solo 360
description: The ThunderX3 Solo 360 is a versatile gaming chair designed for
  extended gaming or work sessions, featuring 4D armrests with 360-degree
  rotation, adjustable lumbar support, and a swivel base for full mobility. It
  provides superior recline compared to budget racing chairs like GTRacing and
  is more affordable than premium options such as Secretlab, making it ideal for
  users seeking dynamic positioning and comfort. Key features include
  high-density foam padding, breathable PU leather upholstery, and 135-degree
  recline capability.
