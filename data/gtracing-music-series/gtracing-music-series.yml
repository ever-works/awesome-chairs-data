markdown: >-
  ## Overview


  Budget gaming chair with music series features including built-in speakers and
  a retractable footrest.


  ## Features


  - Large memory foam lumbar pillow (raise/lower)

  - 2D armrests: swivel, up/down

  - Measured recline: 155°

  - Footrest: yes

  - Manufacturer weight limit: 150 kg | 330 lbs

  - Fabric: Faux leather

  - Comfortable for 5.0 hours


  ## Pricing


  Approximately $180 list price.
