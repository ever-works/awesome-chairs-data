name: GTRacing Music Series
description: The GTRacing Music Series gaming chair integrates Bluetooth
  speakers with vibration motors for audio immersion, complemented by a padded
  headrest and lumbar pillow for comfort in long gaming marathons. As a
  budget-friendly option for music-loving gamers, it is cheaper than wired
  alternatives but offers less durability than premium leather DXRacer chairs.
  Features include 160-degree recline, built-in speakers, and vibration
  feedback.
