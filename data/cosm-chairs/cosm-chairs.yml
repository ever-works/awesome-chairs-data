markdown: >-
  ## Overview


  Cosm employs smart flex-frame and auto-tilt tech for movement-responsive
  support.


  ## Smart Features


  - Auto-adjusting tilt to body shifts

  - Flexible frame simulates spine auto-adaptation

  - Sensor-free continuous rebalance


  ## Use Cases


  - Long-hour coding with hands-free posture maintenance

  - Dynamic office workflows


  ## Vs Manual Chairs


  Passive adaptation vs active lever adjustments.


  ## Pricing


  Available via Herman Miller store; starts around $1,000+.
