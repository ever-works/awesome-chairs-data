name: Cosm Chairs
description: Herman Miller's Cosm chairs feature auto-adjusting tilt and
  flexible spine-like frame with sensors for continuous, hands-free support.
  Perfect for programmers needing adaptive posture during extended coding
  marathons, contrasting manual chairs by responding to micro-movements without
  levers. Available in low/mid/high-back variants for varied ergonomics.
