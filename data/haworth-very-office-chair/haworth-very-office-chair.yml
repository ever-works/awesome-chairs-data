markdown: >-
  ## Haworth Very Office Chair


  ### Overview

  The **Haworth Very Office Chair** is an ergonomic task chair designed for
  active, dynamic sitting in modern work environments.


  ### Features

  - **Responsive flex back**: Integrated lumbar support that follows body
  movement

  - **Breathable mesh construction**: Temperature regulation for all-day comfort

  - **Adjustable headrest**: Height and angle for neck support

  - **Synchronized tilt mechanism**: Multiple lock positions for recline control

  - **Adjustable arms**: Height and width control


  ### Specifications

  - Weight Capacity: 300 lbs

  - Warranty: Haworth standard warranty


  ### Pricing

  Approximately $250–$350. Visit [Haworth
  Very](https://store.haworth.com/products/very-office-chair) for current
  pricing.
