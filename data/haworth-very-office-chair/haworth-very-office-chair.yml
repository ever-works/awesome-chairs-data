name: Haworth Very Office Chair
description: The Haworth Very Office Chair is a dynamic ergonomic chair
  featuring a responsive flex-back with integrated lumbar support, breathable
  mesh construction, adjustable headrest, and synchronized tilt mechanism with
  multiple lock positions for users up to 300 lbs. Designed for agile,
  high-traffic workplace environments and WFH setups where active,
  repositioning-friendly seating is needed during 8+ hour desk sessions.
  Compared to the Steelcase Leap's LiveBack flex and the Herman Miller Aeron's
  PostureFit SL, the Very achieves similar dynamic movement and temperature
  regulation at a competitive $250–$350 price point.
