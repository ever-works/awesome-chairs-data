name: Knoll Generation Task Chair
description: A dynamic ergonomic task chair featuring Knoll's responsive flex
  back that bends and pivots with posture changes, adjustable seat depth,
  height-adjustable arms, and a synchro-tilt mechanism with multiple recline
  lock positions. Designed for agile office environments where users frequently
  shift postures during collaborative and focused work. Compared to the
  Steelcase Leap's LiveBack flex which moves in multiple planes, the
  Generation's back panel achieves similar dynamic adaptation at a competitive
  mid-range price, though with simpler arm adjustability.
