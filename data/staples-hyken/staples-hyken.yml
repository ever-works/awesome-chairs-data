name: Staples Hyken
description: Budget-friendly ergonomic task chair at approximately $140–200
  featuring fully breathable mesh back and mesh seat, pneumatic height
  adjustment, tilt with lock, integrated lumbar support, and a headrest,
  supporting up to 250 lbs. Ideal for budget-conscious first-time remote
  workers, students, and secondary desk setups where mesh ventilation at the
  lowest ergonomic price matters. While it undercuts the Steelcase Series 1 by
  roughly $300 and offers full mesh construction, it lacks the Series 1's
  four-way arm adjustability, seat depth slider, and commercial-grade durability
  for heavy daily use.
