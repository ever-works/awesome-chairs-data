markdown: >-
  ## Headrest Review


  The Clatina Mellet headrest is a ~$40 add-on that punches well above its price
  point in terms of quality and comfort.


  ## Headrest Features


  - **Good value**: Approximately $40 for the headrest, offering strong
  performance for the price

  - **Solid build quality**: Feels well-built with substantial weight

  - **Good cushioning**: Comfortable padding without hard edges

  - **Decent range of adjustability**: Easy-to-use adjustments, surprising for a
  chair at this price

  - **Versatile use**: Can be used for tasking or moved out of the way

  - **Stays in position**: Holds adjustments without unwanted movement or
  snapping into different positions

  - **Consistent with chair quality**: Some reviewers noted the headrest may be
  better than the chair itself


  ## Expert Ratings


  - Consensus: **B-Tier** (some reviewers rated it A-Tier)

  - Described as one of the more comfortable headrests used across all price
  ranges

  - Notable for offering A-tier comfort at a budget price point
