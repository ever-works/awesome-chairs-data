name: Clatina Mellet
description: A budget-friendly mesh-back ergonomic office chair best known for
  its highly rated optional add-on headrest (~$40) that delivers A-tier comfort
  with solid padding, good adjustability, and position retention. Designed for
  cost-conscious WFH users who want mesh breathability, basic lumbar support,
  and an excellent headrest for long desk sessions. Compared to the Staples
  Hyken's built-in headrest, the Mellet's optional headrest matches or exceeds
  its comfort at roughly half the price of comparable mid-range chairs.
source_url: https://www.clatina.com
