name: AmazonBasics Office Desk Chair
description: An economical choice for coders and remote staff handling 10+ hours
  of sitting, this chair reinforces posture through curved lumbar design,
  airflow-promoting mesh back, and basic recline with height adjustment. It
  incorporates smooth dual-wheel casters and reliable construction for everyday
  demands. Gaming chairs may dazzle visually but lag in this model's focused
  breathability and ergonomic essentials at a fraction of the cost.
