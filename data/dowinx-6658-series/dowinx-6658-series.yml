name: Dowinx 6658 Series
description: Compact gaming chair designed for smaller frames with adjustable
  armrests, seat height, breathable cloth fabric upholstery, pocket spring
  cushioning, USB-powered massage lumbar support, and a retractable footrest,
  supporting up to 290 lbs with 90°–135° recline. Ideal for petite gamers and
  users who find most racing chairs too wide or deep. Compared to the Secretlab
  Titan Evo Small, it offers a lower price point with unique pocket spring
  technology and massage, but lacks the Titan's integrated lumbar system and
  premium build quality.
