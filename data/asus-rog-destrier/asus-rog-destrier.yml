name: Asus ROG Destrier
description: Premium choice for gamers in marathon sessions over 12 hours, the
  Asus ROG Destrier provides high-tension mesh suspension for breathable seat
  and backrest, adjustable lumbar support, 3D rotating armrests, 135° lockable
  recline, tilt controls, and optional acoustic panel, supporting up to 330 lbs
  with aluminum frame. Key for immersive comfort in hot setups. Suited for
  competitive esports and streamers; equals Herman Miller Vantum in airflow but
  adds gaming aesthetics, with armrests less stable than DXRacer Tank series.
