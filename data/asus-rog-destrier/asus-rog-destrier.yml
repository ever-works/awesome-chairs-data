name: Asus ROG Destrier
description: Premium mesh gaming chair supporting up to 330 lbs, featuring
  high-tension mesh seat and backrest, 3D rotating armrests, adjustable lumbar
  support, 135° recline with lockable positions, and an optional acoustic panel
  for noise reduction. Designed for competitive gamers and streamers who
  prioritize breathability during marathon sessions at a desk. While its mesh
  suspension rivals the breathability of the Herman Miller Vantum and Herman
  Miller X Logitech G Vantum, its wobbly armrests and premium price make it less
  versatile for office environments.
