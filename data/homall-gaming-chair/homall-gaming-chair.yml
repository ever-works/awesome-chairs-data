name: Homall Gaming Chair
description: Budget racing-style gaming chair at $130–150 with PU leather
  upholstery, high-density foam cushioning, removable lumbar and neck pillows,
  height-adjustable armrests, and a 160° recline, supporting up to 300 lbs.
  Designed for budget-conscious first-time buyers, students setting up their
  initial gaming/office desk, and secondary desk setups where gaming aesthetics
  matter at a low cost. Comparable to the BestOffice gaming chair at a slightly
  higher price with better adjustability, it still lacks the integrated lumbar,
  4D armrests, and build refinement of the Secretlab Titan Evo or Herman Miller
  Vantum.
