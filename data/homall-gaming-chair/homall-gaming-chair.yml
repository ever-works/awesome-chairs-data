markdown: >-
  ## Overview


  The Homall Gaming Chair combines racing-style aesthetics with essential
  comfort features at a budget price, suitable for gamers and desk workers.


  ## Features


  - Racing-style design with PU leather

  - High-density foam padding for seat and backrest

  - Basic removable lumbar and neck pillows

  - 160° reclining backrest

  - Adjustable height and padded armrests


  ## Pricing


  Starting at approximately $139.99
