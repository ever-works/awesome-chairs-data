markdown: >-
  ## Overview


  The Sihoo M59AS is designed for households that value practicality, smart
  design, and reliable comfort. This chair focuses on adaptability and daily
  usability rather than overwhelming complexity, making it perfect for everyday
  home office use.


  ## Features


  - **Practical Ergonomic Design**: Essential ergonomic features without
  unnecessary complexity

  - **Adjustable Lumbar Support**: Simple yet effective lower back support

  - **Breathable Mesh Back**: Promotes airflow for comfort during work sessions

  - **Adjustable Armrests**: Height-adjustable arms for personalized comfort

  - **Smooth Tilt Function**: Easy recline with tilt tension adjustment

  - **Durable Construction**: Built for daily home office use


  ## Specifications


  - Weight Capacity: Up to 275 lbs

  - Recline Range: 90° to 120°

  - Seat Height Range: 18\" to 21.5\" 

  - Warranty: 2-year manufacturer warranty


  ## Pricing


  Starting at $179.99
