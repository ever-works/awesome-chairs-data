markdown: >-
  ## Overview


  The GTPLAYER Gaming Chair (under ~£150) features a quilted PU cover with a
  slim pocket-sprung layer above a high-density foam base — an unusual comfort
  feature for its price segment. Its black-and-white 'cow spot' inspired design
  and PVC finish make it both stylish and wear-resistant.


  ## Features


  - **Seat Construction**: Quilted PU cover with breathable fabric,
  pocket-sprung layer, and high-density foam base

  - **Material**: PVC finish (extremely resistant to wear and tear instead of
  standard PU leather), metal frame, foam padding

  - **Lumbar Support**: Removable lumbar cushion

  - **Headrest**: Removable headrest pillow

  - **Armrests**: Fixed armrests (linked to backrest, move when reclining)

  - **Recline**: 90° to 145° tilt with rocking function

  - **Footrest**: Retractable slide-out footrest

  - **Seat Height**: Adjustable, height range 125–135 cm overall


  ## Specifications


  | Specification | Detail |

  |---|---|

  | Weight | 18.6 kg |

  | Maximum Load | 150 kg |

  | Seat Width | 50 cm |

  | Seat Depth | 40.6 cm |

  | Backrest Height | 83 cm |

  | Backrest Width | 54 cm |

  | Casters | Nylon smooth-rolling |


  ## Pricing


  Approximately $84.99 (£84.99). Note that some users found the seat a bit small
  for larger adults, so measuring before purchase is recommended.
