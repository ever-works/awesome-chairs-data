name: GTPLAYER Gaming Chair With Pocket-Sprung Seat
description: Budget gaming chair under $85 featuring a quilted PU cover with a
  pocket-sprung layer over high-density foam—a rare comfort feature at this
  price—PVC wear-resistant finish, retractable footrest, removable lumbar
  cushions, fixed armrests, and 145° recline with 150 kg (330 lb) capacity.
  Ideal for gamers seeking maximum comfort per dollar with an unusual
  spring-cushion design. While its fixed armrests and smaller seat dimensions
  fall short of the Secretlab Titan Evo's 4D armrests and spacious ergonomics,
  it delivers more comfort variety than most sub-$100 chairs.
