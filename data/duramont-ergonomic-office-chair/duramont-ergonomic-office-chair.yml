name: Duramont Ergonomic Office Chair
description: A budget ergonomic chair featuring 4D adjustable lumbar support
  (up, down, in, out), 0.5" of lumbar depth travel, a thick memory foam seat,
  breathable mesh back, optional rollerblade wheels, and an integrated headrest
  backed by a 5-year warranty. Suitable for cost-conscious WFH users needing
  solid lumbar adjustability with memory foam cushioning. Compared to the Herman
  Miller Aeron's PostureFit suspension seat, the Duramont's memory foam offers
  plush comfort rather than mesh suspension, with comparable lumbar
  adjustability at under $200.
source_url: https://www.duramont.com/
