markdown: >-
  ## Overview


  The Duramont Ergonomic Office Chair features 4D adjustable lumbar support that
  moves up, down, in, and out, providing personalized lower back support. It
  includes fully adjustable armrests, lumbar support, seat height, and recline,
  all at one of the lowest prices in its category.


  ## Features


  - **4D Adjustable Lumbar Support**: Comprehensive lower back customization

  - **Thick Memory Foam Seat**: High-density foam cushion that contours to your
  body

  - **Breathable Mesh Back**: Superior airflow for all-day comfort

  - **Rollerblade Wheels**: Floor-friendly casters for smooth movement

  - **Integrated Headrest**: Built-in head and neck support

  - **Adjustable Armrests**: Height-adjustable arm support


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 120°

  - Seat Height Range: 18.5" to 22.5"

  - Warranty: 5-year manufacturer warranty

  - Recommended Use: 4-6 hours daily


  ## Pricing


  Starting at $199.99
