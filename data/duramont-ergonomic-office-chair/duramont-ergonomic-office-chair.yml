markdown: >-
  ## Overview


  The Duramont Ergonomic Office Chair is a budget-friendly ergonomic chair that
  offers an impressive feature set for its price point, making it an accessible
  option for home office users seeking comfort and adjustability without
  breaking the bank.


  ## Key Features


  - Memory foam seat cushioning

  - Breathable mesh backrest with adjustable lumbar pad

  - Integrated adjustable headrest

  - Adjustable seat height and tilt mechanism

  - Optional rollerblade wheels

  - Weight capacity: 330 lbs


  ## Comfort


  - Good balance of mesh and foam that is firm but comfortable

  - Notable for its adjustable lumbar support with 0.5 inches of depth
  adjustment range

  - Suitable for users up to 6'6" tall; the headrest works well for this height
  range


  ## Limitations


  - Lumbar adjustment range limited to 0.5 inches

  - Not ideal for very heavy users (max 330 lbs)

  - The chair is budget-friendly, so some materials may not be as premium as
  higher-end options


  ## Pricing


  - Price: $199.99
