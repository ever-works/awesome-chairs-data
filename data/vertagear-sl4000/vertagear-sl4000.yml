markdown: >-
  ## Overview


  The SL4000 gaming chair brings unparalleled levels of ergonomic comfort and
  adjustability, crafted with high-density padding and a contoured backrest for
  longer gaming sessions. As the middle child of the S-Line, it offers a
  balanced combination of aesthetics with ergonomics.


  ## Features


  - **High-Density Padding**: Extra cushioning for extended comfort

  - **Contoured Backrest**: Ergonomically shaped for natural spinal support

  - **Memory Foam Cushions**: Removable neck and lumbar support pillows

  - **4-Directional Armrests**: Ergonomically designed adjustable arms

  - **Industrial-Grade Gas Lift**: Class-4 gas lift for reliable height
  adjustment

  - **140° Recline**: Generous recline range for relaxation


  ## Specifications


  - Weight Capacity: Up to 330 lbs

  - Recline Range: 90° to 140°

  - Aluminum Alloy Base: Five-star base for stability and durability

  - Warranty: 2-year manufacturer warranty

  - Certifications: BIFMA certified


  ## Pricing


  Starting at $399.99
