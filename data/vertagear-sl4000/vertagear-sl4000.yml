name: Vertagear SL4000
description: Mid-tier racing-style gaming chair at $400 featuring high-density
  padding, contoured backrest, removable memory foam neck and lumbar cushions,
  4D adjustable armrests, 140° recline, Class-4 industrial gas lift,
  BIFMA-certified aluminum alloy base, and 330 lb weight capacity. Designed for
  gamers seeking Vertagear's S-Line ergonomics at a mid-range price point.
  Compared to the Secretlab Titan Evo at a similar price, it offers comparable
  lumbar and armrest adjustability, though it trades the Titan's integrated
  four-way lumbar dial and magnetic pillow for traditional removable cushions
  and a more restrained recline range (140° vs 165°).
