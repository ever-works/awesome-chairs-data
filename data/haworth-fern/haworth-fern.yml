markdown: >-
  ## Haworth Fern


  The **Haworth Fern** is a premium ergonomic chair introduced in 2019 that
  combines a zero-waste digital knit backrest with comprehensive adjustability.


  ## Features

  - **Digital Knit Backrest**: Soft yet supportive; flexes naturally with spine
  movement

  - **Wave Suspension System**: Dynamic support across every shift and stretch

  - **Edgeless Back Design**: Supports natural movement without restriction

  - **Stem-Based Design**: Promotes freedom of movement with stability

  - **Full adjustability**: Seat depth, lumbar, 4D arms, tilt tension


  ## Specifications

  - Weight Capacity: 350 lbs


  ## Pricing

  Pricing varies by configuration. Visit the [Haworth Fern
  page](https://store.haworth.com/products/fern-chair) for current pricing.
