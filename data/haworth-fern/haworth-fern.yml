name: Haworth Fern
description: The Haworth Fern is a premium ergonomic task chair featuring an
  edgeless digital knit backrest that flexes naturally with spine movement,
  integrated lumbar support, and a wave suspension system with full seat depth
  adjustment for users up to 350 lbs. Designed for 8+ hour all-day desk sessions
  in corporate or WFH environments, it emphasizes natural movement and
  breathability without mesh or foam panels. Compared to the Herman Miller
  Aeron's Pellicle mesh seat and the Steelcase Gesture's 3D LiveBack, the Fern's
  knit construction offers superior tactile comfort at roughly $1,000–$1,400.
