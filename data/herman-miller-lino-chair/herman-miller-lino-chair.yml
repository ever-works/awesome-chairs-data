name: Herman Miller Lino Chair
description: Herman Miller's entry-level ergonomic chair featuring a breathable
  suspension back with built-in lumbar support, adjustable seat, and adjustable
  arms in a compact minimal design. Designed for budget-conscious professionals
  who want Herman Miller's renowned build quality and 12-year warranty at a
  lower price point. Compared to the Herman Miller Aeron's larger size and
  adjustable PostureFit SL, the Lino provides similar Herman Miller ergonomics
  at roughly 55% of the Aeron's cost, making it ideal for shorter users or those
  who don't need full-scale adjustability.
