name: Autofull Bunny Chair
description: Themed gaming chair with a distinctive bunny-ear headrest cover,
  bunny tail cushion, and soft white armrest covers, featuring adjustable lumbar
  support, adjustable armrests, a 330 lb weight capacity, and recline
  functionality. Ideal for streamers, cosplayers, and aesthetic-focused gamers
  who want a viral-worthy centerpiece for their setup. Compared to the Secretlab
  Titan Evo's more understated design, the Bunny Chair prioritizes visual
  personality over ergonomic refinement and office versatility.
