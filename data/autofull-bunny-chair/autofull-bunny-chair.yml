name: Autofull Bunny Chair
description: Cute themed gaming chair optimized for stylish long-hour sits, with
  bunny-ear headrest, tail lumbar cushion, soft armrest covers, adjustable
  height/recline/lumbar, PU leather/high-density foam build supporting 330 lbs
  for cozy endurance. Features prioritize viral aesthetics alongside basic
  ergonomics. Ideal for streamers and cosplay enthusiasts building themed
  setups, it stands out visually over functional Secretlab Titan Evo but
  sacrifices pro adjustability for personality.
