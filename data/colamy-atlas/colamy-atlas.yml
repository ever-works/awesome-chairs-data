markdown: >-
  ## Overview


  The COLAMY ATLAS Ergonomic High Back Mesh Office Chair is BIFMA certified,
  offering professional-grade features and build quality with comprehensive
  adjustability designed for long work sessions and all-day comfort.


  ## Features


  - **BIFMA Certification**: Meets rigorous safety and durability standards

  - **High Back Design**: Full back support from lumbar to shoulders

  - **Premium Mesh Material**: Enhanced breathability and support

  - **Adjustable Lumbar Support**: Customizable lower back positioning

  - **Multi-Function Armrests**: Height and angle adjustable

  - **Tilt Mechanism**: Smooth reclining with lockable positions


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 125°

  - Certifications: BIFMA certified

  - Warranty: 3-year manufacturer warranty

  - Available Colors: Dark Gray, Light Gray


  ## Pricing


  Starting at $299.99 (pre-order available)
