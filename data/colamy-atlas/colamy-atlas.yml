name: Colamy Atlas
description: A BIFMA-certified high-back mesh ergonomic chair offering
  adjustable lumbar support, multi-function armrests, and a tilting mechanism
  with lockable positions for 90°–125° recline rated at up to 300 lbs. Designed
  for long work sessions where professional-grade build quality is needed at a
  mid-range price. Compared to the Herman Miller Aeron's PostureFit lumbar and
  the Steelcase Leap's adjustable back angle, the Atlas delivers comparable core
  ergonomic features with BIFMA certification at under $300.
