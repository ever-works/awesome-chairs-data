markdown: >-
  ## SIHOO Ergonomic Office Chair


  ### Features

  - **Adjustable headrest**: Height and angle adjustment for neck support

  - **Lumbar support**: Customizable lower-back alignment

  - **Recline options**: Multiple tilt positions with tension control

  - **Breathable mesh**: Airflow for extended sessions

  - **Seat height adjustment**: Standard pneumatic lift


  ### Specifications

  - Weight Capacity: 300 lbs

  - Warranty: 3-Year Warranty


  ### Pricing

  Approximately $180–$250. Visit
  [SIHOO](https://sihoooffice.com/collections/ergonomic-office-chair) for
  current pricing.
