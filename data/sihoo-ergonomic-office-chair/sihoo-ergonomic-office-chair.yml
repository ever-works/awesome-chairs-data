name: SIHOO Ergonomic Office Chair
description: The SIHOO Ergonomic Office Chair is a budget-friendly ergonomic
  chair featuring an adjustable headrest, customizable lumbar support, and
  multiple recline positions for 6–8 hour desk sessions rated up to 300 lbs.
  Designed for WFH and standard office use where basic ergonomic support is
  needed without premium pricing. Compared to the Steelcase Leap's dynamic
  LiveBack and the Herman Miller Aeron's advanced PostureFit, it provides
  simpler fixed-support ergonomics at roughly $180–$250.
