name: Humanscale Freedom Headrest Chair
description: The Humanscale Freedom with Headrest is a premium ergonomic office
  chair featuring a weight-activated self-adjusting recline that calibrates
  automatically to body weight, a pivoting backrest that tracks spinal movement,
  and a dynamic headrest that follows head motion during recline. Rated for
  users up to 300 lbs, it is ideal for corporate offices and WFH environments
  where hands-free comfort during long desk sessions or frequent reclining is
  prioritized. Compared to the Steelcase Leap's manually tuned lumbar and the
  Herman Miller Aeron's PostureFit SL, the Freedom eliminates dials and knobs
  entirely, favoring instinctive adjustment at roughly $1,900–$2,050.
