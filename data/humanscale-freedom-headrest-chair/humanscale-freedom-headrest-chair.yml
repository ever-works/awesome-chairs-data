markdown: >-
  # Humanscale Freedom Headrest Chair


  An ergonomic desk chair designed for all-day computer use, especially suited
  to people who prefer to recline while working.


  ## Features

  - **Weight-sensitive recline**: Adjusts tension automatically based on body
  weight

  - **Dynamic headrest**: Moves as you recline to support head and neck

  - **Pivoting backrest on rails**: Tracks spinal movement

  - **Eco-friendly materials**: Sustainably constructed

  - **Seat adjustment**: Height and forward/backward slide


  ## Pricing

  Approximately $1,900–$2,050 with headrest configuration. Check
  [Humanscale](https://www.humanscale.com/products/seating/freedom-headrest) for
  current pricing.
