markdown: "## Overview


  The Back App 2.0 was designed by Dr. Freddy Johnsen and features high quality
  components backed by a strong 5-year warranty. The base is composed of
  recycled aluminum with a Nitrile rubber-like material around the bottom,
  allowing the base to wobble. It is one of the only standing chairs tested that
  was still comfortable after 2+ hours of use in one sitting.


  ## Features


  - Recycled aluminum base with Nitrile rubber bottom for wobbling

  - Adjustable ball on bottom side of piston â extendable to increase tilt and
  motion range

  - Large, saddle-shaped seat with thick padding

  - Collar around the back of the seat

  - One of the few seats adjustable for motion produced by the chair


  ## Pros


  - Good build quality

  - Strong 5-year warranty

  - Wide range of motion

  - Large seat with thick padding

  - Adjustable ball allows you to change range of motion

  - Caster option for sitting mobility


  ## Cons


  - Saddle seat is not for everyone

  - Limited height range â will not adjust low enough for standard height desk

  - Costly return policy

  - May not be good for long hours


  ## Pricing


  2025 Starting Price: $599.99"
