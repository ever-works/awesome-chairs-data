name: chizzysit GC-5003-RB
description: Youth-sized gaming chair with PU leather upholstery, high-density
  sponge padding, padded lumbar pillow, RGB LED lights, and a stable 5-star
  nylon base, supporting up to 350 lbs with a recline range of 90° to 150°.
  Purpose-built for younger gamers who find adult-sized chairs too large,
  offering proper proportions and fun aesthetics for gaming and homework.
  Compared to full-size options like the Secretlab Titan Evo, it sacrifices
  armrest adjustability (fixed-arm only) and premium features but delivers
  appropriate sizing and RGB flair for kids at a lower cost.
