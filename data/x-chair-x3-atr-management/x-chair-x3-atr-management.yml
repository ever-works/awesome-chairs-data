markdown: >-
  ## Overview


  The X3 provides comfort, flexibility, and ways to get the job done with
  multilayered A.T.R. (Advanced Tensile Recovery) fabric that resists stains and
  spills. This management chair offers 10 adjustable ergonomic features for
  comprehensive customization.


  ## Features


  - **A.T.R. Fabric**: Advanced Tensile Recovery multilayered nylon

  - **Water & Stain Resistant**: Durable, easy-to-maintain upholstery

  - **Dynamic Variable Lumbar (DVL)®**: Adaptive lumbar support

  - **10 Ergonomic Adjustments**: Comprehensive customization

  - **Responsive Support**: Fabric that adapts to body movements

  - **Professional Design**: Suitable for management offices


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 125°

  - Upholstery: A.T.R. multilayered nylon fabric

  - Warranty: Extended manufacturer warranty

  - Free Shipping: In-stock items


  ## Pricing


  Starting at $799
