name: Secretlab Titan Evo
description: The Secretlab Titan Evo is a premium gaming chair designed for
  extended sessions, featuring a ColdCure foam seat for superior pressure relief
  and a magnetic memory foam head pillow for customizable neck support. Key
  features include 4D L-ADAPT armrests with 224 adjustment combinations, a
  multi-tilt mechanism up to 165° recline, and swappable skins for
  personalization. Ideal for gamers and office workers needing all-day comfort;
  compares favorably to DXRacer with better foam durability and less sagging
  over time.
