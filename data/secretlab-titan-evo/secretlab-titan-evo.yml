markdown: >-
  ## Overview


  The Secretlab Titan Evo is a premium gaming chair designed with ergonomics and
  comfort as its top priorities. This chair is engineered to support gamers and
  professionals during long sessions.


  ## Features


  - Patent-pending 4-way L-ADAPT™ Lumbar Support System

  - Full-Metal 4D Armrests with CloudSwap™

  - Magnetic Memory Foam Head Pillow

  - Cold-Cure Foam Mix

  - Multi-tilt Mechanism

  - 165° recline

  - Swappable skins


  ## Sizing


  Available in Small, Regular, XL sizes.


  ## Pricing


  Pricing starts around $500+, varies by size and material. Check official site
  for details.
