name: Secretlab Titan Evo
description: The Secretlab Titan Evo is a premium gaming chair designed for
  extended sessions, featuring a ColdCure foam seat for superior pressure
  relief, 4D adjustable armrests, and a magnetic memory foam head pillow. It
  supports up to 285 lbs with magnetic lumbar support that adapts to your shape,
  ideal for gamers and office workers needing all-day comfort. Compared to
  DXRacer models, it offers better breathability and a 5-year warranty.
