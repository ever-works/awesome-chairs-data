name: Secretlab Titan Evo
description: The Secretlab Titan Evo is a premium gaming chair designed for
  extended sessions, featuring a multi-tilt mechanism, 4D armrests, magnetic
  head pillow, and ColdCure foam for superior support. Key features include
  adjustable lumbar support, breathable NEO Hybrid Leatherette, and sizes for
  regular/small to XL users. Ideal for gamers and office workers needing all-day
  comfort; compares favorably to Razer Iskur for better durability and
  customization at similar price.
