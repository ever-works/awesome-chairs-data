name: Secretlab Titan Evo
description: The Secretlab Titan Evo is a flagship gaming chair renowned for its
  magnetic memory foam head pillow, 4D L-ADAPT lumbar support that auto-adjusts,
  and swappable skins for customization. Built with a cold-cure foam seat and
  aluminum base, it supports up to 285lbs and offers 165° recline for marathon
  sessions. Ideal for gamers and streamers; outperforms DXRacer in lumbar tech
  and warranty (5 years).
