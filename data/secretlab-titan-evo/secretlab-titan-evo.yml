name: Secretlab Titan Evo
description: The Secretlab Titan Evo delivers ergonomic excellence for prolonged
  gaming and office work, equipped with full-metal 4D armrests, patented
  magnetic memory foam head pillow, L-ADAPT magnetic lumbar support, and
  cold-cure foam for optimal pressure relief and support. Ideal for gamers in
  intense sessions and office workers requiring customizable all-day comfort
  across S/M/XL sizes. It outperforms DXRacer through premium materials like
  hybrid leatherette and advanced foam for enhanced durability and luxury.
