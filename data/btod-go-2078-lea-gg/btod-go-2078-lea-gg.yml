markdown: >-
  ## Overview


  The BTOD GO-2078-LEA-GG is a faux leather office chair designed for big and
  tall users, featuring LeatherSoft hybrid upholstery made from recycled leather
  blended with vinyl. It has a 28\" high back with a built-in headrest and is
  24/7 rated.


  ## Key Specifications


  - **Weight Capacity:** 500 lbs.

  - **Seat Width:** 22\" wide

  - **Back Height:** 28\" with built-in headrest

  - **Starting Price:** ~$593.99


  ## Features


  - LeatherSoft upholstery (recycled leather blended with vinyl) for a soft feel
  at reduced cost

  - 28\" high back design with built-in headrest

  - Oversized cushions for a cushy seating experience

  - Padded arms with matching faux leather

  - 24/7 rated for continuous use


  ## Best For


  Users looking for a leather-feel chair at an accessible price point. Good for
  those who prefer the feel of leather without the premium cost of genuine
  leather.


  ## Considerations


  - The 22\" wide seat may not comfortably fit users weighing near the 500 lb.
  capacity

  - Headrest positioning may hit shoulders rather than neck on some users
  depending on height

  - Two-year warranty on all components — shorter than higher-end options may
  not be ideal for long-term investment
