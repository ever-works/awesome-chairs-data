name: BTOD GO-2078-LEA-GG
description: A big-and-tall faux leather office chair rated for 500 lbs with a
  22" wide seat, 28" high back with built-in headrest, LeatherSoft upholstery,
  and 24/7 continuous-use rating. Built for heavy-duty environments like call
  centers, dispatch offices, and home workstations where durability and plush
  cushioning are essential. Compared to the Steelcase Leap (400 lb max) or
  Herman Miller Aeron (350 lb max), the GO-2078 delivers substantially higher
  weight capacity and cushioned comfort at a lower price, though it lacks the
  adjustable lumbar, seat depth slider, and advanced tilt mechanisms of those
  benchmarks.
