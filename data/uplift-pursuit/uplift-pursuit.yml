markdown: >-
  ## Overview


  The Uplift Pursuit is an ergonomic office chair positioned at the higher end
  of the budget range at $499. It combines a breathable mesh backrest and
  headrest with a foam seat featuring a waterfall edge to reduce thigh pressure
  and improve leg circulation.


  ## Features


  - Breathable mesh backrest and headrest

  - High-density foam seat with waterfall edge for reduced pressure and better
  circulation

  - Adjustable lumbar support with both vertical and depth adjustment (moves
  toward or away from the back)

  - Numerous adjustment points throughout including unconventional
  pull-up/push-down armrest mechanism

  - Small under-seat storage compartment for keys, wallet, or phone

  - Unique and modern design aesthetic

  - Available in black or white


  ## Specifications


  - **Colors**: Black, white

  - **Materials**: Mesh, foam

  - **Seat width**: 18.5 inches

  - **Weight limit**: 250 pounds


  ## Pricing


  Retails for $499, positioned at the higher end of the budget office chair
  category.


  ## Considerations


  - The 18.5-inch seat and 250-pound weight limit make it less ideal for larger
  or taller users

  - Armrests adjust in an unconventional way (pulled up or pushed down) which
  may take some getting used to
