name: Herman Miller Sayl
description: Designed by Yves Béhar, the Sayl celebrates a lightweight,
  sculptural philosophy with its signature 3D Intelligent elastomeric suspension
  back that flexes dynamically to cradle the spine. Its compact proportions suit
  lighter to average-framed users who want design-forward aesthetics alongside
  essential lumbar support for daily desk or WFH use. At roughly $445 it sits in
  Herman Miller's most accessible price tier, making it the brand's most
  affordable seating option.
