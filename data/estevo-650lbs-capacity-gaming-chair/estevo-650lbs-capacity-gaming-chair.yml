name: Estevo 650lbs Capacity Gaming Chair
description: Extreme heavy-duty gaming chair with 650 lb capacity, 24-inch wide
  seat, and reinforced steel frame for the largest users up to 6'10"; features
  3D armrests, 155° recline, and adjustable lumbar for marathon gaming.
  Outperforms Secretlab Titan Evo (395 lbs max) in capacity while matching
  ergonomics; ideal for bariatric gamers needing ultimate stability over DXRacer
  Tank's style. Supports extended VR or sim racing sessions without compromise.
