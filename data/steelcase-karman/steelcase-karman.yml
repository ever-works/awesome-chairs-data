name: Steelcase Karman
description: The Steelcase Karman is a lightweight (29 lbs) ergonomic task chair
  featuring LiveBack technology and a patented hybrid suspension seat that
  combines spring-like flex with integrated cushioning for all-day comfort. Its
  4D adjustable armrests, optional lumbar support, and neck pillow (high-back
  model) accommodate users from 5'0" to 6'5" up to 300 lbs across long desk
  sessions and gaming marathons. Compared to the Herman Miller Aeron's rigid
  Pellicle mesh seat and the Steelcase Leap's heavier traditional frame, the
  Karman's ultralight suspension-first design and unique Intermix textile offer
  greater breathability and modern aesthetics at roughly $1,500–$2,000.
