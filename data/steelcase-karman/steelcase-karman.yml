markdown: >-
  # Steelcase Karman


  **Brand:** Steelcase  

  **Category:** Ergonomic Office Chairs  


  A high-performance ergonomic task chair with a lightweight frame, hybrid
  suspension seat, and advanced back support designed for long sitting sessions.


  ## Features


  ### Ergonomics & Support

  - **LiveBack® technology**: Balances body weight and supports the back and
  spine, providing responsive, personalized comfort and fit.

  - **High-back option with neck support pillow**: Sculpted high back and
  adjustable neck pillow for enhanced upper body and neck support.

  - **Organic movement**: Weight-activated mechanism automatically responds to
  your body as you sit and shift, supporting posture changes in multiple
  directions.

  - **Optional lumbar support**: Adjustable lumbar feature to fine-tune support
  in the lower back region.


  ### Seat & Comfort

  - **Patented hybrid suspension seat**: Combination of suspension and
  integrated cushioning designed to stay comfortable during prolonged sitting.

  - **Comfort Edge**: Ultra-light frame flexes around the seat perimeter to
  eliminate hard edges and reduce pressure points on legs and body.

  - **Comfort Dial with 4 recline positions**: Lets you choose among four
  recline settings to adjust recline resistance to your preference.


  ### Adjustability

  - **4D adjustable arms**: Armrests can move up/down, in/out, forward/back, and
  pivot to support natural arm and shoulder positions.

  - **Adjustable neck support (high-back model)**: Neck pillow height/position
  can be tuned for different users.


  ### Materials & Construction

  - **Intermix performance textile**: Exclusive to Steelcase Karman; engineered
  for performance, comfort, and aesthetics.

  - **Ultra-light frame**: Chair structure is designed to flex for comfort and
  remove pressure points.

  - **Lightweight build**: Weighs approximately 29 lbs while maintaining
  strength and durability.


  ### Sustainability

  - **Responsible design approach**:
    - Uses sustainable materials where possible.
    - Minimizes number of components to reduce material use.
    - Lightweight construction helps lower resource consumption and environmental impact.

  ## Pricing


  Pricing ranges from approximately $1,500 to $2,000 depending on configuration.
  Visit the [Steelcase Karman product
  page](https://www.steelcase.com/products/office-chairs/steelcase-karman/) for
  current pricing.
