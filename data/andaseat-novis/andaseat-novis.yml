markdown: >-
  ## Overview


  AndaSeat Novis series delivers ergonomic support for gaming and office
  environments at a budget premium price point.


  ## Features


  - Dynamic lumbar support

  - 4D adjustable arms

  - PU leather upholstery

  - Included footrest

  - Recliner function (up to 160°)

  - Dense foam padding


  ## Pricing


  Starting at $249.99
