name: AndaSeat Novis
description: Crafted for marathon gaming sessions exceeding 10 hours, the
  AndaSeat Novis integrates dynamic lumbar tracking, 4D armrests, breathable PU
  leather with high-density foam, included footrest, and 160° recline to
  minimize fatigue and enhance immersion. Its robust materials prioritize
  durability for daily heavy use. Ideal for esports trainees and live streamers;
  surpasses budget GTracing chairs in adjustability and rivals premium AndaSeat
  Phantoms in features at a lower price point.
