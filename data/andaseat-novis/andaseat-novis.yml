markdown: >-
  ## Overview


  The AndaSeat Novis is recommended as a reliable budget choice with dense foam
  padding at under $300. This chair offers solid ergonomic features and quality
  construction without the premium price tag.


  ## Features


  - **Dense Foam Padding**: High-quality foam for lasting comfort

  - **6D Armrests**: Advanced armrest adjustability typically found in premium
  chairs

  - **PVC Leather Upholstery**: Durable and easy-to-clean material

  - **Ergonomic Design**: Racing-style with lumbar and neck support

  - **Recline Function**: Adjustable backrest for various positions

  - **Sturdy Base**: Metal frame construction for stability


  ## Specifications


  - Weight Capacity: Up to 300 lbs

  - Recline Range: 90° to 160°

  - Seat Dimensions: Standard size for average users

  - Warranty: 1-year manufacturer warranty


  ## Pricing


  Starting at $249.99
