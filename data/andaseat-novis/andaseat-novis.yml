name: AndaSeat Novis
description: The AndaSeat Novis enables 10+ hour immersive gaming or work shifts
  with dynamic lumbar tracking, 4D armrests, breathable PU leather and
  high-density foam, footrest inclusion, and 160° recline to fight fatigue
  effectively. Robust construction suits heavy daily loads. Tailored for esports
  hopefuls and broadcasters, it beats budget GTracing in features and undercuts
  premium AndaSeat Phantoms while matching endurance to Herman Miller standards.
